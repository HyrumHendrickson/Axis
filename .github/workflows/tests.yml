name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.13"]
        include:
          - os: ubuntu-latest
            python: "3.9"     # the oldest version Axis supports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check that the package has no dependencies
        shell: bash
        run: grep -q '^dependencies = \[\]' pyproject.toml
      - name: Run the tests
        env:
          AXIS_NO_UPDATE_CHECK: "1"
          AXIS_NO_ENGINE_INSTALL: "1"
          AXIS_NO_SHORTCUT: "1"
        run: python -m unittest discover -s tests -v
      - name: Build the package
        run: |
          python -m pip install --upgrade build
          python -m build

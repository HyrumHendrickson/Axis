  const picked = (e.ctrlKey || e.metaKey) && lower === "c" ? String(window.getSelection() || "") : "";
  if (picked) { e.preventDefault(); copyText(picked, "Copied"); return; }           // Ctrl+C with text selected copies it
  if (e.metaKey || !ctrl) return;
  if (lower === "c") {                                                              // Ctrl+C: drop the line and stop the command
    e.preventDefault(); b.line = ""; b.pos = 0; drawTermOut(true);
    if (t.shell !== "cmd") termInterrupt();                                         // Windows cannot stop a command without closing the terminal
  } else if (lower === "l") edit(() => termClear());
  else if (lower === "u") edit(() => { b.line = b.line.slice(b.pos); b.pos = 0; });
  else if (lower === "k") edit(() => { b.line = b.line.slice(0, b.pos); });
  else if (lower === "w") edit(() => cut(wordStart(b.line, b.pos)));

// Text that was typed or pasted into the hidden text box.
function termInput(e) {

}
function termInsert(text) {
  const t = activeTerm();
  if (!t || !t.alive) return;
  const b = termBuf(t.id);
  const parts = text.replace(/\r\n?/g, "\n").replace(/[\x00-\x08\x0b-\x1f\x7f]/g, "").split("\n");
  let runs = parts.length - 1;                                    // lines the text would run
  if (runs === 1 && parts[1] === "") runs = 0;                    // one line and its closing newline: put it on the line, do not run it unasked
  if (runs > 0 && !confirm(`Run ${runs} line${runs === 1 ? "" : "s"} in the terminal?\n\n${parts.slice(0, runs).join("\n").slice(0, 400)}`)) return;
  parts.forEach((part, i) => {
    b.line = b.line.slice(0, b.pos) + part + b.line.slice(b.pos); b.pos += part.length;
    if (i < runs) termSubmit();
  });
  drawTermOut(true);
}

  for (const j of d.jobs || []) {
    if (j.state === "running" || jobsSeen.has(j.id)) continue;
    jobsSeen.add(j.id);
    if (first) continue;   // finished before this page opened: nothing to announce
    finished = true;
    if (j.engine === "image" || j.engine === "engine") imageDone = true;
    if (j.engine === "ocr" || (j.engine === "engine" && OCR_ENGINES.includes(j.target))) ocrDone = true;

    if (ocrDone) loadOcr().then(() => { if (S.view.kind === "ocr" && !S.ocrJob) renderOcr(); });

function updateJobProgress(d) {

async function deleteImage(img) {
  if (!confirm(`Delete ${img.file}? This cannot be undone.`)) return;
  try { await api(filesUrl(img.place, "", img.path), { method: "DELETE" }); }
  catch (e) { return toast(e.message); }
  toast("Deleted");
  S.imageSelected = null; drawStage(); loadGallery();
}

async function generateImage() {
  if (S.imageJob) return;
  const f = imageForm();
  const prompt = (($("ig-prompt") || {}).value ?? f.prompt ?? "").trim();
  if (!prompt) { toast(f.mode === "edit" ? "Describe what the edited picture should look like." : "Write a prompt first."); return; }
  const editing = f.mode === "edit";
  if (editing && !f.source) { toast("Choose a picture to edit first."); return; }
  const keepShape = editing && f.matchSource;
  const shape = keepShape ? editSize(f) : null;
  f.prompt = prompt; saveImageForm();
  const job = S.imageJob = { controller: new AbortController(), started: Date.now(), prompt, phase: "", progress: null, log: "", queued: false,
    preview: null, width: shape ? shape[0] : f.width, height: shape ? shape[1] : f.height };
  S.imageError = null;
  streamsChanged();
  if (S.view.kind === "images") renderImages();
  let frame = 0;
  const paint = () => { frame = 0; if (S.view.kind === "images") drawStage(); };
  const schedule = () => { if (!frame) frame = setTimeout(paint, 120); };
  let result = null, error = null;
  try {
    const body = { place: SHARED, model: f.model, prompt, negative_prompt: f.negative_prompt || "", width: f.width, height: f.height,
      steps: f.steps, cfg_scale: f.cfg_scale, sampler: f.sampler || "", seed: f.seed ?? -1, preview: S.imagePreview };
    if (editing) {
      body.init_image = f.source; body.strength = f.strength ?? 0.6;
      if (keepShape) { delete body.width; delete body.height; }   // Axis keeps the source's shape
    }
    const res = await fetch("/api/images/generate", { method: "POST", signal: job.controller.signal,
      headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(d.error || `Request failed (${res.status}).`); }
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
        if (!line) continue;
        let ev; try { ev = JSON.parse(line); } catch { continue; }
        if (ev.queued) job.queued = true;
        if (ev.phase) { job.phase = ev.phase; job.queued = false; }
        if (ev.progress) job.progress = ev.progress;
        if (ev.preview) job.preview = ev.preview;
        if (ev.log) job.log = ev.log;
        if (ev.image) result = ev.image;
        if (ev.error) error = ev.error;
        schedule();
      }
    }
  } catch (e) {
    if (e.name !== "AbortError") error = e.name === "TypeError" ? "Axis is not responding. Check that the axis window is still open." : e.message;
  }
  clearTimeout(frame);
  S.imageJob = null;
  if (result) { S.imageSelected = { ...result, place: SHARED }; S.galleryPlace = SHARED; }
  else if (error) S.imageError = error;
  if (document.hidden && result) S.unseen = true;
  streamsChanged();
  if (S.view.kind === "images") renderImages();
  else if (result || error) toast(error ? "The picture failed" : "Picture ready");
  loadImages();
}

function loadArt() {

    .then((d) => { const before = S.art; S.art = d; onArt(before, d); })
    .catch((e) => { if (!S.art || !S.art.apps) S.art = { error: e.message, apps: [], jobs: [] }; })

function onArt(before, d) {
  let finished = false;
  for (const j of d.jobs || []) {
    if (j.state === "running" || jobsSeen.has(j.id)) continue;
    jobsSeen.add(j.id);
    if (!before) continue;   // finished before this page opened: nothing to announce
    finished = true;
    if (j.state === "done") toast(`Installed ${(j.result && j.result.model) || j.target}`);
    else if (j.state === "failed") toast(j.label + " failed. Details are on the Art Craft page.");
  }
  if (artSig(before) !== artSig(d)) renderNav();

  else updateJobProgress(d);
}

      h("span", { class: "elapsed", "data-since": String(job.started) }, elapsedText(job.started))),
    h("div", { class: "ig-progress indef" }, h("i"))));
  if (S.ocrError) return fill(box, h("div", { class: "ig-stage" }, h("p", { class: "form-error", style: "white-space:pre-wrap;margin:0" }, S.ocrError)));
  if (!r) return fill(box, h("div", { class: "ig-stage" }, h("div", { class: "empty", style: "margin:6vh auto" },
    h("h3", {}, "No text yet"), h("p", {}, "Choose a picture and click Read text. The text appears here, where you can correct, copy or save it."))));
  const text = h("textarea", { class: "ocr-text", "aria-label": "Text found in the picture", spellcheck: "false", oninput: (e) => { r.text = e.target.value; } });
  text.value = r.text || "";
  const ref = parseSource(r.source);
  const stem = ref ? ref.path.split("/").pop().replace(/\.[^.]+$/, "") : "ocr";
  const meta = [r.name, r.words !== undefined && `${r.words} word${r.words === 1 ? "" : "s"}`,
    typeof r.confidence === "number" && `confidence ${r.confidence}%`, r.device && r.device !== "cpu" && `on ${r.device.toUpperCase()}`,
    r.seconds !== undefined && `${r.seconds} s`].filter(Boolean).join(" \u00b7 ");
  fill(box, h("div", { class: "ig-stage" },
    ref ? h("img", { class: "ocr-pic", src: imageUrl(ref.place, ref.path), alt: "The picture that was read" }) : null,
    r.text ? text : h("p", { class: "hint" }, "No text was found. Try another page layout or model, or a sharper picture."),
    h("p", { class: "ig-meta" }, meta),
    r.text ? h("div", { class: "fb-actions", style: "margin:10px 0 0" },
      h("button", { class: "btn small", onclick: () => copyText(r.text, "Text") }, "Copy"),
      h("button", { class: "btn small", onclick: async () => {
        try {
          const path = await uploadPicture(SHARED, "ocr", stem + ".txt", new Blob([r.text], { type: "text/plain" }));
          toast("Saved as shared/" + path); openInWorkspace(SHARED, path, true);
        } catch (e) { toast(e.message); } } }, "Save to Workspace"),
      h("button", { class: "btn small", onclick: () => download(stem + ".txt", r.text, "text/plain") }, "Download .txt")) : null));
}

async function runOcr() {
  if (S.ocrJob) return;
  const f = S.ocrForm, model = ocrModel(f.model);
  if (!model || !f.source) return;
  const job = S.ocrJob = { controller: new AbortController(), started: Date.now(), phase: "" };
  S.ocrResult = null; S.ocrError = null;
  renderNav(); if (S.view.kind === "ocr") renderOcr();
  let result = null, error = null;
  try {
    const body = { model: f.model, image: f.source };
    if (model.engine === "tesseract") Object.assign(body, { languages: (f.languages || model.model).trim(), psm: Number(f.psm || 3) });
    const res = await fetch("/api/ocr/run", { method: "POST", signal: job.controller.signal,
      headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(d.error || `Request failed (${res.status}).`); }
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
        if (!line) continue;
        let ev; try { ev = JSON.parse(line); } catch { continue; }
        if (ev.phase) { job.phase = ev.phase; if (S.view.kind === "ocr") drawOcr(); }
        if (ev.result) result = ev.result;
        if (ev.error) error = ev.error;
      }
    }
  } catch (e) {
    if (e.name !== "AbortError") error = e.name === "TypeError" ? "Axis is not responding. Check that the Axis window is still open." : e.message;
  }
  S.ocrJob = null;
  if (result) S.ocrResult = result;
  else if (error) S.ocrError = error;
  renderNav();
  if (S.view.kind === "ocr") renderOcr();
  else if (result || error) toast(error ? "Reading the text failed" : "Text ready on the OCR page");
}

/* ---------------------------------------------------------------- skills */
function renderSkills() {
  const builtin = S.skills.filter((sk) => sk.builtin);
  const custom = S.skills.filter((sk) => !sk.builtin);
  const usedBy = (id) => S.agents.filter((a) => a.skills.includes(id)).map((a) => a.name);
  const users = (id) => { const u = usedBy(id); return u.length ? "Used by " + u.join(", ") : "Not used by any agent"; };

  const editor = (sk, onDone) => {
    const err = h("p", { class: "form-error", role: "alert", hidden: true });
    const name = h("input", { type: "text", value: sk ? sk.name : "", maxlength: 80, placeholder: "for example: Plain English", "aria-label": "Skill name" });
    const desc = h("input", { type: "text", value: sk ? sk.description : "", maxlength: 300, placeholder: "One line shown when choosing skills", "aria-label": "Description" });
    const instr = h("textarea", { rows: 5, placeholder: "What the agent should do when using this skill", "aria-label": "Instructions" });
    instr.value = sk ? sk.instructions : "";
    const save = async () => {
      err.hidden = true;
      const data = { name: name.value, description: desc.value, instructions: instr.value };
      try {
        if (sk) await api("/api/skills/" + encodeURIComponent(sk.id), { method: "PUT", body: data });
        else await api("/api/skills", { method: "POST", body: data });
        await loadSkills(); toast(sk ? "Skill saved" : "Skill created"); onDone();
      } catch (e) { err.textContent = e.message; err.hidden = false; }
    };
    const form = h("form", { class: "form skill-card", onsubmit: (e) => { e.preventDefault(); save(); } }, err,
      sk && sk.builtin ? h("p", { class: "hint" }, "This skill is built in. You can change what it tells the model; its actions stay as they are. Reset to default on its card undoes your changes.") : null,
      h("div", { class: "field" }, h("label", {}, "Name"), name),
      h("div", { class: "field" }, h("label", {}, "Description"), desc),
      h("div", { class: "field" }, h("label", {}, "Instructions"), instr),
      h("div", { class: "form-actions" },
        h("button", { class: "btn primary", type: "submit" }, sk ? "Save skill" : "Create skill"),
        h("button", { class: "btn", type: "button", onclick: onDone }, "Cancel")));
    setTimeout(() => name.focus(), 0);
    return form;
  };

  // Everything the skill sends to the model, fetched from Axis each time it is opened so it always matches the saved text.
  const sendsView = (sk) => {
    const body = h("div", {}, h("p", { class: "hint" }, "Loading\u2026"));
    const d = h("details", { class: "sends", ontoggle: () => { if (d.open) load(); } },
      h("summary", {}, "What this sends to the model"), body);
    async function load() {
      try {
        const x = await api(`/api/skills/${encodeURIComponent(sk.id)}/sends`);
        fill(body,
          h("div", { class: "step-label" }, "Added to the system message"), h("pre", {}, x.system),
          x.tools.length ? [
            h("div", { class: "step-label" }, "Actions given to the model"), h("pre", {}, JSON.stringify(x.tools, null, 2)),
            h("details", { class: "sends-sub" }, h("summary", {}, "The same actions as text, for a model without tool support"), h("pre", {}, x.tools_text)),
          ] : h("p", { class: "hint" }, "This skill gives the model no actions. It only adds the text above."),
          x.notes.map((n) => h("p", { class: "hint" }, n)));
      } catch (e) { fill(body, h("p", { class: "form-error" }, e.message)); }
    }
    return d;
  };

  const resetSkill = async (sk) => {
    if (!confirm(`Put ${sk.name} back to its default text? Your changes to it are lost.`)) return;
    try { await api("/api/skills/" + encodeURIComponent(sk.id) + "/reset", { method: "POST" }); await loadSkills(); toast("Back to the default"); renderSkills(); }
    catch (e) { toast(e.message); }
  };
  const deleteSkill = async (sk) => {
    if (!confirm(`Delete the skill ${sk.name}? Agents using it will stop using it.`)) return;
    try { await api("/api/skills/" + encodeURIComponent(sk.id), { method: "DELETE" });
          await Promise.all([loadSkills(), loadAgents()]); toast("Skill deleted"); renderSkills(); }
    catch (e) { toast(e.message); }
  };
  const skillCard = (sk) => {
    const card = h("div", { class: "skill-card" },
      h("h4", {}, h("span", { class: "skill-name" }, sk.name,
          sk.builtin ? h("span", { class: "tag" }, "Built in") : null, sk.modified ? h("span", { class: "tag edited" }, "Edited") : null),
        h("span", { class: "skill-tools" },
          h("button", { class: "link", onclick: () => card.replaceWith(editor(sk, renderSkills)) }, "Edit"),
          sk.builtin ? h("button", { class: "link", disabled: !sk.modified, title: sk.modified ? "Put the text back the way Axis ships it" : "Already the default",
            onclick: () => resetSkill(sk) }, "Reset to default") : null,
          sk.builtin ? null : h("button", { class: "link", style: "color:var(--bad)", onclick: () => deleteSkill(sk) }, "Delete"))),
      sk.description ? h("p", {}, sk.description) : null,
      h("p", {}, users(sk.id)),
      sendsView(sk));
    return card;
  };

  const newSlot = h("div", {});
  $("main").replaceChildren(
    h("div", { class: "bar" }, menuButton(), h("h2", {}, "Skills"),
      h("button", { class: "btn small primary", onclick: () => fill(newSlot, editor(null, renderSkills)) }, "New skill")),
    h("div", { class: "editor" }, h("div", { class: "form" },
      newSlot,
      h("div", { class: "skill-group" }, h("h3", {}, "Your skills"),
        h("p", { class: "hint" }, "Instructions you write once and give to any agent. Choose them in each agent\u2019s settings."),
        custom.length ? custom.map(skillCard) : h("p", { class: "hint" }, "None yet. Click New skill to make one.")),
      h("div", { class: "skill-group" }, h("h3", {}, "Built-in actions"),
        h("p", { class: "hint" }, "These let an agent act: files, Python, Rust, terminal code, web search, Wikipedia and image generation. File actions reach only the agent\u2019s own folder, plus the shared folder for agents given Shared folder. Edit changes what a skill tells the model; Reset to default undoes it."),
        builtin.map(skillCard)))));
}

/* ---------------------------------------------------------------- update */
let updTimer = null, updOpen = false;
async function refreshUpdate() {
  clearTimeout(updTimer);
  try { S.update = await api("/api/update"); } catch { S.update = null; }
  renderUpdate();
  const st = S.update && S.update.status;
  if (st === "checking" || st === "updating") updTimer = setTimeout(refreshUpdate, 1500);
}
async function recheckUpdate() {
  try { S.update = await api("/api/update/check", { method: "POST" }); } catch (e) { toast(e.message); return; }
  renderUpdate();
  clearTimeout(updTimer);
  updTimer = setTimeout(refreshUpdate, 1500);
}
setInterval(refreshUpdate, 30 * 60 * 1000);   // a long-running Axis looks for updates again
async function startUpdate() {
  try { S.update = await api("/api/update", { method: "POST" }); } catch (e) { toast(e.message); return; }
  renderUpdate();
  updTimer = setTimeout(refreshUpdate, 1500);
}
function renderUpdate() {
  const u = S.update, st = u ? u.status : "";
  const badge = {
    current:  ["ok", "Up to date", false],
    outdated: ["warn", "Out of date", true],
    updating: ["busy", "Updating\u2026", true],
    updated:  ["ok", "Restart Axis", true],
    failed:   ["bad", "Update failed", true],
    unknown:  ["", "Update check failed", true],
  }[st];
  if (!badge) { fill($("upd")); fill($("upd-pop")); return; }   // checking or turned off: show nothing
  const [tone, label, clickable] = badge;
  const title = st === "current" ? `Axis ${u.current} is the newest version`
    + (u.compared ? "" : " (version number checked; GitHub did not answer the file check)") : null;
  fill($("upd"), clickable
    ? h("button", { class: "upd " + tone, "aria-expanded": updOpen ? "true" : "false",
        onclick: (e) => { e.stopPropagation(); updOpen = !updOpen; renderUpdate(); } }, label)
    : h("span", { class: "upd " + tone, title }, label));
  if (!clickable || !updOpen) { fill($("upd-pop")); return; }
  const close = h("button", { class: "btn small", onclick: () => { updOpen = false; renderUpdate(); } }, "Close");
  let body;
  const sameVersion = u.latest === u.current;
  if (st === "outdated") body = [
    h("h3", {}, sameVersion ? `A newer build of Axis ${u.current} is available` : `Axis ${u.latest} is available`),
    h("p", {}, (sameVersion
        ? `${u.changed} file${u.changed === 1 ? "" : "s"} changed on GitHub` + (u.commit ? ` (commit ${u.commit.slice(0, 7)})` : "") + ". "
        : `You have ${u.current}. `)
      + "Updating replaces the program only; your agents, skills, chats and files are kept."),
    h("div", { class: "row" }, close, h("button", { class: "btn small primary", onclick: startUpdate }, "Update now"))];
  else if (st === "updating") body = [
    h("h3", {}, "Updating Axis\u2026"),
    h("p", {}, "Downloading and installing from GitHub. This can take a minute; you can keep using Axis meanwhile."),
    h("div", { class: "row" }, close)];
  else if (st === "updated") body = [
    h("h3", {}, `Axis ${u.installed || u.latest || ""} is installed`.trim()),
    h("p", {}, "Restart Axis to use it: press Ctrl+C in the window running axis, run axis again, then reload this page."),
    h("div", { class: "row" }, close)];
  else if (st === "unknown") body = [
    h("h3", {}, "Axis could not check for updates"),
    h("p", {}, u.error || "GitHub did not answer."),
    h("p", {}, "You can update from a terminal at any time: ", h("code", {}, u.command)),
    h("div", { class: "row" }, close, h("button", { class: "btn small primary", onclick: recheckUpdate }, "Check again"))];
  else body = [
    h("h3", {}, "The update did not install"),
    h("p", {}, u.error || "pip reported an error."),
    u.log ? h("pre", {}, u.log) : null,
    h("p", {}, "You can also update from a terminal: ", h("code", {}, u.command)),
    h("div", { class: "row" }, close, h("button", { class: "btn small primary", onclick: startUpdate }, "Try again"))];
  fill($("upd-pop"), h("div", { class: "upd-pop", role: "dialog", "aria-label": "Axis update", onclick: (e) => e.stopPropagation() }, body));
}
document.addEventListener("click", () => { if (updOpen) { updOpen = false; renderUpdate(); } });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && updOpen) { updOpen = false; renderUpdate(); } });

/* ------------------------------------------------------------- window */
// Axis stops when its own window is closed. The page reports itself every few seconds and says
// goodbye when it closes, so the server knows when the last Axis page is gone.
const PAGE_ID = Math.random().toString(36).slice(2) + Date.now().toString(36);
let closesWithWindow = false;
async function reportPage() {
  try { closesWithWindow = !!(await api(`/api/page?id=${PAGE_ID}`, { method: "POST" })).closeWithWindow; } catch { /* Axis stopped */ }
}
window.addEventListener("pagehide", () => {
  try { navigator.sendBeacon(`/api/page?id=${PAGE_ID}&closing=1`); } catch { /* nothing to tell */ }
});
window.addEventListener("pageshow", (e) => { if (e.persisted) reportPage(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) reportPage(); });
window.addEventListener("beforeunload", (e) => {
  if (S.editing && S.editing.dirty) { e.preventDefault(); e.returnValue = ""; return; }   // unsaved changes in Workspace
  // Closing the window stops Axis, so warn before cutting off a reply, a picture or an install.
  if (!closesWithWindow || (S.status && S.status.axisDown)) return;
  if (Object.keys(S.streams).length > 0 || !!S.imageJob || !!S.ocrJob || runningJobs(S.manage).length > 0 || runningJobs(S.art).length > 0) {
    e.preventDefault(); e.returnValue = "";
  }
});

/* ------------------------------------------------------------------ start */
(async function start() {
  reportPage();
  setInterval(reportPage, 5000);
  const drafts = recall("axis.drafts", {});
  if (drafts && typeof drafts === "object" && !Array.isArray(drafts)) S.drafts = drafts;
  const current = recall("axis.current", {});
  if (current && typeof current === "object" && !Array.isArray(current)) S.current = current;
  const form = recall("axis.imageForm", null);
  if (form && typeof form === "object" && !Array.isArray(form)) Object.assign(S.imageForm, form);
  S.imagePreview = recall("axis.imagePreview", true) !== false;
  const ocrForm = recall("axis.ocrForm", null);
  if (ocrForm && typeof ocrForm === "object" && !Array.isArray(ocrForm)) Object.assign(S.ocrForm, ocrForm);
  const ide = recall("axis.ide", null);
  if (ide && typeof ide === "object" && !Array.isArray(ide)) {
    S.ide.side = ide.side === true; S.ide.dock = ide.dock === true;
    S.ide.agent = typeof ide.agent === "string" ? ide.agent : "";
    if (Number.isFinite(ide.dockH)) S.ide.dockH = Math.min(1200, Math.max(DOCK_MIN, ide.dockH));
  }
  S.term.side = recall("axis.termSide", true) !== false;
  S.term.agent = String(recall("axis.termAgent", "") || "");
  const tab = recall("axis.modelsTab", "chat");
  if (MODEL_TABS.some(([k]) => k === tab)) S.modelsTab = tab;
  const attached = recall("axis.attachments", {});
  if (attached && typeof attached === "object" && !Array.isArray(attached))
    for (const [k, v] of Object.entries(attached)) if (Array.isArray(v)) S.attachments[k] = v.filter((a) => a && typeof a.path === "string").slice(0, MAX_ATTACH);
  await Promise.all([refreshStatus(), loadAgents(), loadSkills(), loadTerminals()]);
  renderNav();
  await migrateOldChats();
  renderMain();
  loadModels();
  loadImages();
  loadOcr();
  loadManage();
  refreshUpdate();
  setInterval(refreshStatus, 4000);
  setInterval(tick, 1000);
})();
</script>

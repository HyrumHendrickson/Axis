<style>
:root {
  /* from the Axis logo: tan #D4A574, ink #151515, off-white #EBEAE7 */
  --bg: #ebeae7; --surface: #f7f6f3; --ink: #151515; --muted: #5c5249; --line: #d3cfc8; --code: #efede9;
  --panel: #d4a574; --panel-ink: #151515; --panel-muted: #3e2f20; --panel-hover: rgba(255,255,255,.28);
  --panel-active: rgba(255,255,255,.55); --panel-line: rgba(21,21,21,.16);
  --accent: #151515; --accent-ink: #ebeae7; --accent-soft: #f0dfc9; --link: #875420; --tan: #d4a574;
  --ok: #1c5e34; --bad: #8e1b12; --warn: #6b3300;
  --serif: "Palatino Linotype", "Book Antiqua", Palatino, "URW Palladio L", Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151515; --surface: #221e1b; --ink: #ebeae7; --muted: #a89d90; --line: #3a332c; --code: #1a1714;
    --panel: #1c1814; --panel-ink: #ebeae7; --panel-muted: #a89d90; --panel-hover: rgba(212,165,116,.10);
    --panel-active: rgba(212,165,116,.20); --panel-line: #2e2822;
    --accent: #d4a574; --accent-ink: #151515; --accent-soft: #3a2c1e; --link: #d4a574;
    --ok: #5bc48a; --bad: #f07a68; --warn: #e8a34a;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { display: grid; grid-template-columns: 272px 1fr; height: 100%; }

/* ---------- sidebar ---------- */
.side { background: var(--panel); color: var(--panel-ink); border-right: 1px solid var(--panel-line); display: flex; flex-direction: column; min-height: 0; }
.brand { padding: 20px 20px 0; }
.brand-row { display: flex; align-items: center; gap: 12px; }
.brand img { width: 44px; height: 44px; border-radius: 10px; box-shadow: 0 0 0 1px var(--panel-line); }
.brand h1 { font: 400 32px/1 var(--serif); letter-spacing: .02em; margin: 0; }
.axisline { height: 3px; margin: 16px 0 0; border-radius: 2px; background: var(--panel-muted); transition: background .4s; }
.axisline.ok { background: var(--ok); } .axisline.bad { background: var(--bad); } .axisline.warn { background: var(--warn); }
.status { padding: 14px 20px 18px; border-bottom: 1px solid var(--panel-line); }
.status-title { font-weight: 600; display: flex; align-items: center; gap: 8px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--panel-muted); flex: none; }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); }
.status-detail { color: var(--panel-muted); font-size: 13px; margin-top: 4px; overflow-wrap: anywhere; }
.status-models { list-style: none; padding: 0; margin: 6px 0 0; font: 13px/1.6 var(--mono); }
.nav { flex: 1; overflow-y: auto; padding: 12px 10px 20px; }
.side :focus-visible { outline-color: var(--panel-ink); }
.nav h2 { font: 600 13px/1 var(--sans); color: var(--panel-muted); margin: 18px 10px 8px; display: flex; justify-content: space-between; align-items: center; }
.nav-item { display: block; width: 100%; text-align: left; border: 0; background: none; color: var(--panel-ink); padding: 8px 10px; border-radius: 6px; cursor: pointer; }
.nav-item:hover { background: var(--panel-hover); }
.nav-item[aria-current="true"] { background: var(--panel-active); box-shadow: inset 3px 0 0 var(--panel-ink); }
.nav-item small { display: block; color: var(--panel-muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-empty { color: var(--panel-muted); font-size: 13px; padding: 4px 10px; }

/* ---------- buttons ---------- */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 14px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
a.btn { display: inline-block; text-decoration: none; color: var(--ink); line-height: 1.5; }
.side .link { color: var(--panel-ink); text-decoration: underline; text-underline-offset: 3px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.danger { color: var(--bad); }
.btn.small { padding: 3px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.link { border: 0; background: none; color: var(--link); cursor: pointer; padding: 0; font-size: 13px; font-weight: 600; }

/* ---------- main ---------- */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.bar { display: flex; align-items: center; gap: 12px; padding: 12px 24px; border-bottom: 1px solid var(--line); background: var(--surface); flex-wrap: wrap; }
.bar h2 { font: 400 22px/1.2 var(--serif); margin: 0; flex: 1; min-width: 120px; overflow-wrap: anywhere; }
.bar label { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; }
select { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 8px; max-width: 240px; }
.menu-btn { display: none; }
.note { padding: 8px 24px; font-size: 13px; color: var(--warn); background: var(--surface); border-bottom: 1px solid var(--line); }

.thread { flex: 1; overflow-y: auto; padding: 24px; }
.thread-inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.msg { max-width: 100%; }
.msg.user { align-self: flex-end; background: var(--accent-soft); padding: 10px 14px; border-radius: 12px 12px 2px 12px; white-space: pre-wrap; overflow-wrap: anywhere; max-width: 85%; }
.msg.ai { overflow-wrap: anywhere; }
.msg.ai > :first-child { margin-top: 0; } .msg.ai > :last-child { margin-bottom: 0; }
.msg.ai pre { background: var(--code); border: 1px solid var(--line); border-radius: 6px; padding: 12px; overflow-x: auto; font: 13px/1.5 var(--mono); }
.msg.ai code { font-family: var(--mono); font-size: .9em; background: var(--code); padding: 1px 4px; border-radius: 4px; }
.msg.ai pre code { background: none; padding: 0; font-size: inherit; }
.msg.ai h3, .msg.ai h4 { font-family: var(--serif); font-weight: 600; margin: 1em 0 .4em; }
.msg-tools { margin-top: 6px; display: flex; gap: 12px; }
.msg.error { color: var(--bad); border-left: 3px solid var(--bad); padding: 4px 12px; white-space: pre-wrap; }
.typing { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; padding: 4px 0; }
.typing-label { animation: pulse 1.6s ease-in-out infinite; }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--tan); animation: bounce 1.2s infinite ease-in-out; }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
.elapsed { font: 12px/1 var(--mono); color: var(--muted); }
@keyframes pulse { 50% { opacity: .45; } }
@keyframes bounce { 0%, 80%, 100% { transform: scale(.55); opacity: .5; } 40% { transform: scale(1); opacity: 1; } }
@keyframes spin { to { transform: rotate(360deg); } }
.msg.ai pre { position: relative; }
.code-copy { position: absolute; top: 6px; right: 6px; font: 600 11px/1 var(--sans); padding: 4px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--muted); cursor: pointer; opacity: 0; transition: opacity .15s; }
.msg.ai pre:hover .code-copy, .code-copy:focus-visible { opacity: 1; }
.msg-tools { align-items: baseline; flex-wrap: wrap; }
.msg-stats { color: var(--muted); font-size: 12px; }
.msg-note { color: var(--muted); font-size: 12px; font-style: italic; }
.nav-item.busy small { color: var(--panel-ink); }
.busy-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--panel-ink); margin-right: 6px; animation: pulse 1.2s infinite; vertical-align: middle; }
.meter { display: inline-block; width: 70px; height: 6px; border-radius: 3px; background: var(--line); vertical-align: middle; margin: 0 6px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ok); }
.meter.warn i { background: var(--warn); } .meter.bad i { background: var(--bad); }
.empty { color: var(--muted); text-align: center; margin: 12vh auto 0; max-width: 460px; }
.empty h3 { font: 400 24px/1.3 var(--serif); color: var(--ink); margin: 0 0 8px; }

.composer { border-top: 1px solid var(--line); background: var(--surface); padding: 14px 24px 18px; }
.composer-inner { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
.composer textarea { flex: 1; resize: none; min-height: 44px; max-height: 220px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--surface); }
.composer-hint { max-width: 760px; margin: 6px auto 0; font-size: 12px; color: var(--muted); }

/* ---------- gate ---------- */
.gate { max-width: 620px; margin: 8vh auto 0; }
.gate h3 { font: 400 26px/1.3 var(--serif); margin: 0 0 6px; }
.gate p { color: var(--muted); margin: 0 0 18px; }
.gate h4 { margin: 20px 0 6px; font-size: 15px; }
.gate ol { margin: 0; padding-left: 20px; }
.gate li { margin: 4px 0; }
.cmd { display: flex; align-items: center; gap: 8px; background: var(--code); border: 1px solid var(--line); border-radius: 6px; padding: 6px 6px 6px 12px; margin: 6px 0; }
.cmd code { flex: 1; font: 13px/1.5 var(--mono); overflow-x: auto; white-space: nowrap; }

/* ---------- editor ---------- */
.editor { flex: 1; overflow-y: auto; padding: 24px; }
.form { max-width: 720px; margin: 0 auto; }
.field { margin-bottom: 22px; }
.field > label, .section-head h3 { display: block; font-weight: 600; margin-bottom: 4px; }
.hint { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
.form input[type=text], .form textarea { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--surface); }
.form textarea { resize: vertical; min-height: 90px; }
.section { border-top: 1px solid var(--line); padding-top: 18px; margin-top: 8px; margin-bottom: 22px; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.section-head h3 { font: 400 20px/1.3 var(--serif); margin: 0; }
.row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
.row input { flex: 1; }
.skill { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 10px; background: var(--surface); }
.skill.off { opacity: .65; }
.skill .row { margin-bottom: 8px; }
.switch { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; cursor: pointer; }
.switch input { width: 16px; height: 16px; accent-color: var(--accent); }
.form-actions { display: flex; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 18px; }
.form-actions .spacer { flex: 1; }
.form-error { color: var(--bad); margin: 0 0 12px; }

/* ---------- tool steps ---------- */
.step { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); margin: 10px 0; font-size: 14px; }
.step > summary { cursor: pointer; padding: 7px 12px; display: flex; gap: 8px; align-items: center; list-style: none; }
.step > summary::-webkit-details-marker { display: none; }
.step > summary::before { content: "\25B8"; color: var(--muted); font-size: 11px; transition: transform .15s; }
.step[open] > summary::before { transform: rotate(90deg); }
.step.running > summary { color: var(--muted); }
.step.running > summary::after { content: ""; width: 11px; height: 11px; border: 2px solid var(--muted); border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
.step.failed > summary { color: var(--bad); }
.step-body { padding: 0 12px 10px; }
.step-body pre { margin: 6px 0 0; background: var(--code); border: 1px solid var(--line); border-radius: 6px; padding: 10px; overflow-x: auto; font: 12.5px/1.45 var(--mono); max-height: 320px; overflow-y: auto; white-space: pre-wrap; }
.step-label { color: var(--muted); font-size: 12px; margin-top: 8px; }

/* ---------- skills ---------- */
.skill-group { margin-bottom: 28px; }
.skill-group > h3 { font: 400 20px/1.3 var(--serif); margin: 0 0 4px; }
.skill-card { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-top: 10px; background: var(--surface); }
.skill-card h4 { margin: 0; font-size: 15px; display: flex; gap: 10px; align-items: baseline; justify-content: space-between; }
.skill-card p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.skill-card .instr { white-space: pre-wrap; color: var(--ink); font-size: 13px; margin-top: 8px; border-left: 3px solid var(--line); padding-left: 10px; }
.tag { font: 600 12px/1 var(--sans); color: var(--link); }
.pick { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; background: var(--surface); cursor: pointer; }
.pick input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--accent); flex: none; }
.pick span { display: block; color: var(--muted); font-size: 13px; }
.subhead { font-weight: 600; font-size: 14px; margin: 14px 0 8px; }
.files { list-style: none; padding: 0; margin: 8px 0 0; font: 13px/1.7 var(--mono); max-height: 260px; overflow-y: auto; }
.files li { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); }
.files small { color: var(--muted); font-family: var(--sans); }
.path { font: 13px/1.5 var(--mono); overflow-wrap: anywhere; color: var(--muted); }

/* ---------- files ---------- */
.fb { display: grid; grid-template-columns: minmax(240px, 360px) 1fr; flex: 1; min-height: 0; }
.fb-list { overflow-y: auto; border-right: 1px solid var(--line); background: var(--surface); }
.fb-row { display: grid; grid-template-columns: 20px 1fr auto; gap: 10px; align-items: center; width: 100%; text-align: left;
  border: 0; border-bottom: 1px solid var(--line); background: none; padding: 9px 16px; cursor: pointer; }
.fb-row:hover { background: var(--accent-soft); }
.fb-row[aria-current="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--ink); }
.fb-row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fb-row small { color: var(--muted); font-size: 12px; white-space: nowrap; }
.fb-ico { width: 18px; height: 18px; color: var(--muted); }
.fb-ico.dir { color: var(--link); }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 8px 24px; border-bottom: 1px solid var(--line); background: var(--surface); font-size: 14px; }
.crumbs button { border: 0; background: none; color: var(--link); cursor: pointer; padding: 2px 4px; border-radius: 4px; font-weight: 600; }
.crumbs button:hover { background: var(--accent-soft); }
.crumbs span { color: var(--muted); }
.fb-view { overflow: auto; padding: 20px 24px; min-width: 0; }
.fb-view h3 { font: 400 22px/1.3 var(--serif); margin: 0; overflow-wrap: anywhere; }
.fb-meta { color: var(--muted); font-size: 13px; margin: 2px 0 12px; }
.fb-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.fb-view pre { background: var(--code); border: 1px solid var(--line); border-radius: 6px; padding: 12px; overflow: auto; font: 13px/1.5 var(--mono); margin: 0; white-space: pre; tab-size: 4; }
.fb-view img { max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 6px; background: repeating-conic-gradient(var(--code) 0 25%, var(--surface) 0 50%) 0 0 / 16px 16px; }
.fb-view iframe { width: 100%; height: 70vh; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
.fb-md { max-width: 760px; } .fb-md pre { white-space: pre-wrap; }
.fb-md code { font-family: var(--mono); background: var(--code); padding: 1px 4px; border-radius: 4px; }
.fb-table { overflow-x: auto; } .fb-table table { border-collapse: collapse; font-size: 13px; }
.fb-table th, .fb-table td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; white-space: nowrap; }
.fb-table th { background: var(--code); }
.fb-empty { color: var(--muted); padding: 24px 16px; }
@media (max-width: 760px) { .fb { grid-template-columns: 1fr; grid-template-rows: minmax(160px, 40%) 1fr; } .fb-list { border-right: 0; border-bottom: 1px solid var(--line); } .crumbs, .fb-view { padding-left: 14px; padding-right: 14px; } }

/* ---------- models ---------- */
.model-card { border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-top: 12px; background: var(--surface); }
.model-card h4 { margin: 0; font: 600 16px/1.3 var(--mono); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; overflow-wrap: anywhere; }
.kv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px 20px; margin: 12px 0 0; }
.kv dt { font-size: 12px; color: var(--muted); }
.kv dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.kv dd small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font: 600 11px/1 var(--sans); padding: 4px 8px; border-radius: 10px; background: var(--accent-soft); color: var(--ink); }
.chip.on { background: var(--ok); color: var(--surface); }
.model-note { font-size: 13px; color: var(--warn); margin: 10px 0 0; }
.model-card details { margin-top: 10px; font-size: 13px; }
.model-card details pre { background: var(--code); border: 1px solid var(--line); border-radius: 6px; padding: 8px; font: 12px/1.45 var(--mono); white-space: pre-wrap; margin: 6px 0 0; }
.model-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.model-actions .cmd { flex: 1; min-width: 240px; margin: 0; }
.summary-line { color: var(--muted); font-size: 14px; margin: 0 0 6px; }
.fb-list.drop { outline: 2px dashed var(--accent); outline-offset: -6px; }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 6px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }

@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  .side { position: fixed; inset: 0 25% 0 0; z-index: 10; transform: translateX(-100%); transition: transform .2s; }
  .app.menu-open .side { transform: none; box-shadow: 0 0 0 100vmax rgba(0,0,0,.35); }
  .menu-btn { display: inline-block; }
  .bar, .thread, .composer, .editor { padding-left: 14px; padding-right: 14px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<script>
"use strict";
const DIRECT = "";              // chat target id for the plain model chat
const S = {
  status: null,                 // last /api/status result
  agents: [],
  skills: [],                   // the skill library
  files: { agent: "", dir: "", file: "" },  // Files tab position
  view: { kind: "chat", agent: DIRECT },
  modelChoice: {},              // target -> model picked in the dropdown
  streams: {},                  // target -> the reply being written (kept here so it survives switching pages)
  drafts: {},                   // target -> unsent text in the message box
  errors: {},                   // target -> the last error, shown until the next message
  models: null,                 // last /api/models result
  unseen: false,                // a reply finished while the browser tab was hidden
};

/* ---------------------------------------------------------------- helpers */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = !!v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid !== null && kid !== undefined && kid !== false)
    el.append(kid instanceof Node ? kid : String(kid));
  return el;
}
const $ = (id) => document.getElementById(id);
function fill(el, ...kids) { el.replaceChildren(...kids.flat(Infinity).filter((k) => k !== null && k !== undefined && k !== false)); }
function esc(s) { return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

async function api(path, options = {}) {
  const opts = { headers: { "Content-Type": "application/json" }, ...options };
  if (opts.body && typeof opts.body !== "string") opts.body = JSON.stringify(opts.body);
  let res;
  try { res = await fetch(path, opts); }
  catch { throw new Error("Axis is not responding. Check that the axis window is still open."); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status}).`);
  return data;
}

let toastTimer;
function toast(text) {
  const t = $("toast"); t.textContent = text; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

function store(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch { return false; } }
function recall(key, fallback) {
  try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); } catch { return fallback; }
}
const historyKey = (target) => "axis.chat:" + target;
const getHistory = (target) => { const h = recall(historyKey(target), []); return Array.isArray(h) ? h : []; };
function setHistory(target, msgs) {
  if (store(historyKey(target), msgs)) return true;
  toast("Could not save this chat: the browser\u2019s storage is full. Start a new chat somewhere to free space.");
  return false;
}

/* --------------------------------------------------------------- markdown */
function inline(text) {
  return text.split(/(`[^`\n]+`)/).map((part, i) => {
    if (i % 2) return "<code>" + esc(part.slice(1, -1)) + "</code>";
    return esc(part)
      .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, "$1<em>$2</em>")
      .replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  }).join("");
}
function blocks(text) {
  const out = []; let para = []; let list = null;
  const flushPara = () => { if (para.length) out.push("<p>" + para.map(inline).join("<br>") + "</p>"); para = []; };
  const flushList = () => { if (list) out.push(`<${list.tag}>` + list.items.map((i) => "<li>" + inline(i) + "</li>").join("") + `</${list.tag}>`); list = null; };
  for (const line of text.split("\n")) {
    let m;
    if (!line.trim()) { flushPara(); flushList(); }
    else if ((m = line.match(/^(#{1,6})\s+(.*)$/))) { flushPara(); flushList(); out.push((m[1].length <= 2 ? "<h3>" : "<h4>") + inline(m[2]) + (m[1].length <= 2 ? "</h3>" : "</h4>")); }
    else if ((m = line.match(/^\s*[-*+]\s+(.*)$/)) || (m = line.match(/^\s*\d+[.)]\s+(.*)$/))) {
      const tag = /^\s*\d/.test(line) ? "ol" : "ul";
      flushPara(); if (list && list.tag !== tag) flushList();
      list = list || { tag, items: [] }; list.items.push(m[1]);
    }
    else if (list && /^\s{2,}\S/.test(line)) list.items[list.items.length - 1] += " " + line.trim();
    else { flushList(); para.push(line); }
  }
  flushPara(); flushList();
  return out.join("");
}
function markdown(src) {
  return src.split("```").map((part, i) => {
    if (i % 2 === 0) return blocks(part);
    const nl = part.indexOf("\n");
    const code = nl >= 0 ? part.slice(nl + 1) : part;
    return "<pre><code>" + esc(code.replace(/\n$/, "")) + "</code></pre>";
  }).join("");
}

function composerHint(target, agent, model) {
  const out = [];
  let text = S.streams[target] ? "Esc or Stop ends the reply." : "Enter to send, Shift+Enter for a new line.";
  if (agent) {
    const on = agent.skills.filter(skillById).length;
    text += ` ${agent.config.length} config instruction${agent.config.length === 1 ? "" : "s"} and ${on} skill${on === 1 ? "" : "s"} active.`;
    if (agent.skills.some((id) => (skillById(id) || {}).builtin)) {
      const info = modelInfo(model), caps = (info && info.capabilities) || [];

  out.push(text);

  const msgs = getHistory(target);
  const last = [...msgs].reverse().find((m) => m.role === "assistant" && m.stats && m.stats.context_tokens);
  const limit = contextLimit(model);
  if (last && limit) {
    const used = last.stats.context_tokens, pct = Math.min(100, Math.round(100 * used / limit));
    const tone = pct >= 90 ? "bad" : pct >= 70 ? "warn" : "";
    out.push(" Context", h("span", { class: "meter " + tone, title: `${fmt(used)} of ${fmt(limit)} tokens` }, h("i", { style: `width:${pct}%` })),
      `${fmt(used)} / ${fmt(limit)} tokens.`, pct >= 70 ? " Older messages are dropped as it fills; New chat starts fresh." : "");

  return parts.map((p) => p.type !== "tool" ? p : {
    ...p, output: cut(p.output),
    args: p.args && typeof p.args === "object" ? Object.fromEntries(Object.entries(p.args).map(([k, v]) => [k, cut(v)])) : p.args,
  });
}
function summarize(stream) {
  const st = stream.stats, out = { elapsed: (Date.now() - stream.started) / 1000 };
  if (!st.length) return out;
  const last = st[st.length - 1];
  out.output_tokens = st.reduce((a, s) => a + (s.output_tokens || 0), 0) || undefined;
  out.seconds = st.reduce((a, s) => a + (s.seconds || 0), 0) || undefined;
  out.context_tokens = ((last.prompt_tokens || 0) + (last.output_tokens || 0)) || undefined;
  return out;
}

function retry(target) {
  const msgs = getHistory(target);
  if (msgs.length && msgs[msgs.length - 1].role === "user") send(target, { resend: true });
  else send(target);
}

function streamsChanged() {
  renderNav();
  const busy = Object.keys(S.streams).length;
  document.title = busy ? "Working\u2026 \u00b7 Axis" : S.unseen ? "Reply ready \u00b7 Axis" : "Axis";
}

document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape" || S.view.kind !== "chat") return;
  const s = S.streams[S.view.agent];

});

function exportChat(target) {
  const msgs = getHistory(target);
  if (!msgs.length) return;
  const lines = [`# ${chatTitle(target)}`, "", `Exported from Axis on ${new Date().toLocaleString()}.`, ""];
  for (const m of msgs) {
    if (m.role === "user") { lines.push("## You", "", String(m.content || ""), ""); continue; }
    lines.push(`## ${target || "Model"}${m.model ? ` (${m.model})` : ""}`, "");
    const parts = Array.isArray(m.parts) && m.parts.length ? m.parts : [{ type: "text", text: String(m.content || "") }];
    for (const p of parts) {
      if (p.type !== "tool") { lines.push(p.text, ""); continue; }
      lines.push(`> **${stepLabel(p)}**`);
      if (p.args && typeof p.args.code === "string") lines.push("", "```python", p.args.code, "```");
      if (p.output !== undefined) lines.push("", "```", String(p.output), "```");
      lines.push("");
    }
  }
  const stamp = new Date().toISOString().slice(0, 10);
  download(`${target || "direct-chat"}-${stamp}.md`, lines.join("\n"), "text/markdown;charset=utf-8");
}

async function send(target, { resend = false } = {}) {
  if (S.streams[target] || !ready()) return;
  const msgs = getHistory(target);
  let text;
  if (resend) {
    while (msgs.length && msgs[msgs.length - 1].role === "assistant") msgs.pop();
    if (!msgs.length) return;
    text = String(msgs[msgs.length - 1].content || "");
  } else {
    const input = viewing(target) ? $("input") : null;
    text = (input ? input.value : S.drafts[target] || "").trim();
    if (!text) return;
    msgs.push({ role: "user", content: text });
    S.drafts[target] = ""; saveDrafts();
  }
  setHistory(target, msgs);
  delete S.errors[target];

  const model = currentModel(target);
  const stream = { controller: new AbortController(), parts: [], stats: [], started: Date.now(), model, roundStart: 0, frame: 0, error: null };
  S.streams[target] = stream;
  streamsChanged();
  if (viewing(target)) renderChat();          // shows the new message, the thinking indicator and the Stop button

  const paint = () => {
    stream.frame = 0;
    const live = $("live");
    if (!live || live.dataset.target !== target) return;   // this chat is not on screen; it is drawn when it comes back
    const stick = nearBottom($("thread"));
    fillLive(live, stream, target);
    if (stick) scrollDown(true);
  };
  const schedule = () => {
    if (stream.frame) return;
    // Animation frames pause in background tabs; a timer keeps the state current there.
    stream.timer = document.hidden;
    stream.frame = stream.timer ? setTimeout(paint, 250) : requestAnimationFrame(paint);
  };
  const parts = stream.parts;
  const onEvent = (ev) => {
    if (ev.model) stream.model = ev.model;
    if (ev.t) {
      const last = parts[parts.length - 1];
      if (last && last.type === "text") last.text += ev.t; else parts.push({ type: "text", text: ev.t });
    }
    if (ev.round !== undefined) stream.roundStart = parts.length;
    if (ev.rewrite !== undefined) {
      parts.splice(stream.roundStart);
      if (ev.rewrite.trim()) parts.push({ type: "text", text: ev.rewrite });
    }
    if (ev.tool) parts.push({ type: "tool", id: ev.tool.id, name: ev.tool.name, args: ev.tool.args });
    if (ev.tool_result) {
      const step = parts.find((p) => p.type === "tool" && p.id === ev.tool_result.id && p.output === undefined);
      if (step) { step.ok = ev.tool_result.ok; step.output = ev.tool_result.output; }
    }
    if (ev.stats) stream.stats.push(ev.stats);
    if (ev.error) stream.error = ev.error;
    schedule();
  };

  let aborted = false;
  try {
    const history = msgs.map(forModel);
    const res = await fetch("/api/chat", { method: "POST", signal: stream.controller.signal,
      headers: { "Content-Type": "application/json" }, body: JSON.stringify({ agent: target || null, model, messages: history }) });
    if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(d.error || `Request failed (${res.status}).`); }
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
        if (!line) continue;
        let ev;
        try { ev = JSON.parse(line); } catch { continue; }
        onEvent(ev);
      }
    }
  } catch (e) {
    if (e.name === "AbortError") aborted = true;
    else stream.error = e.name === "TypeError" ? "Axis is not responding. Check that the axis window is still open." : e.message;
  }
  if (stream.frame) { if (stream.timer) clearTimeout(stream.frame); else cancelAnimationFrame(stream.frame); stream.frame = 0; }
  delete S.streams[target];
  for (const p of parts) if (p.type === "tool" && p.output === undefined) { p.ok = false; p.output = "Stopped before this finished."; }

  if (target && !agentByName(target)) { streamsChanged(); return; }   // the agent was deleted meanwhile
  const reply = parts.filter((p) => p.type === "text").map((p) => p.text).join("");
  const got = !!reply.trim() || parts.some((p) => p.type === "tool");
  const saved = getHistory(target);
  if (got) {
    saved.push({ role: "assistant", content: reply, parts: clipParts(parts), model: stream.model,
      stats: summarize(stream), stopped: aborted || undefined });
  } else if (!resend && saved.length && saved[saved.length - 1].role === "user") {
    saved.pop();                                    // nothing came back: undo the message and give the text back
    if (!(S.drafts[target] || "").trim()) { S.drafts[target] = text; saveDrafts(); }
  }
  setHistory(target, saved);
  if (stream.error) S.errors[target] = stream.error;
  if (document.hidden) S.unseen = true;
  streamsChanged();
  if (stream.stats.length) loadModels();           // the context size may have changed (Ollama reloads at Axis's size)

  if (viewing(target)) renderChat();
  else if (got || stream.error) toast(`${chatTitle(target)}: ${stream.error ? "the reply failed" : "reply ready"}`);
  if (stream.error) refreshStatus();
}

function size(n) {
  if (n === null || n === undefined) return "";
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
  if (n < 1073741824) return (n / 1048576).toFixed(1) + " MB";
  return (n / 1073741824).toFixed(1) + " GB";
}
function when(iso) {
  const d = new Date(iso); if (isNaN(d)) return "";
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + " " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}

function parseCsv(text, limit) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length && rows.length < limit; i++) {
    const c = text[i];
    if (q) { if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (c === '"') q = false; else cell += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n") { row.push(cell.replace(/\r$/, "")); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if ((cell || row.length) && rows.length < limit) { row.push(cell); rows.push(row); }
  return rows;
}

const MAX_UPLOAD = 512 * 1024 * 1024;
async function uploadFiles(fileList) {
  const { agent, dir } = S.files;
  const files = [...(fileList || [])];
  if (!files.length || !agent) return;
  let done = 0;
  for (const file of files) {
    if (file.size > MAX_UPLOAD) { toast(`${file.name} is larger than 512 MB.`); continue; }
    toast(`Uploading ${file.name}\u2026`);
    try {
      const res = await fetch(filesUrl(agent, "upload", dir, "&name=" + encodeURIComponent(file.name)),
        { method: "POST", headers: { "Content-Type": "application/octet-stream" }, body: file });
      const d = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(d.error || `Upload failed (${res.status}).`);
      done++;
    } catch (e) { toast(e.name === "TypeError" ? `Could not upload ${file.name} (folders cannot be uploaded).` : e.message); }
  }
  if (done) toast(`Uploaded ${done} file${done === 1 ? "" : "s"} to ${agent}`);
  if (S.view.kind === "files" && S.files.agent === agent) loadListing(true);
}

  const path = S.files.dir ? S.files.dir + "/" + name : name;
  try { await api(filesUrl(S.files.agent, "mkdir", path), { method: "POST" }); openDir(path); }
  catch (e) { toast(e.message); }

  try { data = await api(filesUrl(f.agent, "", f.dir)); }
  catch (e) {
    if (f.dir) { S.files.dir = ""; S.files.file = ""; return renderFiles(); }   // folder vanished: go to the top
    return fill(list, h("div", { class: "fb-empty" }, e.message));
  }
  const key = JSON.stringify(data.entries);
  if (!force && key === lastListing) return;
  lastListing = key;
  if (f.file && !data.entries.some((e) => e.path === f.file) && !force) { S.files.file = ""; showFile(); }
  const rows = [];
  if (f.dir) rows.push(h("button", { class: "fb-row", onclick: () => openDir(f.dir.split("/").slice(0, -1).join("/")) },
    icon("up"), h("span", { class: "nm" }, "Up one folder"), h("small", {}, "")));
  for (const e of data.entries) {
    const isDir = e.type === "dir";
    rows.push(h("button", { class: "fb-row", role: "listitem", "aria-current": e.path === f.file ? "true" : "false", title: e.path,
      onclick: () => { if (isDir) openDir(e.path); else { S.files.file = e.path; markCurrent(); showFile(); } } },
      icon(isDir ? "dir" : "file"), h("span", { class: "nm" }, e.name),
      h("small", {}, isDir ? (e.items === null ? "" : `${e.items} item${e.items === 1 ? "" : "s"}`) : `${size(e.size)}  ${when(e.modified)}`)));
  }
  if (!data.entries.length) rows.push(h("div", { class: "fb-empty" }, f.dir ? "This folder is empty." :
    "This agent has not made any files yet. Ask it to make something in a chat."));
  fill(list, rows);
}
function markCurrent() {
  for (const b of document.querySelectorAll("#fb-list .fb-row")) b.setAttribute("aria-current", b.title === S.files.file ? "true" : "false");
}

async function showFile() {
  const f = S.files, view = $("fb-view");
  if (!view) return;
  if (!f.file) {
    return fill(view, h("div", { class: "empty", style: "margin-top:8vh" },
      h("h3", {}, "Choose a file"), h("p", {}, "Click a file to open it here, or a folder to look inside it.")));
  }
  fill(view, h("p", { class: "fb-meta" }, "Opening\u2026"));
  let d;
  try { d = await api(filesUrl(f.agent, "view", f.file)); }
  catch (e) { return fill(view, h("p", { class: "form-error" }, e.message)); }
  if (S.files.file !== d.path || S.files.agent !== d.agent) return;   // the user clicked something else meanwhile
  const raw = filesUrl(d.agent, "raw", d.path);
  const ext = (d.name.match(/\.([^.]+)$/) || ["", ""])[1].toLowerCase();
  const body = h("div", {});
  const actions = h("div", { class: "fb-actions" },
    h("a", { class: "btn small", href: raw + "&download=1", download: d.name }, "Download"),
    h("button", { class: "btn small", onclick: () => api(filesUrl(d.agent, "reveal", d.path), { method: "POST" }).catch((e) => toast(e.message)) }, "Show in folder"),
    d.kind === "text" ? h("button", { class: "btn small", onclick: () => copyText(d.text, "Text copied") }, "Copy text") : null,
    h("button", { class: "btn small danger", onclick: () => deletePath(d.path, false) }, "Delete"));

  const showText = () => fill(body, h("pre", {}, d.text));
  if (d.kind === "image") body.append(h("img", { src: raw, alt: d.name }));
  else if (d.kind === "pdf") { body.append(h("iframe", { src: raw, title: d.name })); actions.append(h("a", { class: "btn small", href: raw, target: "_blank", rel: "noopener" }, "Open in new tab")); }
  else if (d.kind === "binary") body.append(h("p", { class: "hint" }, "This file is not text or an image, so it cannot be shown here. Use Download or Show in folder."));
  else if (ext === "md" || ext === "markdown") {
    const rendered = () => { const div = h("div", { class: "fb-md msg ai" }); div.innerHTML = markdown(d.text); fill(body, div); };
    let source = false;
    actions.append(h("button", { class: "btn small", onclick: (e) => { source = !source; e.target.textContent = source ? "Show formatted" : "Show source"; source ? showText() : rendered(); } }, "Show source"));
    rendered();
  } else if (ext === "csv") {
    const rows = parseCsv(d.text, 501);
    const [head, ...rest] = rows;
    const table = h("table", {}, head ? h("thead", {}, h("tr", {}, head.map((c) => h("th", {}, c)))) : null,
      h("tbody", {}, rest.slice(0, 500).map((r) => h("tr", {}, r.map((c) => h("td", {}, c))))));
    let source = false;
    const asTable = () => fill(body, h("div", { class: "fb-table" }, table), rows.length > 500 ? h("p", { class: "hint" }, "Showing the first 500 rows.") : null);
    actions.append(h("button", { class: "btn small", onclick: (e) => { source = !source; e.target.textContent = source ? "Show table" : "Show source"; source ? showText() : asTable(); } }, "Show source"));
    asTable();
  } else if (ext === "html" || ext === "htm") {
    let preview = false;
    const page = () => fill(body, h("iframe", { sandbox: "allow-scripts", srcdoc: d.text, title: d.name }));
    actions.append(h("button", { class: "btn small", onclick: (e) => { preview = !preview; e.target.textContent = preview ? "Show source" : "Preview page"; preview ? page() : showText(); } }, "Preview page"));
    showText();
  } else showText();

  fill(view, h("h3", {}, d.name), h("p", { class: "fb-meta" }, `${d.path}, ${size(d.size)}, changed ${when(d.modified)}`),
    actions, body, d.truncated ? h("p", { class: "hint", style: "margin-top:8px" }, "Only the first 512 KB is shown. Download the file to see all of it.") : null);
}

/* ---------------------------------------------------------------- models */
const CAP_TEXT = { completion: "Chat", tools: "Tools", vision: "Vision", thinking: "Thinking", embedding: "Embeddings", insert: "Fill-in", audio: "Audio" };
function gpuText(m) {
  if (typeof m.gpu_percent !== "number") return "";
  if (m.gpu_percent >= 100) return "all on the GPU";
  if (m.gpu_percent <= 0) return "all in system RAM (CPU)";
  return `${m.gpu_percent}% GPU, ${100 - m.gpu_percent}% CPU`;
}
function expiresText(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return "";
  if (d.getFullYear() > 2100) return "until you stop it";
  return "until " + when(iso);
}
function modelCard(m, d) {
  const rows = [];
  const add = (label, value, note) => {
    if (value === null || value === undefined || value === "") return;
    rows.push(h("div", { class: "kv" }, h("dt", {}, label), h("dd", {}, String(value), note ? h("small", {}, note) : null)));
  };
  if (m.running) {
    add("Memory in use", m.memory ? size(m.memory) : null, m.memory_note || gpuText(m));
    add("Context window", tokens(m.context), m.max_context && m.max_context !== m.context ? `the model supports up to ${fmt(m.max_context)}` : null);
    if (m.slots > 1) add("Parallel slots", m.slots, "requests that can run at once");
  } else {
    add("Estimated memory", m.estimated_memory ? "about " + size(m.estimated_memory) : null,
      m.estimated_memory ? `${size(m.disk_size)} of weights plus ${size(m.estimated_cache)} for a context of ${fmt(m.axis_context)} tokens` : null);
    add("Longest context", tokens(m.max_context));
  }
  add("Parameters", m.parameter_size || bigNum(m.parameter_count));
  add("Quantization", m.quantization);
  add("Size on disk", m.disk_size ? size(m.disk_size) : null);
  add("Architecture", m.architecture || m.family);
  add("Layers", fmt(m.layers));
  add("Embedding size", fmt(m.embedding_length));
  add("Vocabulary", m.vocab_size ? fmt(m.vocab_size) + " tokens" : null);
  if (m.expert_count) add("Experts", fmt(m.expert_count));
  if (m.running && m.expires) add("Stays loaded", expiresText(m.expires));
  if (!m.running && m.modified) add("Installed", when(m.modified));
  add("Model file", m.model_path);
  add("Server build", m.build);
  add("License", m.license);

  const caps = Array.isArray(m.capabilities) ? m.capabilities : [];
  const notes = [];
  if (d.kind === "ollama" && m.running && m.context && m.axis_context && m.context !== m.axis_context)
    notes.push(`Axis asks Ollama for a context of ${fmt(m.axis_context)} tokens, so Ollama will reload this model at that size with the next Axis message. Memory use changes when it does.`);
  if (caps.length && caps.includes("completion") && !caps.includes("tools"))
    notes.push("No built-in tool support. Agents with actions still work through Axis\u2019s text format, but less reliably.");
  if (caps.includes("embedding") && !caps.includes("completion")) notes.push("This is an embedding model; it cannot chat.");

  const actions = [];
  if (m.running && (S.status && S.status.models || []).includes(m.name) && !caps.includes("embedding")) {
    actions.push(h("button", { class: "btn small primary", onclick: () => { S.modelChoice[DIRECT] = m.name; go({ kind: "chat", agent: DIRECT }); } }, "Chat with this model"));
  }
  if (d.kind === "ollama") actions.push(cmd(m.running ? `ollama stop ${m.name}` : `ollama run ${m.name} --keepalive -1m`));

  return h("div", { class: "model-card" },
    h("h4", {}, m.name, m.running ? h("span", { class: "chip on" }, "On") : h("span", { class: "chip" }, "Installed")),
    caps.length ? h("div", { class: "chips", style: "margin-top:8px" }, caps.map((c) => h("span", { class: "chip" }, CAP_TEXT[c] || c))) : null,
    rows.length ? h("dl", { class: "kv-grid" }, rows) : h("p", { class: "hint", style: "margin-top:8px" }, "The server did not report any details for this model."),
    notes.map((n) => h("p", { class: "model-note" }, n)),
    m.parameters ? h("details", {}, h("summary", {}, "Default settings"), h("pre", {}, m.parameters)) : null,
    actions.length ? h("div", { class: "model-actions" }, actions) : null);
}

function renderModels() {
  const bar = h("div", { class: "bar" }, menuButton(), h("h2", {}, "Models"),
    h("button", { class: "btn small", onclick: () => { S.models = null; renderModels(); } }, "Refresh"));
  const d = S.models;
  if (!d) {
    loadModels();
    return fill($("main"), bar, h("div", { class: "editor" }, h("div", { class: "form" }, h("p", { class: "hint" }, "Reading model details\u2026"))));
  }
  const running = d.models.filter((m) => m.running), installed = d.models.filter((m) => !m.running);
  const body = [];
  if (!d.models.length) {
    body.push(h("div", { class: "empty" }, h("h3", {}, "No models found"),
      h("p", {}, d.message || "Start Ollama or llama.cpp with a model, then click Refresh.")));
  } else {
    const total = running.reduce((a, m) => a + (m.memory || 0), 0);
    body.push(h("p", { class: "summary-line" }, [d.server, d.url].filter(Boolean).join(" at "),
      total ? ` \u00b7 ${size(total)} in use by ${running.length} model${running.length === 1 ? "" : "s"}` : ""));
    body.push(h("div", { class: "skill-group" }, h("h3", {}, "On now"),
      running.length ? running.map((m) => modelCard(m, d)) : h("p", { class: "hint" }, "No model is loaded. Turn one on with the command under an installed model.")));
    if (d.kind === "ollama") {
      body.push(h("div", { class: "skill-group" }, h("h3", {}, "Installed"),
        h("p", { class: "hint" }, `Downloaded but not loaded. Memory estimates assume the context of ${fmt(d.axis_context || 4096)} tokens that Axis asks for, and are approximate.`),
        installed.length ? installed.map((m) => modelCard(m, d)) : h("p", { class: "hint" }, "Every installed model is on.")));
    }
  }
  fill($("main"), bar, h("div", { class: "editor" }, h("div", { class: "form" }, body)));
}

/* ---------------------------------------------------------------- skills */
function renderSkills() {
  const builtin = S.skills.filter((sk) => sk.builtin);
  const custom = S.skills.filter((sk) => !sk.builtin);
  const usedBy = (id) => S.agents.filter((a) => a.skills.includes(id)).map((a) => a.name);
  const users = (id) => { const u = usedBy(id); return u.length ? "Used by " + u.join(", ") : "Not used by any agent"; };

  const editor = (sk, onDone) => {
    const err = h("p", { class: "form-error", role: "alert", hidden: true });
    const name = h("input", { type: "text", value: sk ? sk.name : "", maxlength: 80, placeholder: "for example: Plain English", "aria-label": "Skill name" });
    const desc = h("input", { type: "text", value: sk ? sk.description : "", maxlength: 300, placeholder: "One line shown when choosing skills", "aria-label": "Description" });
    const instr = h("textarea", { rows: 5, placeholder: "What the agent should do when using this skill", "aria-label": "Instructions" });
    instr.value = sk ? sk.instructions : "";
    const save = async () => {
      err.hidden = true;
      const data = { name: name.value, description: desc.value, instructions: instr.value };
      try {
        if (sk) await api("/api/skills/" + encodeURIComponent(sk.id), { method: "PUT", body: data });
        else await api("/api/skills", { method: "POST", body: data });
        await loadSkills(); toast(sk ? "Skill saved" : "Skill created"); onDone();
      } catch (e) { err.textContent = e.message; err.hidden = false; }
    };
    const form = h("form", { class: "form skill-card", onsubmit: (e) => { e.preventDefault(); save(); } }, err,
      h("div", { class: "field" }, h("label", {}, "Name"), name),
      h("div", { class: "field" }, h("label", {}, "Description"), desc),
      h("div", { class: "field" }, h("label", {}, "Instructions"), instr),
      h("div", { class: "form-actions" },
        h("button", { class: "btn primary", type: "submit" }, sk ? "Save skill" : "Create skill"),
        h("button", { class: "btn", type: "button", onclick: onDone }, "Cancel")));
    setTimeout(() => name.focus(), 0);
    return form;
  };

  const customCard = (sk) => {
    const card = h("div", { class: "skill-card" },
      h("h4", {}, sk.name, h("span", { style: "display:flex;gap:12px" },
        h("button", { class: "link", onclick: () => card.replaceWith(editor(sk, renderSkills)) }, "Edit"),
        h("button", { class: "link", style: "color:var(--bad)", onclick: async () => {
          if (!confirm(`Delete the skill ${sk.name}? Agents using it will stop using it.`)) return;
          try { await api("/api/skills/" + encodeURIComponent(sk.id), { method: "DELETE" });
                await Promise.all([loadSkills(), loadAgents()]); toast("Skill deleted"); renderSkills(); }
          catch (e) { toast(e.message); }
        } }, "Delete"))),
      sk.description ? h("p", {}, sk.description) : null,
      h("div", { class: "instr" }, sk.instructions),
      h("p", {}, users(sk.id)));
    return card;
  };

  const newSlot = h("div", {});
  $("main").replaceChildren(
    h("div", { class: "bar" }, menuButton(), h("h2", {}, "Skills"),
      h("button", { class: "btn small primary", onclick: () => fill(newSlot, editor(null, renderSkills)) }, "New skill")),
    h("div", { class: "editor" }, h("div", { class: "form" },
      newSlot,
      h("div", { class: "skill-group" }, h("h3", {}, "Your skills"),
        h("p", { class: "hint" }, "Instructions you write once and give to any agent. Choose them in each agent\u2019s settings."),
        custom.length ? custom.map(customCard) : h("p", { class: "hint" }, "None yet. Click New skill to make one.")),
      h("div", { class: "skill-group" }, h("h3", {}, "Built-in actions"),
        h("p", { class: "hint" }, "These let an agent work with files. Each agent can only reach its own folder."),
        builtin.map((sk) => h("div", { class: "skill-card" },
          h("h4", {}, sk.name, h("span", { class: "tag" }, "Built in")),
          h("p", {}, sk.description),
          h("p", {}, users(sk.id))))))));
}

/* ------------------------------------------------------------------ start */
(async function start() {
  const drafts = recall("axis.drafts", {});
  if (drafts && typeof drafts === "object" && !Array.isArray(drafts)) S.drafts = drafts;
  await Promise.all([refreshStatus(), loadAgents(), loadSkills()]);
  renderMain();
  loadModels();
  setInterval(refreshStatus, 4000);
  setInterval(tick, 1000);
})();
</script>
</body>
</html>

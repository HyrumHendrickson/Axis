<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Axis</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%232448a8%22/%3E%3Cpath d=%22M6 22h20%22 stroke=%22white%22 stroke-width=%223%22 stroke-linecap=%22round%22/%3E%3Cpath d=%22M16 6v16%22 stroke=%22white%22 stroke-width=%223%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<style>
:root {
  --bg: #e9edf1; --panel: #f6f8fa; --surface: #ffffff; --ink: #18222e; --muted: #5d6976;
  --line: #d3dae2; --accent: #2448a8; --accent-ink: #ffffff; --accent-soft: #e3e9f8;
  --ok: #1f7a4d; --bad: #b23a2a; --warn: #8f6400; --code: #eef1f5;
  --serif: "Palatino Linotype", "Book Antiqua", Palatino, "URW Palladio L", Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #10151b; --panel: #151c24; --surface: #1b242e; --ink: #e2e8ef; --muted: #8e9aa8;
    --line: #2a3542; --accent: #8aa7f2; --accent-ink: #0f1622; --accent-soft: #223152;
    --ok: #4cc38a; --bad: #f07a68; --warn: #e0b64c; --code: #121920;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { display: grid; grid-template-columns: 272px 1fr; height: 100%; }

/* ---------- sidebar ---------- */
.side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.brand { padding: 22px 20px 0; }
.brand h1 { font: 400 30px/1 var(--serif); letter-spacing: .02em; margin: 0; }
.axisline { height: 3px; margin: 14px 0 0; border-radius: 2px; background: var(--muted); transition: background .4s; }
.axisline.ok { background: var(--ok); } .axisline.bad { background: var(--bad); } .axisline.warn { background: var(--warn); }
.status { padding: 14px 20px 18px; border-bottom: 1px solid var(--line); }
.status-title { font-weight: 600; display: flex; align-items: center; gap: 8px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); }
.status-detail { color: var(--muted); font-size: 13px; margin-top: 4px; overflow-wrap: anywhere; }
.status-models { list-style: none; padding: 0; margin: 6px 0 0; font: 13px/1.6 var(--mono); }
.nav { flex: 1; overflow-y: auto; padding: 12px 10px 20px; }
.nav h2 { font: 600 13px/1 var(--sans); color: var(--muted); margin: 18px 10px 8px; display: flex; justify-content: space-between; align-items: center; }
.nav-item { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
.nav-item:hover { background: var(--accent-soft); }
.nav-item[aria-current="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.nav-item small { display: block; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-empty { color: var(--muted); font-size: 13px; padding: 4px 10px; }

/* ---------- buttons ---------- */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 14px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.danger { color: var(--bad); }
.btn.small { padding: 3px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.link { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; font-size: 13px; font-weight: 600; }

/* ---------- main ---------- */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.bar { display: flex; align-items: center; gap: 12px; padding: 12px 24px; border-bottom: 1px solid var(--line); background: var(--surface); flex-wrap: wrap; }
.bar h2 { font: 400 22px/1.2 var(--serif); margin: 0; flex: 1; min-width: 120px; overflow-wrap: anywhere; }
.bar label { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; }
select { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 8px; max-width: 240px; }
.menu-btn { display: none; }
.note { padding: 8px 24px; font-size: 13px; color: var(--warn); background: var(--surface); border-bottom: 1px solid var(--line); }

.thread { flex: 1; overflow-y: auto; padding: 24px; }
.thread-inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.msg { max-width: 100%; }
.msg.user { align-self: flex-end; background: var(--accent-soft); padding: 10px 14px; border-radius: 12px 12px 2px 12px; white-space: pre-wrap; overflow-wrap: anywhere; max-width: 85%; }
.msg.ai { overflow-wrap: anywhere; }
.msg.ai > :first-child { margin-top: 0; } .msg.ai > :last-child { margin-bottom: 0; }
.msg.ai pre { background: var(--code); border: 1px solid var(--line); border-radius: 6px; padding: 12px; overflow-x: auto; font: 13px/1.5 var(--mono); }
.msg.ai code { font-family: var(--mono); font-size: .9em; background: var(--code); padding: 1px 4px; border-radius: 4px; }
.msg.ai pre code { background: none; padding: 0; font-size: inherit; }
.msg.ai h3, .msg.ai h4 { font-family: var(--serif); font-weight: 600; margin: 1em 0 .4em; }
.msg-tools { margin-top: 6px; display: flex; gap: 12px; }
.msg.error { color: var(--bad); border-left: 3px solid var(--bad); padding: 4px 12px; white-space: pre-wrap; }
.typing::after { content: "Thinking"; color: var(--muted); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.empty { color: var(--muted); text-align: center; margin: 12vh auto 0; max-width: 460px; }
.empty h3 { font: 400 24px/1.3 var(--serif); color: var(--ink); margin: 0 0 8px; }

.composer { border-top: 1px solid var(--line); background: var(--surface); padding: 14px 24px 18px; }
.composer-inner { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
.composer textarea { flex: 1; resize: none; min-height: 44px; max-height: 220px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--surface); }
.composer-hint { max-width: 760px; margin: 6px auto 0; font-size: 12px; color: var(--muted); }

/* ---------- gate ---------- */
.gate { max-width: 620px; margin: 8vh auto 0; }
.gate h3 { font: 400 26px/1.3 var(--serif); margin: 0 0 6px; }
.gate p { color: var(--muted); margin: 0 0 18px; }
.gate h4 { margin: 20px 0 6px; font-size: 15px; }
.gate ol { margin: 0; padding-left: 20px; }
.gate li { margin: 4px 0; }
.cmd { display: flex; align-items: center; gap: 8px; background: var(--code); border: 1px solid var(--line); border-radius: 6px; padding: 6px 6px 6px 12px; margin: 6px 0; }
.cmd code { flex: 1; font: 13px/1.5 var(--mono); overflow-x: auto; white-space: nowrap; }

/* ---------- editor ---------- */
.editor { flex: 1; overflow-y: auto; padding: 24px; }
.form { max-width: 720px; margin: 0 auto; }
.field { margin-bottom: 22px; }
.field > label, .section-head h3 { display: block; font-weight: 600; margin-bottom: 4px; }
.hint { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
.form input[type=text], .form textarea { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--surface); }
.form textarea { resize: vertical; min-height: 90px; }
.section { border-top: 1px solid var(--line); padding-top: 18px; margin-top: 8px; margin-bottom: 22px; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.section-head h3 { font: 400 20px/1.3 var(--serif); margin: 0; }
.row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
.row input { flex: 1; }
.skill { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 10px; background: var(--surface); }
.skill.off { opacity: .65; }
.skill .row { margin-bottom: 8px; }
.switch { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; cursor: pointer; }
.switch input { width: 16px; height: 16px; accent-color: var(--accent); }
.form-actions { display: flex; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 18px; }
.form-actions .spacer { flex: 1; }
.form-error { color: var(--bad); margin: 0 0 12px; }

/* ---------- tool steps ---------- */
.step { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); margin: 10px 0; font-size: 14px; }
.step > summary { cursor: pointer; padding: 7px 12px; display: flex; gap: 8px; align-items: center; list-style: none; }
.step > summary::-webkit-details-marker { display: none; }
.step > summary::before { content: "\25B8"; color: var(--muted); font-size: 11px; transition: transform .15s; }
.step[open] > summary::before { transform: rotate(90deg); }
.step.running > summary { color: var(--muted); }
.step.failed > summary { color: var(--bad); }
.step-body { padding: 0 12px 10px; }
.step-body pre { margin: 6px 0 0; background: var(--code); border: 1px solid var(--line); border-radius: 6px; padding: 10px; overflow-x: auto; font: 12.5px/1.45 var(--mono); max-height: 320px; overflow-y: auto; white-space: pre-wrap; }
.step-label { color: var(--muted); font-size: 12px; margin-top: 8px; }

/* ---------- skills ---------- */
.skill-group { margin-bottom: 28px; }
.skill-group > h3 { font: 400 20px/1.3 var(--serif); margin: 0 0 4px; }
.skill-card { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-top: 10px; background: var(--surface); }
.skill-card h4 { margin: 0; font-size: 15px; display: flex; gap: 10px; align-items: baseline; justify-content: space-between; }
.skill-card p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.skill-card .instr { white-space: pre-wrap; color: var(--ink); font-size: 13px; margin-top: 8px; border-left: 3px solid var(--line); padding-left: 10px; }
.tag { font: 600 12px/1 var(--sans); color: var(--accent); }
.pick { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; background: var(--surface); cursor: pointer; }
.pick input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--accent); flex: none; }
.pick span { display: block; color: var(--muted); font-size: 13px; }
.subhead { font-weight: 600; font-size: 14px; margin: 14px 0 8px; }
.files { list-style: none; padding: 0; margin: 8px 0 0; font: 13px/1.7 var(--mono); max-height: 260px; overflow-y: auto; }
.files li { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); }
.files small { color: var(--muted); font-family: var(--sans); }
.path { font: 13px/1.5 var(--mono); overflow-wrap: anywhere; color: var(--muted); }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 6px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }

@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  .side { position: fixed; inset: 0 25% 0 0; z-index: 10; transform: translateX(-100%); transition: transform .2s; }
  .app.menu-open .side { transform: none; box-shadow: 0 0 0 100vmax rgba(0,0,0,.35); }
  .menu-btn { display: inline-block; }
  .bar, .thread, .composer, .editor { padding-left: 14px; padding-right: 14px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side">
    <div class="brand"><h1>Axis</h1><div class="axisline" id="axisline"></div></div>
    <div class="status" id="status" aria-live="polite"></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
const DIRECT = "";              // chat target id for the plain model chat
const S = {
  status: null,                 // last /api/status result
  agents: [],
  skills: [],                   // the skill library
  view: { kind: "chat", agent: DIRECT },
  modelChoice: {},              // target -> model picked in the dropdown
  streaming: null,              // { controller, target }
};

/* ---------------------------------------------------------------- helpers */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = !!v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid !== null && kid !== undefined && kid !== false)
    el.append(kid instanceof Node ? kid : String(kid));
  return el;
}
const $ = (id) => document.getElementById(id);
function fill(el, ...kids) { el.replaceChildren(...kids.flat(Infinity).filter((k) => k !== null && k !== undefined && k !== false)); }
function esc(s) { return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

async function api(path, options = {}) {
  const opts = { headers: { "Content-Type": "application/json" }, ...options };
  if (opts.body && typeof opts.body !== "string") opts.body = JSON.stringify(opts.body);
  let res;
  try { res = await fetch(path, opts); }
  catch { throw new Error("Axis is not responding. Check that the axis window is still open."); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status}).`);
  return data;
}

let toastTimer;
function toast(text) {
  const t = $("toast"); t.textContent = text; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

function store(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} }
function recall(key, fallback) {
  try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); } catch { return fallback; }
}
const historyKey = (target) => "axis.chat:" + target;
const getHistory = (target) => { const h = recall(historyKey(target), []); return Array.isArray(h) ? h : []; };
const setHistory = (target, msgs) => store(historyKey(target), msgs);

function copyText(text, label) {
  const done = () => toast(label || "Copied");
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  const t = h("textarea", { value: text }); document.body.append(t); t.select();
  try { document.execCommand("copy"); done(); } catch {} t.remove();
}

/* --------------------------------------------------------------- markdown */
function inline(text) {
  return text.split(/(`[^`\n]+`)/).map((part, i) => {
    if (i % 2) return "<code>" + esc(part.slice(1, -1)) + "</code>";
    return esc(part)
      .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, "$1<em>$2</em>")
      .replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  }).join("");
}
function blocks(text) {
  const out = []; let para = []; let list = null;
  const flushPara = () => { if (para.length) out.push("<p>" + para.map(inline).join("<br>") + "</p>"); para = []; };
  const flushList = () => { if (list) out.push(`<${list.tag}>` + list.items.map((i) => "<li>" + inline(i) + "</li>").join("") + `</${list.tag}>`); list = null; };
  for (const line of text.split("\n")) {
    let m;
    if (!line.trim()) { flushPara(); flushList(); }
    else if ((m = line.match(/^(#{1,6})\s+(.*)$/))) { flushPara(); flushList(); out.push((m[1].length <= 2 ? "<h3>" : "<h4>") + inline(m[2]) + (m[1].length <= 2 ? "</h3>" : "</h4>")); }
    else if ((m = line.match(/^\s*[-*+]\s+(.*)$/)) || (m = line.match(/^\s*\d+[.)]\s+(.*)$/))) {
      const tag = /^\s*\d/.test(line) ? "ol" : "ul";
      flushPara(); if (list && list.tag !== tag) flushList();
      list = list || { tag, items: [] }; list.items.push(m[1]);
    }
    else if (list && /^\s{2,}\S/.test(line)) list.items[list.items.length - 1] += " " + line.trim();
    else { flushList(); para.push(line); }
  }
  flushPara(); flushList();
  return out.join("");
}
function markdown(src) {
  return src.split("```").map((part, i) => {
    if (i % 2 === 0) return blocks(part);
    const nl = part.indexOf("\n");
    const code = nl >= 0 ? part.slice(nl + 1) : part;
    return "<pre><code>" + esc(code.replace(/\n$/, "")) + "</code></pre>";
  }).join("");
}

/* ----------------------------------------------------------------- status */
const ready = () => !!(S.status && S.status.ready);

async function refreshStatus() {
  let st;
  try { st = await api("/api/status"); }
  catch (e) { st = { ready: false, axisDown: true, message: e.message, models: [] }; }
  const changed = JSON.stringify(st) !== JSON.stringify(S.status);
  S.status = st;
  if (changed) { renderStatus(); if (S.view.kind === "chat" && !S.streaming) renderMain(); }
}

function renderStatus() {
  const st = S.status;
  let tone, title, detail;
  if (st.axisDown) { tone = "bad"; title = "Axis stopped"; detail = st.message; }
  else if (st.ready) { tone = "ok"; title = `${st.server} is ready`; detail = st.url; }
  else if (st.server_running) { tone = "warn"; title = "No model is on"; detail = st.message; }
  else { tone = "bad"; title = "No model server"; detail = "Start Ollama or llama.cpp."; }
  $("axisline").className = "axisline " + tone;
  fill($("status"), 
    h("div", { class: "status-title" }, h("span", { class: "dot " + tone }), title),
    h("div", { class: "status-detail" }, detail),
    st.ready ? h("ul", { class: "status-models", "aria-label": "Models that are on" }, st.models.map((m) => h("li", {}, m))) : null,
  );
}

/* ------------------------------------------------------------------- nav */
async function loadAgents() {
  try { S.agents = await api("/api/agents"); } catch (e) { toast(e.message); }
  renderNav();
}
function agentByName(name) { return S.agents.find((a) => a.name === name); }
async function loadSkills() {
  try { S.skills = await api("/api/skills"); } catch (e) { toast(e.message); }
}
const skillById = (id) => S.skills.find((s) => s.id === id);

function go(view) {
  S.view = view;
  $("app").classList.remove("menu-open");
  renderNav(); renderMain();
}

function renderNav() {
  const v = S.view;
  const item = (label, sub, current, onclick) =>
    h("button", { class: "nav-item", "aria-current": current ? "true" : "false", onclick }, label, h("small", {}, sub));
  fill($("nav"), 
    item("Direct chat", "Talk to the model with no agent", v.kind === "chat" && v.agent === DIRECT, () => go({ kind: "chat", agent: DIRECT })),
    item("Skills", "Make and manage skills for agents", v.kind === "skills", () => go({ kind: "skills" })),
    h("h2", {}, "Agents", h("button", { class: "link", onclick: () => go({ kind: "edit", agent: null }) }, "New agent")),
    S.agents.length
      ? S.agents.map((a) => item(a.name, a.model || "Any model that is on",
          (v.kind === "chat" || v.kind === "edit") && v.agent === a.name, () => go({ kind: "chat", agent: a.name })))
      : h("p", { class: "nav-empty" }, "No agents yet."),
  );
}

/* ------------------------------------------------------------------ chat */
function matchModel(want, models) {
  if (!want) return null;
  return models.find((m) => m === want || m === want + ":latest") || null;
}
function currentModel(target) {
  const models = (S.status && S.status.models) || [];
  const agent = target ? agentByName(target) : null;
  return matchModel(S.modelChoice[target], models) || matchModel(agent && agent.model, models) || models[0] || "";
}

function menuButton() {
  return h("button", { class: "btn small menu-btn", "aria-label": "Open menu", onclick: () => $("app").classList.toggle("menu-open") }, "Menu");
}

function renderMain() {
  if (S.view.kind === "edit") return renderEditor();
  if (S.view.kind === "skills") return renderSkills();
  renderChat();
}

function renderChat() {
  const target = S.view.agent;
  const agent = target ? agentByName(target) : null;
  if (target && !agent) return go({ kind: "chat", agent: DIRECT });
  const models = (S.status && S.status.models) || [];
  const model = currentModel(target);

  const select = h("select", { "aria-label": "Model", disabled: !ready() || !!S.streaming,
    onchange: (e) => { S.modelChoice[target] = e.target.value; renderChat(); } },
    models.map((m) => { const o = h("option", { value: m }, m); o.selected = m === model; return o; }));

  const bar = h("div", { class: "bar" },
    menuButton(),
    h("h2", {}, agent ? agent.name : "Direct chat"),
    ready() ? h("label", {}, "Model", select) : null,
    agent ? h("button", { class: "btn small", onclick: () => go({ kind: "edit", agent: agent.name }) }, "Edit agent") : null,
    !ready() ? null : h("button", { class: "btn small", disabled: !!S.streaming, onclick: () => {
      if (getHistory(target).length && !confirm("Start a new chat? The current conversation will be cleared.")) return;
      setHistory(target, []); renderChat();
    } }, "New chat"),
  );

  const notes = [];
  if (agent && agent.model && ready() && !matchModel(agent.model, models))
    notes.push(h("div", { class: "note" }, `This agent prefers ${agent.model}, which is not on. Using ${model}. To use it, run: `,
      h("code", {}, `ollama run ${agent.model} --keepalive -1m`)));

  const typed = $("input") ? $("input").value : "";
  const parts = [bar, ...notes];
  if (!ready()) {
    parts.push(h("div", { class: "thread" }, gateView()));
  } else {
    parts.push(h("div", { class: "thread", id: "thread" }, h("div", { class: "thread-inner", id: "thread-inner" })));
    parts.push(composer(target, agent));
  }
  fill($("main"), ...parts);
  if (ready()) { renderThread(target, agent, model); const i = $("input"); i.value = typed; i.focus(); }
}

function cmd(text) {
  return h("div", { class: "cmd" }, h("code", {}, text), h("button", { class: "btn small", onclick: () => copyText(text) }, "Copy"));
}

function gateView() {
  const st = S.status || {};
  if (st.axisDown) return h("div", { class: "gate" },
    h("h3", {}, "Axis has stopped"),
    h("p", {}, "The axis window was closed or stopped. Run axis again in a terminal, then reload this page."));
  return h("div", { class: "gate" },
    h("h3", {}, st.server_running ? "Turn on a model to start" : "Start a model server to use Axis"),
    h("p", {}, st.message || "Axis is looking for Ollama or llama.cpp on this computer."),
    h("h4", {}, "With Ollama"),
    h("ol", {},
      h("li", {}, "Open the Ollama app (or run ollama serve in a terminal)."),
      h("li", {}, "In a terminal, turn on a model:", cmd("ollama run llama3.2:3b --keepalive -1m")),
      h("li", {}, "Type /bye to leave Ollama's prompt. The model stays on.")),
    h("h4", {}, "With llama.cpp"),
    h("ol", {},
      h("li", {}, "In a terminal, start the server with a model and leave it open:",
        cmd("llama-server -hf bartowski/Llama-3.2-3B-Instruct-GGUF:Q4_K_M"))),
    h("p", { style: "margin-top:18px" }, "This page checks every few seconds and unlocks as soon as a model is on."));
}

function composer(target, agent) {
  const input = h("textarea", { id: "input", rows: 1, placeholder: agent ? `Message ${agent.name}` : "Message the model",
    "aria-label": "Message",
    oninput: (e) => { e.target.style.height = "auto"; e.target.style.height = e.target.scrollHeight + "px"; },
    onkeydown: (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(target); } } });
  const btn = S.streaming && S.streaming.target === target
    ? h("button", { class: "btn", id: "send", onclick: () => S.streaming && S.streaming.controller.abort() }, "Stop")
    : h("button", { class: "btn primary", id: "send", disabled: !!S.streaming, onclick: () => send(target) }, "Send");
  let hint = "Enter to send, Shift+Enter for a new line.";
  if (agent) {
    const on = agent.skills.filter(skillById).length;
    hint += ` ${agent.config.length} config instruction${agent.config.length === 1 ? "" : "s"} and ${on} skill${on === 1 ? "" : "s"} active.`;
    if (agent.skills.some((id) => (skillById(id) || {}).builtin))
      hint += " Actions work best with models that support tools, such as llama3.1, llama3.2, qwen2.5 or qwen3.";
  }
  return h("div", { class: "composer" }, h("div", { class: "composer-inner" }, input, btn), h("div", { class: "composer-hint" }, hint));
}

const STEP_TEXT = {
  run_python: ["Running Python", "Ran Python"],
  list_files: ["Listing files", "Listed files"],
  read_file: ["Reading", "Read"],
  write_file: ["Writing", "Wrote"],
  make_folder: ["Making folder", "Made folder"],
  delete_file: ["Deleting", "Deleted"],
};
function stepView(p) {
  const words = STEP_TEXT[p.name] || ["Using " + p.name, "Used " + p.name];
  const target = p.args && typeof p.args.path === "string" && p.args.path ? " " + p.args.path : "";
  const state = p.output === undefined ? "running" : (p.ok ? "done" : "failed");
  const label = (state === "running" ? words[0] : words[1]) + target + (state === "failed" ? " (failed)" : state === "running" ? "\u2026" : "");
  const body = h("div", { class: "step-body" });
  if (p.args && typeof p.args.code === "string") body.append(h("div", { class: "step-label" }, "Code"), h("pre", {}, p.args.code));
  if (p.args && typeof p.args.content === "string")
    body.append(h("div", { class: "step-label" }, "Content"), h("pre", {}, p.args.content.length > 4000 ? p.args.content.slice(0, 4000) + "\n\u2026" : p.args.content));
  if (p.args && typeof p.args.raw === "string") body.append(h("div", { class: "step-label" }, "Arguments"), h("pre", {}, p.args.raw));
  if (p.output !== undefined) body.append(h("div", { class: "step-label" }, "Result"), h("pre", {}, p.output));
  return h("details", { class: "step " + state }, h("summary", {}, label), body);
}
function partsView(parts) {
  return parts.map((p) => {
    if (p.type === "tool") return stepView(p);
    const d = h("div", { class: "msg ai" }); d.innerHTML = markdown(p.text); return d;
  });
}
function messageView(m) {
  if (m.role === "user") return h("div", { class: "msg user" }, m.content);
  const parts = Array.isArray(m.parts) && m.parts.length ? m.parts : [{ type: "text", text: m.content }];
  return h("div", {}, partsView(parts),
    m.content.trim() ? h("div", { class: "msg-tools" }, h("button", { class: "link", onclick: () => copyText(m.content) }, "Copy")) : null);
}

function renderThread(target, agent, model) {
  const inner = $("thread-inner"); if (!inner) return;
  const msgs = getHistory(target);
  if (!msgs.length) {
    fill(inner, h("div", { class: "empty" },
      h("h3", {}, agent ? `Chat with ${agent.name}` : "Start a conversation"),
      h("p", {}, agent ? `${agent.name} will answer using ${model}.` : `You are talking directly to ${model}.`)));
  } else fill(inner, ...msgs.map(messageView));
  scrollDown();
}
function scrollDown() { const t = $("thread"); if (t) t.scrollTop = t.scrollHeight; }

async function send(target) {
  const input = $("input");
  const text = input ? input.value.trim() : "";
  if (!text || S.streaming || !ready()) return;
  const model = currentModel(target);
  const msgs = getHistory(target);
  msgs.push({ role: "user", content: text });
  setHistory(target, msgs);

  input.value = "";
  const controller = new AbortController();
  S.streaming = { controller, target };
  renderChat();                                  // shows the new message and the Stop button
  const inner = $("thread-inner");
  const live = h("div", {}, h("div", { class: "msg ai typing" }));
  inner.append(live); scrollDown();

  const parts = []; let error = null, frame = 0;
  const textOf = () => parts.filter((p) => p.type === "text").map((p) => p.text).join("");
  const paint = () => { frame = 0; fill(live, partsView(parts)); scrollDown(); };
  const schedule = () => { if (!frame) frame = requestAnimationFrame(paint); };
  try {
    const history = msgs.map((m) => ({ role: m.role, content: m.content }));
    const res = await fetch("/api/chat", { method: "POST", signal: controller.signal,
      headers: { "Content-Type": "application/json" }, body: JSON.stringify({ agent: target || null, model, messages: history }) });
    if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(d.error || `Request failed (${res.status}).`); }
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
        if (!line) continue;
        const ev = JSON.parse(line);
        if (ev.t) {
          const last = parts[parts.length - 1];
          if (last && last.type === "text") last.text += ev.t; else parts.push({ type: "text", text: ev.t });
          schedule();
        }
        if (ev.tool) { parts.push({ type: "tool", id: ev.tool.id, name: ev.tool.name, args: ev.tool.args }); schedule(); }
        if (ev.tool_result) {
          const step = parts.find((p) => p.type === "tool" && p.id === ev.tool_result.id);
          if (step) { step.ok = ev.tool_result.ok; step.output = ev.tool_result.output; schedule(); }
        }
        if (ev.error) error = ev.error;
      }
    }
  } catch (e) {
    if (e.name !== "AbortError") error = e.name === "TypeError" ? "Axis is not responding. Check that the axis window is still open." : e.message;
  }
  if (frame) cancelAnimationFrame(frame);
  S.streaming = null;
  for (const p of parts) if (p.type === "tool" && p.output === undefined) { p.ok = false; p.output = "Stopped before this finished."; }

  const reply = textOf();
  const got = reply.trim() || parts.some((p) => p.type === "tool");
  const saved = getHistory(target);
  if (got) saved.push({ role: "assistant", content: reply, parts });
  else if (saved.length && saved[saved.length - 1].role === "user") saved.pop();   // nothing came back: undo the message
  setHistory(target, saved);

  if (S.view.kind !== "chat" || S.view.agent !== target) return;
  renderChat();
  if (!got) $("input").value = text;
  if (error) { $("thread-inner").append(h("div", { class: "msg error", role: "alert" }, error)); scrollDown(); refreshStatus(); }
}

/* ---------------------------------------------------------------- editor */
function renderEditor() {
  const existing = S.view.agent ? agentByName(S.view.agent) : null;
  if (S.view.agent && !existing) return go({ kind: "chat", agent: DIRECT });
  const draft = existing ? JSON.parse(JSON.stringify(existing))
    : { name: "", model: "", system_prompt: "You are a concise and helpful assistant.", config: [], skills: [] };
  const models = (S.status && S.status.models) || [];

  const err = h("p", { class: "form-error", role: "alert", hidden: true });
  const name = h("input", { type: "text", id: "f-name", value: draft.name, maxlength: 64, autocomplete: "off", placeholder: "for example: editor" });
  const model = h("input", { type: "text", id: "f-model", value: draft.model, list: "loaded-models", autocomplete: "off", placeholder: "Any model that is on" });
  const prompt = h("textarea", { id: "f-prompt", rows: 4 }, draft.system_prompt);
  prompt.value = draft.system_prompt;

  const configList = h("div", {});
  const addConfig = (text) => {
    const row = h("div", { class: "row" },
      h("input", { type: "text", value: text, "aria-label": "Config instruction", placeholder: "for example: Answer in plain English." }),
      h("button", { class: "btn small danger", type: "button", onclick: () => row.remove() }, "Remove"));
    configList.append(row); return row;
  };
  draft.config.forEach(addConfig);

  const chosen = new Set(draft.skills);
  const pickList = (builtin) => S.skills.filter((sk) => sk.builtin === builtin).map((sk) =>
    h("label", { class: "pick" },
      h("input", { type: "checkbox", class: "skill-pick", value: sk.id, checked: chosen.has(sk.id) }),
      h("div", {}, sk.name, h("span", {}, sk.description || sk.instructions.slice(0, 140)))));
  const custom = pickList(false);
  const skillPicker = h("div", {},
    h("div", { class: "subhead" }, "Actions"),
    h("p", { class: "hint" }, "Let the agent work with files in its own folder."),
    pickList(true),
    h("div", { class: "subhead" }, "Your skills"),
    custom.length ? custom : h("p", { class: "hint" }, "You have not made any skills yet. Use the Skills page to make one."));

  const collect = () => ({
    name: name.value.trim(),
    model: model.value.trim(),
    system_prompt: prompt.value,
    config: [...configList.querySelectorAll("input")].map((i) => i.value.trim()).filter(Boolean),
    skills: [...skillPicker.querySelectorAll(".skill-pick")].filter((i) => i.checked).map((i) => i.value),
  });

  const save = async () => {
    err.hidden = true;
    const data = collect();
    try {
      const saved = existing
        ? await api("/api/agents/" + encodeURIComponent(existing.name), { method: "PUT", body: data })
        : await api("/api/agents", { method: "POST", body: data });
      if (existing && saved.name !== existing.name) {
        setHistory(saved.name, getHistory(existing.name)); localStorage.removeItem(historyKey(existing.name));
      }
      await loadAgents();
      toast(existing ? "Agent saved" : "Agent created");
      go({ kind: "edit", agent: saved.name });
    } catch (e) { err.textContent = e.message; err.hidden = false; err.scrollIntoView({ block: "nearest" }); }
  };

  const remove = async () => {
    if (!confirm(`Delete ${existing.name}? Its settings, chat history and every file in its folder will be removed.`)) return;
    try {
      await api("/api/agents/" + encodeURIComponent(existing.name), { method: "DELETE" });
      localStorage.removeItem(historyKey(existing.name));
      await loadAgents(); toast("Agent deleted"); go({ kind: "chat", agent: DIRECT });
    } catch (e) { err.textContent = e.message; err.hidden = false; }
  };

  const form = h("form", { class: "form", onsubmit: (e) => { e.preventDefault(); save(); } },
    err,
    h("div", { class: "field" }, h("label", { for: "f-name" }, "Name"),
      h("p", { class: "hint" }, "Letters, numbers, - and _ only."), name),
    h("div", { class: "field" }, h("label", { for: "f-model" }, "Preferred model"),
      h("p", { class: "hint" }, "Leave empty to use whichever model is on. You can still switch models in the chat."),
      model, h("datalist", { id: "loaded-models" }, models.map((m) => h("option", { value: m })))),
    h("div", { class: "field" }, h("label", { for: "f-prompt" }, "System prompt"),
      h("p", { class: "hint" }, "Who the agent is and how it should behave."), prompt),
    h("div", { class: "section" },
      h("div", { class: "section-head" }, h("h3", {}, "Config"),
        h("button", { class: "btn small", type: "button", onclick: () => addConfig("").querySelector("input").focus() }, "Add instruction")),
      h("p", { class: "hint" }, "Instructions added to the end of every message you send this agent."),
      configList),
    h("div", { class: "section" },
      h("div", { class: "section-head" }, h("h3", {}, "Skills"),
        h("button", { class: "btn small", type: "button", onclick: () => go({ kind: "skills" }) }, "Manage skills")),
      h("p", { class: "hint" }, "Choose what this agent can do. Skills are added to its instructions."),
      skillPicker),
    existing ? workspaceSection(existing) : null,
    h("div", { class: "form-actions" },
      h("button", { class: "btn primary", type: "submit" }, existing ? "Save agent" : "Create agent"),
      existing ? h("button", { class: "btn", type: "button", onclick: () => go({ kind: "chat", agent: existing.name }) }, "Chat with agent") : null,
      h("span", { class: "spacer" }),
      existing ? h("button", { class: "btn danger", type: "button", onclick: remove }, "Delete agent")
               : h("button", { class: "btn", type: "button", onclick: () => go({ kind: "chat", agent: DIRECT }) }, "Cancel")));

  fill($("main"), 
    h("div", { class: "bar" }, menuButton(), h("h2", {}, existing ? `Edit ${existing.name}` : "New agent")),
    h("div", { class: "editor" }, form));
  if (!existing) name.focus();
}

function workspaceSection(agent) {
  const list = h("ul", { class: "files" }, h("li", {}, "Loading\u2026"));
  const show = async () => {
    try {
      const d = await api("/api/agents/" + encodeURIComponent(agent.name) + "/files");
      fill(list, d.files.length
        ? d.files.map((f) => h("li", {}, h("span", {}, f.path), h("small", {}, f.size < 1024 ? f.size + " B" : (f.size / 1024).toFixed(1) + " KB")))
        : h("li", {}, h("small", {}, "No files yet.")));
    } catch (e) { fill(list, h("li", {}, h("small", {}, e.message))); }
  };
  show();
  return h("div", { class: "section" },
    h("div", { class: "section-head" }, h("h3", {}, "Folder"),
      h("div", { style: "display:flex;gap:8px" },
        h("button", { class: "btn small", type: "button", onclick: show }, "Refresh"),
        h("button", { class: "btn small", type: "button", onclick: async () => {
          try { await api("/api/agents/" + encodeURIComponent(agent.name) + "/open-folder", { method: "POST" }); }
          catch (e) { toast(e.message); }
        } }, "Open folder"))),
    h("p", { class: "hint" }, "Every file this agent makes is saved here. Deleting the agent deletes this folder."),
    h("div", { class: "path" }, agent.workspace),
    list);
}

/* ---------------------------------------------------------------- skills */
function renderSkills() {
  const builtin = S.skills.filter((sk) => sk.builtin);
  const custom = S.skills.filter((sk) => !sk.builtin);
  const usedBy = (id) => S.agents.filter((a) => a.skills.includes(id)).map((a) => a.name);
  const users = (id) => { const u = usedBy(id); return u.length ? "Used by " + u.join(", ") : "Not used by any agent"; };

  const editor = (sk, onDone) => {
    const err = h("p", { class: "form-error", role: "alert", hidden: true });
    const name = h("input", { type: "text", value: sk ? sk.name : "", maxlength: 80, placeholder: "for example: Plain English", "aria-label": "Skill name" });
    const desc = h("input", { type: "text", value: sk ? sk.description : "", maxlength: 300, placeholder: "One line shown when choosing skills", "aria-label": "Description" });
    const instr = h("textarea", { rows: 5, placeholder: "What the agent should do when using this skill", "aria-label": "Instructions" });
    instr.value = sk ? sk.instructions : "";
    const save = async () => {
      err.hidden = true;
      const data = { name: name.value, description: desc.value, instructions: instr.value };
      try {
        if (sk) await api("/api/skills/" + encodeURIComponent(sk.id), { method: "PUT", body: data });
        else await api("/api/skills", { method: "POST", body: data });
        await loadSkills(); toast(sk ? "Skill saved" : "Skill created"); onDone();
      } catch (e) { err.textContent = e.message; err.hidden = false; }
    };
    const form = h("form", { class: "form skill-card", onsubmit: (e) => { e.preventDefault(); save(); } }, err,
      h("div", { class: "field" }, h("label", {}, "Name"), name),
      h("div", { class: "field" }, h("label", {}, "Description"), desc),
      h("div", { class: "field" }, h("label", {}, "Instructions"), instr),
      h("div", { class: "form-actions" },
        h("button", { class: "btn primary", type: "submit" }, sk ? "Save skill" : "Create skill"),
        h("button", { class: "btn", type: "button", onclick: onDone }, "Cancel")));
    setTimeout(() => name.focus(), 0);
    return form;
  };

  const customCard = (sk) => {
    const card = h("div", { class: "skill-card" },
      h("h4", {}, sk.name, h("span", { style: "display:flex;gap:12px" },
        h("button", { class: "link", onclick: () => card.replaceWith(editor(sk, renderSkills)) }, "Edit"),
        h("button", { class: "link", style: "color:var(--bad)", onclick: async () => {
          if (!confirm(`Delete the skill ${sk.name}? Agents using it will stop using it.`)) return;
          try { await api("/api/skills/" + encodeURIComponent(sk.id), { method: "DELETE" });
                await Promise.all([loadSkills(), loadAgents()]); toast("Skill deleted"); renderSkills(); }
          catch (e) { toast(e.message); }
        } }, "Delete"))),
      sk.description ? h("p", {}, sk.description) : null,
      h("div", { class: "instr" }, sk.instructions),
      h("p", {}, users(sk.id)));
    return card;
  };

  const newSlot = h("div", {});
  $("main").replaceChildren(
    h("div", { class: "bar" }, menuButton(), h("h2", {}, "Skills"),
      h("button", { class: "btn small primary", onclick: () => fill(newSlot, editor(null, renderSkills)) }, "New skill")),
    h("div", { class: "editor" }, h("div", { class: "form" },
      newSlot,
      h("div", { class: "skill-group" }, h("h3", {}, "Your skills"),
        h("p", { class: "hint" }, "Instructions you write once and give to any agent. Choose them in each agent\u2019s settings."),
        custom.length ? custom.map(customCard) : h("p", { class: "hint" }, "None yet. Click New skill to make one.")),
      h("div", { class: "skill-group" }, h("h3", {}, "Built-in actions"),
        h("p", { class: "hint" }, "These let an agent work with files. Each agent can only reach its own folder."),
        builtin.map((sk) => h("div", { class: "skill-card" },
          h("h4", {}, sk.name, h("span", { class: "tag" }, "Built in")),
          h("p", {}, sk.description),
          h("p", {}, users(sk.id))))))));
}

/* ------------------------------------------------------------------ start */
(async function start() {
  await Promise.all([refreshStatus(), loadAgents(), loadSkills()]);
  renderMain();
  setInterval(refreshStatus, 4000);
})();
</script>

<style>
:root {
  /* from the Axis logo: tan #D4A574, ink #151515, off-white #EBEAE7 */
  --bg: #ebeae7; --surface: #f7f6f3; --ink: #151515; --muted: #5c5249; --line: #d3cfc8; --code: #efede9;
  --panel: #d4a574; --panel-ink: #151515; --panel-muted: #3e2f20; --panel-hover: rgba(255,255,255,.28);
  --panel-active: rgba(255,255,255,.55); --panel-line: rgba(21,21,21,.16);
  --accent: #151515; --accent-ink: #ebeae7; --accent-soft: #f0dfc9; --link: #875420; --tan: #d4a574;
  --ok: #1c5e34; --bad: #8e1b12; --warn: #6b3300;
  --serif: "Palatino Linotype", "Book Antiqua", Palatino, "URW Palladio L", Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
  color-scheme: light;
}
/* Theme: Settings (top right) sets data-theme on <html> to "light" or "dark"; without it the system setting is used. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151515; --surface: #221e1b; --ink: #ebeae7; --muted: #a89d90; --line: #3a332c; --code: #1a1714;
    --panel: #1c1814; --panel-ink: #ebeae7; --panel-muted: #a89d90; --panel-hover: rgba(212,165,116,.10);
    --panel-active: rgba(212,165,116,.20); --panel-line: #2e2822;
    --accent: #d4a574; --accent-ink: #151515; --accent-soft: #3a2c1e; --link: #d4a574;
    --ok: #5bc48a; --bad: #f07a68; --warn: #e8a34a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151515; --surface: #221e1b; --ink: #ebeae7; --muted: #a89d90; --line: #3a332c; --code: #1a1714;
  --panel: #1c1814; --panel-ink: #ebeae7; --panel-muted: #a89d90; --panel-hover: rgba(212,165,116,.10);
  --panel-active: rgba(212,165,116,.20); --panel-line: #2e2822;
  --accent: #d4a574; --accent-ink: #151515; --accent-soft: #3a2c1e; --link: #d4a574;
  --ok: #5bc48a; --bad: #f07a68; --warn: #e8a34a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { display: grid; grid-template-columns: 272px 1fr; height: 100%; }

/* ---------- sidebar ---------- */
.side { background: var(--panel); color: var(--panel-ink); border-right: 1px solid var(--panel-line); display: flex; flex-direction: column; min-height: 0; }
.brand { padding: 20px 20px 0; }
.brand-row { display: flex; align-items: center; gap: 12px; }
.brand img { width: 44px; height: 44px; border-radius: 10px; box-shadow: 0 0 0 1px var(--panel-line); }
.brand h1 { font: 400 32px/1 var(--serif); letter-spacing: .02em; margin: 0; }
.axisline { height: 3px; margin: 16px 0 0; border-radius: 2px; background: var(--panel-muted); transition: background .4s; }
.axisline.ok { background: var(--ok); } .axisline.bad { background: var(--bad); } .axisline.warn { background: var(--warn); }
/* update badge (top of the sidebar) */
.brand { position: relative; }
.upd { margin-left: auto; border: 0; border-radius: 10px; padding: 4px 9px; font: 600 11px/1.2 var(--sans); white-space: nowrap; background: var(--panel-line); color: var(--panel-ink); }
.upd.ok { background: var(--ok); color: var(--accent-ink); }
.upd.warn { background: var(--warn); color: var(--accent-ink); cursor: pointer; }
.upd.bad { background: var(--bad); color: var(--accent-ink); cursor: pointer; }
.upd.busy { cursor: pointer; }
button.upd { cursor: pointer; }
button.upd:hover { filter: brightness(1.12); }
.upd-pop { position: absolute; top: 70px; left: 12px; right: 12px; z-index: 50; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.18); font-size: 13px; }
.upd-pop h3 { margin: 0 0 6px; font-size: 14px; }
.upd-pop p { margin: 0 0 10px; }
.upd-pop .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.upd-pop code { font: 12px var(--mono); overflow-wrap: anywhere; }
.upd-pop pre { max-height: 140px; overflow: auto; background: var(--code); padding: 8px; border-radius: 6px; font: 11px/1.4 var(--mono); white-space: pre-wrap; margin: 0 0 10px; }
.status { padding: 14px 20px 18px; border-bottom: 1px solid var(--panel-line); }
.status-title { font-weight: 600; display: flex; align-items: center; gap: 8px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--panel-muted); flex: none; }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); }
.status-detail { color: var(--panel-muted); font-size: 13px; margin-top: 4px; overflow-wrap: anywhere; }
.status-models { list-style: none; padding: 0; margin: 6px 0 0; font: 13px/1.6 var(--mono); }
.nav { flex: 1; overflow-y: auto; padding: 12px 10px 20px; }
.side :focus-visible { outline-color: var(--panel-ink); }
.nav h2 { font: 600 13px/1 var(--sans); color: var(--panel-muted); margin: 18px 10px 8px; display: flex; justify-content: space-between; align-items: center; }
.nav-item { display: block; width: 100%; text-align: left; border: 0; background: none; color: var(--panel-ink); padding: 8px 10px; border-radius: 6px; cursor: pointer; }
.nav-item:hover { background: var(--panel-hover); }
.nav-item[aria-current="true"] { background: var(--panel-active); box-shadow: inset 3px 0 0 var(--panel-ink); }
.nav-item small { display: block; color: var(--panel-muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-empty { color: var(--panel-muted); font-size: 13px; padding: 4px 10px; }

/* ---------- buttons ---------- */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 14px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
a.btn { display: inline-block; text-decoration: none; color: var(--ink); line-height: 1.5; }
.side .link { color: var(--panel-ink); text-decoration: underline; text-underline-offset: 3px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.danger { color: var(--bad); }
.btn.small { padding: 3px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.link { border: 0; background: none; color: var(--link); cursor: pointer; padding: 0; font-size: 13px; font-weight: 600; }
.link:disabled { color: var(--muted); cursor: not-allowed; }

/* ---------- main ---------- */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.bar { display: flex; align-items: center; gap: 12px; padding: 12px 24px; border-bottom: 1px solid var(--line); background: var(--surface); flex-wrap: wrap; }
.bar h2 { font: 400 22px/1.2 var(--serif); margin: 0; flex: 1; min-width: 120px; overflow-wrap: anywhere; }
.bar label { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; }
select { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 8px; max-width: 240px; }
.menu-btn { display: none; }
/* Quit is pinned to the top-right corner of every page's top bar, even when the bar wraps onto more lines. */
.bar.has-quit { position: relative; padding-right: 210px; }
.bar-corner { position: absolute; top: 13px; right: 24px; display: flex; gap: 8px; }
.bar .quit-btn:hover { color: var(--bad); border-color: var(--bad); }
.settings-pop { position: absolute; top: calc(100% + 6px); right: 0; z-index: 60; width: 240px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.18); font-size: 14px; }
.settings-pop h3 { margin: 0 0 8px; font: 600 13px/1.2 var(--sans); color: var(--muted); }
.settings-pop fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.settings-pop label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.settings-pop input { accent-color: var(--accent); }
.note { padding: 8px 24px; font-size: 13px; color: var(--warn); background: var(--surface); border-bottom: 1px solid var(--line); }

.thread { flex: 1; overflow-y: auto; padding: 24px; }
.thread-inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.msg { max-width: 100%; }
.msg.user { align-self: flex-end; background: var(--accent-soft); padding: 10px 14px; border-radius: 12px 12px 2px 12px; white-space: pre-wrap; overflow-wrap: anywhere; max-width: 85%; }
.msg.ai { overflow-wrap: anywhere; }
.msg.ai > :first-child { margin-top: 0; } .msg.ai > :last-child { margin-bottom: 0; }
.msg.ai pre { background: var(--code); border: 1px solid var(--line); border-radius: 6px; padding: 12px; overflow-x: auto; font: 13px/1.5 var(--mono); }
.msg.ai code { font-family: var(--mono); font-size: .9em; background: var(--code); padding: 1px 4px; border-radius: 4px; }
.msg.ai pre code { background: none; padding: 0; font-size: inherit; }
.msg.ai h3, .msg.ai h4 { font-family: var(--serif); font-weight: 600; margin: 1em 0 .4em; }
.msg-tools { margin-top: 6px; display: flex; gap: 12px; }
.msg-u { align-self: flex-end; display: flex; flex-direction: column; align-items: flex-end; max-width: 85%; }
.msg-u .msg.user { max-width: 100%; }
.msg-u .msg-tools { margin-top: 4px; opacity: .55; transition: opacity .15s; }
.msg-u:hover .msg-tools, .msg-u .msg-tools:focus-within { opacity: 1; }
.msg-u.editing { width: 85%; }
.msg.user.editing { width: 100%; white-space: normal; border-radius: 12px; }
.msg-edit-box { display: block; width: 100%; min-height: 60px; resize: vertical; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface); line-height: 1.5; }
.msg-edit-box:focus { border-color: var(--accent); outline: none; }
.msg-edit-row { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.msg-edit-row small { color: var(--muted); margin-right: auto; }
.msg.error { color: var(--bad); border-left: 3px solid var(--bad); padding: 4px 12px; white-space: pre-wrap; }
.typing { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; padding: 4px 0; }
.typing-label { animation: pulse 1.6s ease-in-out infinite; }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--tan); animation: bounce 1.2s infinite ease-in-out; }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
.elapsed { font: 12px/1 var(--mono); color: var(--muted); }
@keyframes pulse { 50% { opacity: .45; } }
@keyframes bounce { 0%, 80%, 100% { transform: scale(.55); opacity: .5; } 40% { transform: scale(1); opacity: 1; } }
@keyframes spin { to { transform: rotate(360deg); } }
.msg.ai pre { position: relative; }
.code-copy { position: absolute; top: 6px; right: 6px; font: 600 11px/1 var(--sans); padding: 4px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--muted); cursor: pointer; opacity: 0; transition: opacity .15s; }
.msg.ai pre:hover .code-copy, .code-copy:focus-visible { opacity: 1; }
.msg-tools { align-items: baseline; flex-wrap: wrap; }
.msg-stats { color: var(--muted); font-size: 12px; }
.msg-note { color: var(--muted); font-size: 12px; font-style: italic; }
.nav-item.busy small { color: var(--panel-ink); }
/* Models sub-tabs: shown under Models only while the Models page is open */
.nav-sub { padding: 2px 0 6px 14px; margin-left: 10px; border-left: 1px solid var(--panel-line); }
.nav-sub .nav-item { padding: 5px 10px; font-size: 14px; }
.nav-sub .nav-item small { display: inline; margin-left: 6px; }
.busy-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--panel-ink); margin-right: 6px; animation: pulse 1.2s infinite; vertical-align: middle; }
.meter { display: inline-block; width: 70px; height: 6px; border-radius: 3px; background: var(--line); vertical-align: middle; margin: 0 6px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ok); }
.meter.warn i { background: var(--warn); } .meter.bad i { background: var(--bad); }
.empty { color: var(--muted); text-align: center; margin: 12vh auto 0; max-width: 460px; }
.empty h3 { font: 400 24px/1.3 var(--serif); color: var(--ink); margin: 0 0 8px; }

.composer { border-top: 1px solid var(--line); background: var(--surface); padding: 14px 24px 18px; }
.composer-inner { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
.composer textarea { flex: 1; resize: none; min-height: 44px; max-height: 220px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--surface); }
.composer-hint { max-width: 760px; margin: 6px auto 0; font-size: 12px; color: var(--muted); }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); cursor: pointer; user-select: none; }
.check input { margin: 0; accent-color: var(--tan); }
.composer-opts { max-width: 760px; margin: 6px auto 0; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.composer-opts .link { font-size: 13px; }
.composer.drop .composer-inner textarea { border-color: var(--accent); border-style: dashed; }
.attach-row { max-width: 760px; margin: 0 auto 8px; display: flex; gap: 8px; flex-wrap: wrap; }
.attach { position: relative; width: 64px; height: 64px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--code); }
.attach img { width: 100%; height: 100%; object-fit: cover; display: block; }
.attach button { position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; border-radius: 50%; border: 0; padding: 0;
  background: var(--accent); color: var(--accent-ink); font: 600 13px/20px var(--sans); cursor: pointer; }
.attach.busy::after { content: ""; position: absolute; inset: 0; background: var(--surface); opacity: .6; }
.msg-pics { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; margin-bottom: 6px; }
.msg.user .msg-pics { margin: 0 0 6px; }
.msg-pics a { display: block; width: 120px; height: 120px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); background: var(--code); }
.msg-pics img { width: 100%; height: 100%; object-fit: cover; display: block; }
.msg-pics .gone { display: flex; align-items: center; justify-content: center; text-align: center; font-size: 12px; color: var(--muted); padding: 6px; }

/* ---------- picture picker ---------- */
.picker { border: 1px solid var(--line); border-radius: 10px; padding: 0; background: var(--surface); color: var(--ink);
  width: min(760px, 94vw); max-height: 86vh; }
.picker::backdrop { background: rgba(0, 0, 0, .45); }
.picker-inner { display: flex; flex-direction: column; max-height: 86vh; }
.picker-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.picker-head h3 { font: 400 20px/1.3 var(--serif); margin: 0; flex: 1; }
.picker .crumbs { padding: 8px 16px 0; margin: 0; }
.picker-body { overflow-y: auto; padding: 12px 16px 16px; }
.picker-dirs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.picker-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.picker-grid button { border: 1px solid var(--line); border-radius: 6px; padding: 0; background: var(--code); cursor: pointer; overflow: hidden; text-align: left; }
.picker-grid button:hover, .picker-grid button:focus-visible { border-color: var(--accent); }
.picker-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
.picker-grid small { display: block; padding: 4px 6px; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- gate ---------- */
.gate { max-width: 620px; margin: 8vh auto 0; }
.gate h3 { font: 400 26px/1.3 var(--serif); margin: 0 0 6px; }
.gate p { color: var(--muted); margin: 0 0 18px; }
.gate h4 { margin: 20px 0 6px; font-size: 15px; }
.gate ol { margin: 0; padding-left: 20px; }
.gate li { margin: 4px 0; }
.cmd { display: flex; align-items: center; gap: 8px; background: var(--code); border: 1px solid var(--line); border-radius: 6px; padding: 6px 6px 6px 12px; margin: 6px 0; }
.cmd code { flex: 1; font: 13px/1.5 var(--mono); overflow-x: auto; white-space: nowrap; }

/* ---------- editor ---------- */
.editor { flex: 1; overflow-y: auto; padding: 24px; }
.form { max-width: 720px; margin: 0 auto; }
.field { margin-bottom: 22px; }
.field > label, .section-head h3 { display: block; font-weight: 600; margin-bottom: 4px; }
.hint { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
.form input[type=text], .form textarea { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--surface); }
.form textarea { resize: vertical; min-height: 90px; }
.section { border-top: 1px solid var(--line); padding-top: 18px; margin-top: 8px; margin-bottom: 22px; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.section-head h3 { font: 400 20px/1.3 var(--serif); margin: 0; }
.row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
.row input { flex: 1; }
.skill { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 10px; background: var(--surface); }
.skill.off { opacity: .65; }
.skill .row { margin-bottom: 8px; }
.switch { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; cursor: pointer; }
.switch input { width: 16px; height: 16px; accent-color: var(--accent); }
.form-actions { display: flex; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 18px; }
.form-actions .spacer { flex: 1; }
.form-error { color: var(--bad); margin: 0 0 12px; }

/* ---------- tool steps ---------- */
.step { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); margin: 10px 0; font-size: 14px; }
.step > summary { cursor: pointer; padding: 7px 12px; display: flex; gap: 8px; align-items: center; list-style: none; }
.step > summary::-webkit-details-marker { display: none; }
.step > summary::before { content: "\25B8"; color: var(--muted); font-size: 11px; transition: transform .15s; }
.step[open] > summary::before { transform: rotate(90deg); }
.step.running > summary { color: var(--muted); }
.step.running > summary::after { content: ""; width: 11px; height: 11px; border: 2px solid var(--muted); border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
.step.failed > summary { color: var(--bad); }
.step-body { padding: 0 12px 10px; }
.step-body pre { margin: 6px 0 0; background: var(--code); border: 1px solid var(--line); border-radius: 6px; padding: 10px; overflow-x: auto; font: 12.5px/1.45 var(--mono); max-height: 320px; overflow-y: auto; white-space: pre-wrap; }
.step-label { color: var(--muted); font-size: 12px; margin-top: 8px; }

/* ---------- skills ---------- */
.skill-group { margin-bottom: 28px; }
.skill-group > h3 { font: 400 20px/1.3 var(--serif); margin: 0 0 4px; }
.skill-card { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-top: 10px; background: var(--surface); }
.skill-card h4 { margin: 0; font-size: 15px; display: flex; gap: 10px; align-items: baseline; justify-content: space-between; }
.skill-card p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.skill-card .instr { white-space: pre-wrap; color: var(--ink); font-size: 13px; margin-top: 8px; border-left: 3px solid var(--line); padding-left: 10px; }
.tag { font: 600 12px/1 var(--sans); color: var(--link); }
.pick { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; background: var(--surface); cursor: pointer; }
.pick input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--accent); flex: none; }
.pick span { display: block; color: var(--muted); font-size: 13px; }
.subhead { font-weight: 600; font-size: 14px; margin: 14px 0 8px; }
.files { list-style: none; padding: 0; margin: 8px 0 0; font: 13px/1.7 var(--mono); max-height: 260px; overflow-y: auto; }
.files li { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); }
.files small { color: var(--muted); font-family: var(--sans); }
.path { font: 13px/1.5 var(--mono); overflow-wrap: anywhere; color: var(--muted); }

.skill-card h4 .skill-name { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.skill-tools { display: flex; gap: 14px; flex: none; }
.tag.edited { color: var(--warn); }
.sends { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
.sends > summary, .sends-sub > summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--link); }
.sends-sub { margin-top: 8px; }
.sends pre { margin: 6px 0 10px; background: var(--code); border: 1px solid var(--line); border-radius: 6px; padding: 10px; font: 12.5px/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 340px; overflow: auto; }
.sends .step-label { margin-top: 10px; }
.sends .hint { margin: 4px 0 0; }

/* ---------- files ---------- */
.fb { display: grid; grid-template-columns: minmax(240px, 360px) 1fr; flex: 1; min-height: 0; }
.fb-list { overflow-y: auto; border-right: 1px solid var(--line); background: var(--surface); }
.fb-row { display: grid; grid-template-columns: 20px 1fr auto; gap: 10px; align-items: center; width: 100%; text-align: left;
  border: 0; border-bottom: 1px solid var(--line); background: none; padding: 9px 16px; cursor: pointer; }
.fb-row:hover { background: var(--accent-soft); }
.fb-row[aria-current="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--ink); }
.fb-row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fb-row small { color: var(--muted); font-size: 12px; white-space: nowrap; }
.fb-ico { width: 18px; height: 18px; color: var(--muted); }
.fb-ico.dir { color: var(--link); }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 8px 24px; border-bottom: 1px solid var(--line); background: var(--surface); font-size: 14px; }
.crumbs button { border: 0; background: none; color: var(--link); cursor: pointer; padding: 2px 4px; border-radius: 4px; font-weight: 600; }
.crumbs button:hover { background: var(--accent-soft); }
.crumbs span { color: var(--muted); }
.fb-view { overflow: auto; padding: 20px 24px; min-width: 0; }
.fb-view h3 { font: 400 22px/1.3 var(--serif); margin: 0; overflow-wrap: anywhere; }
.fb-meta { color: var(--muted); font-size: 13px; margin: 2px 0 12px; }
.fb-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.fb-view pre { background: var(--code); border: 1px solid var(--line); border-radius: 6px; padding: 12px; overflow: auto; font: 13px/1.5 var(--mono); margin: 0; white-space: pre; tab-size: 4; }
.fb-view img { max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 6px; background: repeating-conic-gradient(var(--code) 0 25%, var(--surface) 0 50%) 0 0 / 16px 16px; }
.fb-view iframe { width: 100%; height: 70vh; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
.fb-md { max-width: 760px; } .fb-md pre { white-space: pre-wrap; }
.fb-md code { font-family: var(--mono); background: var(--code); padding: 1px 4px; border-radius: 4px; }
.fb-table { overflow-x: auto; } .fb-table table { border-collapse: collapse; font-size: 13px; }
.fb-table th, .fb-table td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; white-space: nowrap; }
.fb-table th { background: var(--code); }
.fb-empty { color: var(--muted); padding: 24px 16px; }
@media (max-width: 760px) { .fb { grid-template-columns: 1fr; grid-template-rows: minmax(160px, 40%) 1fr; } .fb-list { border-right: 0; border-bottom: 1px solid var(--line); } .crumbs, .fb-view { padding-left: 14px; padding-right: 14px; } }

/* workspace: folder rows with a terminal button, the editor and the output of a Python run */
.fb-line { display: flex; align-items: stretch; border-bottom: 1px solid var(--line); }
.fb-line .fb-row { flex: 1; min-width: 0; border-bottom: 0; }
.fb-line[draggable="true"] { -webkit-user-drag: element; }
.fb-line.dragging { opacity: .45; }
.fb-line.drop-into, .crumbs button.drop-into { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); border-radius: 4px; }
.fb-term { flex: none; border: 0; border-left: 1px solid var(--line); background: none; color: var(--muted); padding: 0 12px; cursor: pointer; display: flex; align-items: center; }
.fb-term:hover, .fb-term:focus-visible { color: var(--ink); background: var(--accent-soft); }
.fb-ico.term, .fb-ico.pencil, .fb-ico.chev { color: inherit; }
.fb-edit { display: block; width: 100%; min-height: 60vh; resize: vertical; border: 1px solid var(--line); border-radius: 6px; padding: 12px; background: var(--code); font: 13px/1.5 var(--mono); tab-size: 4; white-space: pre; overflow: auto; }
.fb-edit:focus { border-color: var(--accent); outline: none; }
.fb-edit-note { color: var(--muted); font-size: 12px; margin: 6px 0 0; }

/* ---------- agents ---------- */
.agent-tools { display: flex; gap: 14px; padding-right: 14px; flex: none; flex-wrap: wrap; }

/* ---------- terminal ---------- */
.term-tabs { display: flex; gap: 4px; flex-wrap: wrap; padding: 6px 24px 0; border-bottom: 1px solid var(--line); background: var(--surface); }
.term-tab { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-bottom: 0; border-radius: 6px 6px 0 0; background: var(--bg); padding: 4px 6px 4px 12px; font-size: 13px; }
.term-tab[aria-selected="true"] { background: var(--code); font-weight: 600; box-shadow: inset 0 2px 0 var(--tan); }
.term-tab button { border: 0; background: none; cursor: pointer; padding: 0 4px; color: inherit; font: inherit; }
.term-tab .x { color: var(--muted); font-weight: 400; }
.term-tab .x:hover { color: var(--bad); }
.term-tab.closed .label { color: var(--muted); text-decoration: line-through; }
.term { display: grid; grid-template-columns: minmax(0, 1fr); flex: 1; min-height: 0; }
.term.with-side { grid-template-columns: minmax(0, 1fr) minmax(300px, 380px); }
.term-main { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--code); }
.term-out { flex: 1; margin: 0; padding: 12px 16px; overflow: auto; font: 13px/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink); }
.term-out:focus { outline: none; }
.term-empty { flex: 1; overflow-y: auto; padding: 24px; background: var(--bg); }
.term-side { border-left: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.term-side-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.term-side-head label { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
.term-side-head select { flex: 1; min-width: 0; }
.term-side .thread { padding: 12px 14px; background: var(--bg); }
.term-side .msg.user { max-width: 95%; }
.term-side .msg-u { max-width: 95%; } .term-side .msg-u .msg.user { max-width: 100%; }
.term-side .empty { margin-top: 6vh; }
.term-side .empty h3 { font-size: 20px; }
.term-ask { border-top: 1px solid var(--line); padding: 10px 14px 12px; }
.term-ask-row { display: flex; gap: 8px; align-items: flex-end; }
.term-ask textarea { flex: 1; resize: none; min-height: 40px; max-height: 160px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface); }
.term-ask .hint { margin: 6px 0 0; font-size: 12px; }
.term-side > .hint { padding: 14px; margin: 0; }
@media (max-width: 760px) {
  .term.with-side { grid-template-columns: 1fr; grid-template-rows: 1fr minmax(240px, 45%); }
  .term-side { border-left: 0; border-top: 1px solid var(--line); }
  .term-tabs { padding-left: 14px; padding-right: 14px; }
}

/* ---------- terminal text area: the output and the line being typed are one piece of text ---------- */
.term-surface { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.term-surface:focus-within { box-shadow: inset 0 0 0 1px var(--tan); }
.term-surface .term-out { cursor: text; }
.term-cap { position: absolute; left: 0; bottom: 0; width: 1px; height: 1px; padding: 0; border: 0; opacity: 0; resize: none; overflow: hidden; pointer-events: none; }
.term-typed { white-space: pre-wrap; }
.term-caret { background: var(--ink); color: var(--code); animation: caret 1.1s steps(1) infinite; }
.term-surface:not(:focus-within) .term-caret { background: transparent; color: inherit; outline: 1px solid var(--muted); outline-offset: -1px; animation: none; }
@keyframes caret { 50% { background: transparent; color: inherit; } }

/* ---------- workspace as a light editor: files, a terminal underneath, an agent beside ---------- */
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); font-weight: 600; }
.ide-toggles { display: flex; gap: 6px; }
.crumbbar { display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); background: var(--surface); padding-right: 24px; }
.crumbbar .crumbs { flex: 1; min-width: 0; border-bottom: 0; }
.crumb-tools { display: flex; gap: 6px; flex: none; align-items: center; }
.ide { display: grid; grid-template-columns: minmax(0, 1fr); flex: 1; min-height: 0; }
.ide.with-side { grid-template-columns: minmax(0, 1fr) minmax(300px, 380px); }
.ide-main { display: flex; flex-direction: column; min-height: 0; min-width: 0; --dock-h: 260px; }
.ide-main > .fb { flex: 1; }
.menu-pop { position: absolute; top: calc(100% + 6px); right: 0; z-index: 60; min-width: 190px; display: flex; flex-direction: column;
  background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
.menu-pop[hidden] { display: none; }
.menu-item { border: 0; background: none; text-align: left; padding: 7px 10px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
.menu-item:hover, .menu-item:focus-visible { background: var(--accent-soft); }
.menu-item.danger { color: var(--bad); }
/* rename: a pencil that appears over the end of a row, and the name box that replaces the row's text */
.fb-act { flex: none; width: 34px; margin-left: -34px; position: relative; z-index: 1; border: 0; background: var(--accent-soft); color: var(--muted);
  display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0; pointer-events: none; }
.fb-line:hover .fb-act, .fb-line:focus-within .fb-act { opacity: 1; pointer-events: auto; }
.fb-act:hover, .fb-act:focus-visible { color: var(--ink); }
.fb-act svg { width: 16px; height: 16px; }
@media (hover: none) { .fb-act { opacity: 1; pointer-events: auto; } }
.fb-row.editing { cursor: default; background: var(--accent-soft); }
.name-edit-in { min-width: 0; width: 100%; border: 1px solid var(--accent); border-radius: 4px; padding: 2px 6px; background: var(--surface); font: inherit; }
/* the bottom panel: terminals, and the output of a Workspace program */
.dock { flex: none; position: relative; border-top: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
.dock.open { height: var(--dock-h); }
.dock-grip { position: absolute; top: -3px; left: 0; right: 0; height: 6px; cursor: row-resize; z-index: 5; touch-action: none; }
.dock-grip:hover, .dock-grip:focus-visible, .dock-grip.dragging { background: var(--tan); opacity: .7; outline: none; }
.dock-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; padding: 4px 8px 0 12px; border-bottom: 1px solid var(--line); min-height: 38px; }
.dock.collapsed .dock-head { border-bottom: 0; }
.dock-tabs { display: flex; gap: 4px; min-width: 0; overflow-x: auto; }
.dock-title { font-weight: 600; font-size: 13px; padding: 7px 2px; }
.dock-tools { display: flex; gap: 6px; align-items: center; flex: none; padding-bottom: 4px; }
.dock-toggle { border: 0; background: none; cursor: pointer; color: var(--muted); width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
.dock-toggle:hover { background: var(--accent-soft); color: var(--ink); }
.dock-toggle svg { width: 16px; height: 16px; transition: transform .15s; }
.dock.collapsed .dock-toggle svg { transform: rotate(180deg); }
.dock-body { flex: 1; min-height: 0; min-width: 0; display: flex; flex-direction: column; background: var(--code); }
.dock-empty { align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 16px; }
.dock-empty p { margin: 0; }
.dock-out { flex: 1; overflow: auto; padding: 10px 14px 14px; }
.dock-out pre { margin: 4px 0 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px; font: 12.5px/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.dock-out pre.err { color: var(--bad); }
.dock-out .hint { margin: 6px 0 0; font-size: 12px; }
@media (max-width: 760px) {
  .ide.with-side { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(220px, 42%); }
  .ide-side { border-left: 0; border-top: 1px solid var(--line); }
  .crumbbar { flex-wrap: wrap; padding-right: 14px; }
  .crumb-tools { padding: 0 0 8px 14px; flex-wrap: wrap; }
}

/* ---------- past chats ---------- */
.chat-sub { display: block; font: 13px/1.3 var(--sans); color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60ch; }
.chat-search { border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; background: var(--surface); min-width: 160px; }
.chat-group { font: 400 18px/1.3 var(--serif); margin: 22px 0 4px; }
.chat-row { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); margin-top: 8px; }
.chat-row:hover { border-color: var(--accent); }
.chat-open { flex: 1; min-width: 0; text-align: left; border: 0; background: none; padding: 10px 14px; cursor: pointer; }
.chat-open:disabled { cursor: not-allowed; opacity: .6; }
.chat-title { display: flex; gap: 8px; align-items: center; font-weight: 600; overflow-wrap: anywhere; }
.chat-open small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.chat-actions { display: flex; gap: 14px; padding-right: 14px; flex: none; }

/* ---------- models ---------- */
.model-card { border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-top: 12px; background: var(--surface); }
.model-card h4 { margin: 0; font: 600 16px/1.3 var(--mono); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; overflow-wrap: anywhere; }
.kv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px 20px; margin: 12px 0 0; }
.kv dt { font-size: 12px; color: var(--muted); }
.kv dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.kv dd small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font: 600 11px/1 var(--sans); padding: 4px 8px; border-radius: 10px; background: var(--accent-soft); color: var(--ink); }
.chip.on { background: var(--ok); color: var(--surface); }
.model-note { font-size: 13px; color: var(--warn); margin: 10px 0 0; }
.model-card details { margin-top: 10px; font-size: 13px; }
.model-card details pre { background: var(--code); border: 1px solid var(--line); border-radius: 6px; padding: 8px; font: 12px/1.45 var(--mono); white-space: pre-wrap; margin: 6px 0 0; }
.model-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.model-actions .cmd { flex: 1; min-width: 240px; margin: 0; }
.summary-line { color: var(--muted); font-size: 14px; margin: 0 0 6px; }
.fb-list.drop { outline: 2px dashed var(--accent); outline-offset: -6px; }
.install { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 16px 16px 14px; margin-bottom: 28px; }
.install .section-head { margin-bottom: 10px; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin-bottom: 10px; }
.seg button { border: 0; border-left: 1px solid var(--line); background: none; padding: 6px 12px; cursor: pointer; font-size: 13px; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.install-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.form .install-row input[type=text] { flex: 1; width: auto; min-width: 200px; font: 14px/1.6 var(--mono); padding: 8px 10px 9px; height: auto; overflow: visible; }
.install select, .model-card select { border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; background: var(--surface); max-width: 100%; }
.model-card input[type=number] { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--surface); width: 12em; }
.catalog { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; }
.catalog button { border: 1px solid var(--line); border-radius: 999px; background: var(--surface); padding: 3px 10px; cursor: pointer; font: 13px/1.5 var(--mono); }
.catalog button:hover, .catalog button[aria-pressed="true"] { border-color: var(--accent); }
.catalog small { color: var(--muted); font-family: var(--sans, inherit); margin-left: 6px; }
.choose-list { list-style: none; padding: 0; margin: 8px 0 0; max-height: 300px; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; }
.choose-list li { display: flex; gap: 12px; align-items: center; padding: 6px 8px 6px 12px; border-top: 1px solid var(--line); }
.choose-list li:first-child { border-top: 0; }
.choose-name { flex: 1; font: 13px/1.4 var(--mono); overflow-wrap: anywhere; }
.choose-size { color: var(--muted); font-size: 13px; white-space: nowrap; }
.job { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-top: 8px; background: var(--surface); }
.job-head { display: flex; gap: 10px; align-items: center; }
.job-head strong, .job-head .job-meta { flex: 1; overflow-wrap: anywhere; }
.job .ig-progress, .job-inline .ig-progress { margin: 8px 0 6px; }
.job-inline { flex: 1; min-width: 240px; }
.job-meta { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.job.failed { border-color: var(--bad); }
.job.failed .job-meta { color: var(--bad); white-space: pre-wrap; }
.engine-line { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 14px; margin: 6px 0; }
.engine-line .dot { background: var(--line); }
.engine-line > span:not(.dot) { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.engine-line .dot.ok { background: var(--ok); } .engine-line .dot.warn { background: var(--warn); }
.confirm { flex: 1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 12px; border: 1px solid var(--bad); border-radius: 6px; }
.confirm p { flex-basis: 100%; margin: 0 0 4px; font-size: 14px; }
.model-card pre.log { background: var(--code); border: 1px solid var(--line); border-radius: 6px; padding: 8px; font: 12px/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 220px; overflow-y: auto; margin: 6px 0 0; }

/* ---------- images ---------- */
.ig { display: grid; grid-template-columns: minmax(280px, 360px) 1fr; flex: 1; min-height: 0; }
.ig-form { overflow-y: auto; border-right: 1px solid var(--line); background: var(--surface); padding: 18px 18px 24px; }
.ig-form .field { margin-bottom: 14px; }
.ig-form label.lbl { display: block; font-weight: 600; font-size: 13px; margin-bottom: 4px; }
.ig-form textarea, .ig-form input[type=text], .ig-form input[type=number], .ig-form select { width: 100%; max-width: none; border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; background: var(--surface); }
.ig-form textarea { resize: vertical; min-height: 96px; }
.ig-pair { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; align-items: center; }
.ig-pair span { color: var(--muted); font-size: 13px; }
.ig-two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ig-seed { display: flex; gap: 6px; } .ig-seed input { flex: 1; }
.ig-go { display: flex; gap: 8px; margin-top: 6px; } .ig-go .btn { flex: 1; }
.ig-main { overflow-y: auto; padding: 20px 24px; min-width: 0; }
.ig-stage { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 14px; margin-bottom: 22px; }
.ig-stage img { display: block; max-width: 100%; max-height: 62vh; margin: 0 auto; border-radius: 6px; background: repeating-conic-gradient(var(--code) 0 25%, var(--surface) 0 50%) 0 0 / 16px 16px; }
.ig-meta { color: var(--muted); font-size: 13px; margin: 10px 0 0; overflow-wrap: anywhere; }
.ig-prompt { margin: 8px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.ig-progress { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin: 10px 0 6px; }
.ig-progress i { display: block; height: 100%; width: 0; background: var(--tan); transition: width .3s; }
.ig-progress.indef i { width: 30%; animation: slide 1.4s ease-in-out infinite; }
@keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(340%); } }
.ig-log { font: 12px/1.4 var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* Step previews arrive at 1/8 size; they are scaled up to the picture's shape. */
.step-preview { display: block; height: auto; max-height: 62vh; object-fit: contain; border-radius: 6px; background: var(--code); }
.ig-stage .step-preview { margin: 0 auto 10px; }
.chat-image .step-preview { border: 1px solid var(--line); border-radius: 8px; }
.ig-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 0 8px; }
.ig-head h3 { font: 400 20px/1.3 var(--serif); margin: 0; flex: 1; }
.ig-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.ig-thumb { border: 1px solid var(--line); border-radius: 8px; padding: 0; background: var(--surface); cursor: pointer; overflow: hidden; aspect-ratio: 1; }
.ig-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ig-thumb[aria-current="true"] { outline: 3px solid var(--accent); outline-offset: -3px; }
.ig-mode { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin-bottom: 16px; }
.ig-mode button { border: 0; background: transparent; padding: 7px 0; cursor: pointer; font-size: 14px; }
.ig-mode button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.ig-source { border: 1px dashed var(--line); border-radius: 8px; padding: 10px; text-align: center; background: var(--bg); }
.ig-source.drop { border-color: var(--accent); }
.ig-source img { display: block; max-width: 100%; max-height: 200px; margin: 0 auto 8px; border-radius: 4px; }
.ig-source p { margin: 4px 0 8px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.ig-source .fb-actions { justify-content: center; margin: 0; }
.ig-strength { display: flex; gap: 8px; align-items: center; }
.ig-strength input[type=range] { flex: 1; accent-color: var(--tan); }
.ig-strength input[type=number] { width: 72px; }
.ocr-text { width: 100%; min-height: 260px; resize: vertical; border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; background: var(--bg); font: 14px/1.55 var(--mono); white-space: pre-wrap; }
.ocr-pic { display: block; max-width: 100%; max-height: 40vh; margin: 0 auto 12px; border-radius: 6px; }
.chat-image { margin: 6px 0 10px; }
.chat-image img { display: block; max-width: min(100%, 512px); border: 1px solid var(--line); border-radius: 8px; cursor: zoom-in; }
.chat-image small { display: block; color: var(--muted); font-size: 12px; margin-top: 4px; }
.img-form .ig-two { margin-bottom: 0; }
@media (max-width: 760px) { .ig { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } .ig-form { border-right: 0; border-bottom: 1px solid var(--line); max-height: 55vh; } .ig-main { padding-left: 14px; padding-right: 14px; } }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 6px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }

@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  .side { position: fixed; inset: 0 25% 0 0; z-index: 10; transform: translateX(-100%); transition: transform .2s; }
  .app.menu-open .side { transform: none; box-shadow: 0 0 0 100vmax rgba(0,0,0,.35); }
  .menu-btn { display: inline-block; }
  .bar, .thread, .composer, .editor { padding-left: 14px; padding-right: 14px; }
  .bar.has-quit { padding-right: 190px; }
  .bar-corner { right: 14px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<script>
"use strict";
const DIRECT = "";              // chat target id for the plain model chat
const S = {
  update: null,                 // last /api/update result: installed and newest version, update progress
  status: null,                 // last /api/status result
  agents: [],
  skills: [],                   // the skill library
  workspace: { agent: "", dir: "", file: "" },  // Workspace tab position
  editing: null,                // { agent, path, dirty } while a Workspace file is being edited
  msgEdit: null,                // { target, chatId, index, text } while one of your earlier messages is being edited
  wsDrag: null,                 // { agent, path, isDir } while a Workspace file or folder is being dragged
  runOut: null,                 // the Workspace program run: { place, path, running, result | error }
  term: { sessions: [], active: "", buf: {}, loaded: false, side: true, agent: "", history: [], hpos: -1, draft: "" },   // terminals (Terminal tab and the Workspace's bottom panel)
  ide: { side: false, agent: "", dock: false, tab: "terminal", dockH: 260 },   // Workspace: agent panel, bottom panel (terminals and run output)
  nameEdit: null,               // { mode: "new" | "rename", ... } while a file or folder name is being typed in the Workspace list
  view: { kind: "chat", agent: DIRECT },
  modelChoice: {},              // target -> model picked in the dropdown
  streams: {},                  // target -> the reply being written (kept here so it survives switching pages)
  drafts: {},                   // target -> unsent text in the message box
  errors: {},                   // target -> the last error, shown until the next message
  models: null,                 // last /api/models result
  chats: {},                    // chat id -> { id, agent, title, messages } for chats opened in this page
  current: {},                  // target -> id of the chat open for it (none means a new, empty chat)
  deletedChats: new Set(),      // ids deleted here, so a reply finishing later does not bring them back
  chatList: null,               // last /api/chats result, for Past chats
  history: { agent: "*", sort: "new", query: "" },   // Past chats filter and order
  unseen: false,                // a reply finished while the browser tab was hidden
  images: null,                 // last /api/images result: sd-cli, settings and image models
  imageForm: { model: "", prompt: "", negative_prompt: "", width: 512, height: 512, steps: 20, cfg_scale: 7, sampler: "", seed: -1,
    mode: "create", source: null, strength: 0.6, matchSource: true },   // mode "edit" changes source (a {place, path} picture)
  attachments: {},              // target -> pictures waiting to be sent: [{ place, path }], or { busy: name } while uploading
  imageJob: null,               // the picture being made (kept here so it survives switching pages)
  imagePreview: true,           // show each step while a picture is made (Images tab and agents)
  imageSelected: null,          // the picture shown large in the Images tab
  imageError: null,
  galleryPlace: "_shared",      // whose images/ folder the gallery shows
  manage: null,                 // last /api/manage result: engines, installed models, running servers, jobs
  manageError: "",              // the last error from a Models page action
  install: null,                // the install form of the Models sub-tab that is open (one of installs)
  installs: {
    chat: { engine: "", name: "", role: "checkpoint", target: "", advanced: false, choose: null, message: "", error: "", sending: false },
    image: { engine: "image", name: "", role: "checkpoint", target: "", advanced: false, choose: null, message: "", error: "", sending: false },
    ocr: { engine: "ocr", kind: "tesseract", name: "", choose: null, message: "", error: "", sending: false },
  },
  modelsTab: "chat",            // Models sub-tab: chat | image | ocr | engines
  ocr: null,                    // last /api/ocr result: Tesseract, the PyTorch environment and OCR models
  ocrForm: { model: "", source: null, languages: "", psm: 3 },
  ocrJob: null,                 // the picture being read (kept here so it survives switching pages)
  ocrResult: null,
  ocrError: null,
  art: null,                    // last /api/artcraft result: the Craft apps, Rust, and their install jobs
  artError: "",                 // the last error from an Art Craft button
  artChecked: false,            // update check done since this page opened
  artChecking: false,
};
S.install = S.installs.chat;

/* ---------------------------------------------------------------- helpers */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = !!v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid !== null && kid !== undefined && kid !== false)
    el.append(kid instanceof Node ? kid : String(kid));
  return el;
}
const $ = (id) => document.getElementById(id);
function fill(el, ...kids) { el.replaceChildren(...kids.flat(Infinity).filter((k) => k !== null && k !== undefined && k !== false)); }
function esc(s) { return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

async function api(path, options = {}) {
  const opts = { headers: { "Content-Type": "application/json" }, ...options };
  if (opts.body && typeof opts.body !== "string") opts.body = JSON.stringify(opts.body);
  let res;
  try { res = await fetch(path, opts); }
  catch { throw new Error("Axis is not responding. Open the Axis app or run axis again."); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status}).`);
  return data;
}

let toastTimer;
function toast(text) {
  const t = $("toast"); t.textContent = text; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

function store(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch { return false; } }
function recall(key, fallback) {
  try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); } catch { return fallback; }
}
/* Chats are saved by Axis in ~/Axis/chats. S.chats caches the ones opened here;
   S.current maps each agent ("" for Direct chat) to the chat open for it. */
function newChatId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 12);
}
function saveCurrent() { store("axis.current", S.current); }
const chatMessages = (id) => (id && S.chats[id] ? S.chats[id].messages.slice() : []);
const getHistory = (target) => chatMessages(S.current[target]);
const savingChats = {};    // id -> promise chain, so saves of one chat reach Axis in order
function saveChat(id, agent, msgs) {
  if (S.deletedChats.has(id)) return;
  const c = S.chats[id] || (S.chats[id] = { id, agent, title: "", messages: [] });
  c.messages = msgs.slice(); c.agent = agent;
  savingChats[id] = (savingChats[id] || Promise.resolve()).then(async () => {
    if (S.deletedChats.has(id)) return;
    if (c.messages.length) {
      await api("/api/chats/" + encodeURIComponent(id), { method: "PUT", body: { agent: c.agent, title: c.title || "", messages: c.messages } });
      c.saved = true;
    } else if (c.saved) {   // the only message was taken back: nothing left to keep
      await api("/api/chats/" + encodeURIComponent(id), { method: "DELETE" }).catch(() => {});
      c.saved = false;
    }
  }).catch((e) => toast("Could not save the chat: " + e.message));
}
function setHistory(target, msgs) {
  let id = S.current[target];
  if (!id) {
    if (!msgs.length) return;
    id = S.current[target] = newChatId(); saveCurrent();
  }
  saveChat(id, target, msgs);
}
const loadingChats = {};
function loadChat(id) {   // resolves "ok", "missing" or an error message
  if (!loadingChats[id]) {
    loadingChats[id] = api("/api/chats/" + encodeURIComponent(id))
      .then((c) => { S.chats[id] = { ...c, messages: Array.isArray(c.messages) ? c.messages : [], saved: true }; return "ok"; })
      .catch((e) => /does not exist/.test(e.message) ? "missing" : e.message)
      .finally(() => { delete loadingChats[id]; });
  }
  return loadingChats[id];
}
function openChat(agent, id) {
  if (S.current[agent] !== id) delete S.errors[agent];
  if (id) S.current[agent] = id; else delete S.current[agent];
  saveCurrent();
  go({ kind: "chat", agent });
}
// Axis 3.2 and earlier kept one chat per agent in the browser. Move them to Axis once.
async function migrateOldChats() {
  const keys = [];
  for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith("axis.chat:")) keys.push(k); }
  for (const k of keys) {
    const target = k.slice("axis.chat:".length), msgs = recall(k, []);
    if (Array.isArray(msgs) && msgs.length && (!target || agentByName(target))) {
      const id = newChatId();
      try {
        await api("/api/chats/" + id, { method: "PUT", body: { agent: target, messages: msgs } });
        if (!S.current[target]) S.current[target] = id;
      } catch (e) {
        if (/not responding/.test(e.message)) continue;   // try again next time
      }
    }
    try { localStorage.removeItem(k); } catch {}
  }
  saveCurrent();
}
function saveDrafts() { store("axis.drafts", S.drafts); }
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type: type || "text/plain;charset=utf-8" }));
  const a = h("a", { href: url, download: name }); document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
const fmt = (n) => (typeof n === "number" && isFinite(n)) ? n.toLocaleString() : "";
function bigNum(n) {
  if (typeof n !== "number" || !isFinite(n)) return "";
  if (n >= 1e9) return (n / 1e9).toFixed(n >= 1e10 ? 0 : 1) + "B";
  if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + "M";
  return fmt(n);
}
const tokens = (n) => (typeof n === "number" && n > 0) ? fmt(n) + " tokens" : "";

function copyText(text, label) {
  const done = () => toast(label || "Copied");
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  const t = h("textarea", { value: text }); document.body.append(t); t.select();
  try { document.execCommand("copy"); done(); } catch {} t.remove();
}

/* --------------------------------------------------------------- markdown */
function inline(text) {
  return text.split(/(`[^`\n]+`)/).map((part, i) => {
    if (i % 2) return "<code>" + esc(part.slice(1, -1)) + "</code>";
    return esc(part)
      .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, "$1<em>$2</em>")
      .replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  }).join("");
}
function blocks(text) {
  const out = []; let para = []; let list = null;
  const flushPara = () => { if (para.length) out.push("<p>" + para.map(inline).join("<br>") + "</p>"); para = []; };
  const flushList = () => { if (list) out.push(`<${list.tag}>` + list.items.map((i) => "<li>" + inline(i) + "</li>").join("") + `</${list.tag}>`); list = null; };
  for (const line of text.split("\n")) {
    let m;
    if (!line.trim()) { flushPara(); flushList(); }
    else if ((m = line.match(/^(#{1,6})\s+(.*)$/))) { flushPara(); flushList(); out.push((m[1].length <= 2 ? "<h3>" : "<h4>") + inline(m[2]) + (m[1].length <= 2 ? "</h3>" : "</h4>")); }
    else if ((m = line.match(/^\s*[-*+]\s+(.*)$/)) || (m = line.match(/^\s*\d+[.)]\s+(.*)$/))) {
      const tag = /^\s*\d/.test(line) ? "ol" : "ul";
      flushPara(); if (list && list.tag !== tag) flushList();

function composerHint(target, agent, model) {
  const out = [];

    : S.streams[target] ? "Another chat with this agent is still replying; you can send once it finishes."
    : "Enter to send, Shift+Enter for a new line.";
  const pics = (S.attachments[target] || []).length;
  if (pics && readsPictures(model) === false) text += ` ${model} cannot read pictures; choose a model with Vision.`;
  else if (pics && readsPictures(model) === null) text += ` ${pics} picture${pics === 1 ? "" : "s"} attached; the reply fails if ${model} cannot read pictures.`;
  if (agent) {

    text += ` ${agent.config.length} config instruction${agent.config.length === 1 ? "" : "s"} and ${on} skill${on === 1 ? "" : "s"} active.`;
    if (agent.skills.some((id) => (skillById(id) || {}).builtin)) {

    const tone = pct >= 90 ? "bad" : pct >= 70 ? "warn" : "";
    out.push(" Context", h("span", { class: "meter " + tone, title: `${fmt(used)} of ${fmt(limit)} tokens` }, h("i", { style: `width:${pct}%` })),

function streamsChanged() {

  const busy = Object.keys(S.streams).length + (S.imageJob ? 1 : 0);

// Draws a chat wherever it is on screen (its own page or the Terminal tab's agent panel). False when it is not shown.

function exportChat(target) {
  const msgs = getHistory(target);
  if (!msgs.length) return;
  const chat = S.chats[S.current[target]];
  const lines = [`# ${chat ? chatTitle(chat) : targetName(target)}`, "", `${targetName(target)}, exported from Axis on ${new Date().toLocaleString()}.`, ""];
  for (const m of msgs) {
    if (m.role === "user") {
      lines.push("## You", "");
      for (const r of m.images || []) lines.push(`[Picture: ${placeLabel(r.place || SHARED)}/${r.path}]`, "");
      lines.push(String(m.content || ""), "");
      continue;
    }
    lines.push(`## ${target || "Model"}${m.model ? ` (${m.model})` : ""}`, "");
    const parts = Array.isArray(m.parts) && m.parts.length ? m.parts : [{ type: "text", text: String(m.content || "") }];
    for (const p of parts) {
      if (p.type !== "tool") { lines.push(p.text, ""); continue; }
      lines.push(`> **${stepLabel(p)}**`);
      if (p.args && typeof p.args.code === "string") lines.push("", "```python", p.args.code, "```");
      if (p.output !== undefined) lines.push("", "```", String(p.output), "```");
      lines.push("");

async function send(target, { resend = false, terminal, workspace } = {}) {
  if (terminal === undefined) terminal = termContextFor(target);          // asked from a side panel: the agent sees the open terminal
  if (workspace === undefined) workspace = workspaceContextFor(target);   // asked from the Workspace panel: and the folder you are in
  if (S.streams[target] || !ready()) return;
  const msgs = getHistory(target);
  let text, pictures = [];
  if (resend) {
    while (msgs.length && msgs[msgs.length - 1].role === "assistant") msgs.pop();

    stream.frame = 0;

    }
    if (ev.tool) parts.push({ type: "tool", id: ev.tool.id, name: ev.tool.name, args: ev.tool.args });
    if (ev.tool_progress) {

      if (step) {
        if (ev.tool_progress.progress) step.progress = ev.tool_progress.progress;
        if (ev.tool_progress.preview) step.preview = ev.tool_progress.preview;
      }
    }
    if (ev.tool_result) {
      const step = parts.find((p) => p.type === "tool" && p.id === ev.tool_result.id && p.output === undefined);
      if (step) { step.ok = ev.tool_result.ok; step.output = ev.tool_result.output; }

      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ agent: target || null, model, messages: history, image_preview: S.imagePreview, terminal: terminal || null, workspace: workspace || null }) });

  const got = !!reply.trim() || parts.some((p) => p.type === "tool");

    saved.push({ role: "assistant", content: reply, parts: clipParts(parts), model: stream.model,
      stats: summarize(stream), stopped: aborted || undefined });
  } else if (!resend && saved.length && saved[saved.length - 1].role === "user") {
    saved.pop();                                    // nothing came back: undo the message and give the text and pictures back
    if (!(S.drafts[target] || "").trim()) { S.drafts[target] = text; saveDrafts(); }
    if (pictures.length && !(S.attachments[target] || []).length) { S.attachments[target] = pictures; saveAttachments(); }
  }
  saveChat(stream.chatId, target, saved);
  if (S.chatList) S.chatList = null;               // Past chats re-reads the list next time
  if (stream.error && S.current[target] === stream.chatId) S.errors[target] = stream.error;
  if (document.hidden) S.unseen = true;
  streamsChanged();
  if (stream.stats.length) loadModels();           // the context size may have changed (Ollama reloads at Axis's size)

  if (!redrawChat(target) && (got || stream.error)) toast(`${targetName(target)}: ${stream.error ? "the reply failed" : "reply ready"}`);
  if (S.view.kind === "history") loadChatList().then(drawChatList);
  if (stream.error) refreshStatus();
}

/* ------------------------------------------------------------ pictures
   Shared by the Images tab (picture to edit) and chats (pictures for models that read them). */
const PICTURE_RE = /\.(png|jpe?g|webp|gif|bmp)$/i;
const MODEL_READS_RE = /\.(png|jpe?g)$/i;    // what both Ollama and llama.cpp read without conversion
const MAX_PICTURE_SIDE = 2048;

// A picture as a PNG or JPEG Blob no larger than maxSide on its longest side. Files that already
// fit are returned as they are; anything else (WebP, GIF, BMP, very large photos) is redrawn.
async function normalizePicture(blob, name, maxSide = MAX_PICTURE_SIDE) {
  let bmp;
  try { bmp = await createImageBitmap(blob); }
  catch { throw new Error(`${name} is not a picture this browser can open.`); }
  const scale = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
  const isJpeg = /jpe?g$/i.test(blob.type) || /\.jpe?g$/i.test(name);
  if (scale === 1 && (isJpeg || /png$/i.test(blob.type) || /\.png$/i.test(name))) {
    bmp.close && bmp.close();
    return { blob, name: name.replace(/\.jpeg$/i, ".jpg"), width: bmp.width, height: bmp.height };
  }
  const w = Math.max(1, Math.round(bmp.width * scale)), hgt = Math.max(1, Math.round(bmp.height * scale));
  const canvas = document.createElement("canvas"); canvas.width = w; canvas.height = hgt;
  canvas.getContext("2d").drawImage(bmp, 0, 0, w, hgt);
  bmp.close && bmp.close();
  const type = isJpeg ? "image/jpeg" : "image/png";
  const out = await new Promise((resolve) => canvas.toBlob(resolve, type, 0.92));
  if (!out) throw new Error(`Could not convert ${name}.`);
  const stem = name.replace(/\.[^.]+$/, "") || "picture";
  return { blob: out, name: stem + (isJpeg ? ".jpg" : ".png"), width: w, height: hgt };
}

// Saves a Blob into dir of a folder (made when missing). Returns its path there; names never clash.
async function uploadPicture(placeName, dir, name, blob) {
  const res = await fetch(filesUrl(placeName, "upload", dir, "&mkdirs=1&name=" + encodeURIComponent(name)),
    { method: "POST", headers: { "Content-Type": "application/octet-stream" }, body: blob });
  const d = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(d.error || `Upload failed (${res.status}).`);
  return d.path;
}

// A picture from the computer, converted where needed and saved in dir. Returns { place, path }.
async function savePicture(file, placeName, dir, maxSide = MAX_PICTURE_SIDE) {
  if (!file.type.startsWith("image/") && !PICTURE_RE.test(file.name)) throw new Error(`${file.name} is not a picture.`);
  const pic = await normalizePicture(file, file.name || "picture.png", maxSide);
  return { place: placeName, path: await uploadPicture(placeName, dir, pic.name, pic.blob) };
}

// A picture already in Axis's folders, made readable by chat models (PNG or JPEG) by saving a converted copy.
async function readablePicture(ref, placeName, dir) {
  if (MODEL_READS_RE.test(ref.path)) return ref;
  const res = await fetch(filesUrl(ref.place, "raw", ref.path));
  if (!res.ok) throw new Error(`Could not open ${ref.path}.`);
  const name = ref.path.split("/").pop();
  const pic = await normalizePicture(await res.blob(), name);
  return { place: placeName, path: await uploadPicture(placeName, dir, pic.name, pic.blob) };
}

function parseCsv(text, limit) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length && rows.length < limit; i++) {
    const c = text[i];
    if (q) { if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (c === '"') q = false; else cell += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n") { row.push(cell.replace(/\r$/, "")); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if ((cell || row.length) && rows.length < limit) { row.push(cell); rows.push(row); }
  return rows;
}

const MAX_UPLOAD = 512 * 1024 * 1024;
async function uploadFiles(fileList, dir = S.workspace.dir) {
  const { agent } = S.workspace;
  const files = [...(fileList || [])];
  if (!files.length || !agent) return;
  let done = 0;
  for (const file of files) {
    if (file.size > MAX_UPLOAD) { toast(`${file.name} is larger than 512 MB.`); continue; }
    toast(`Uploading ${file.name}\u2026`);
    try {
      const res = await fetch(filesUrl(agent, "upload", dir, "&name=" + encodeURIComponent(file.name)),
        { method: "POST", headers: { "Content-Type": "application/octet-stream" }, body: file });
      const d = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(d.error || `Upload failed (${res.status}).`);
      done++;
    } catch (e) { toast(e.name === "TypeError" ? `Could not upload ${file.name} (folders cannot be uploaded).` : e.message); }
  }
  if (done) toast(`Uploaded ${done} file${done === 1 ? "" : "s"} to ${dir ? dir : agent === SHARED ? "the shared folder" : agent}`);
  if (S.view.kind === "workspace" && S.workspace.agent === agent) loadListing(true);
}

/* Drag and drop inside the Workspace: hold a file or folder and drop it on a folder, on "Up one folder",
   or on a part of the folder path above the list to move it there. Files dragged in from the computer
   and dropped on a folder are uploaded into that folder. Moves stay inside the same agent's folder. */
const DRAG_TYPE = "application/x-axis-path";
const parentDir = (p) => p.split("/").slice(0, -1).join("/");
function canDropInto(dir) {
  const d = S.wsDrag;
  if (!d || d.agent !== S.workspace.agent) return false;

const PYTHON_FILE_RE = /\.pyw?$/i;

    d.kind === "text" ? h("button", { class: "btn small", onclick: () => copyText(d.text, "Text copied") }, "Copy text") : null,

/* -------------------------------------------------------------- terminal
   Shells run by Axis (bash, sh, cmd, or PowerShell) through pipes: commands and line-based programs work,
   full-screen programs do not. You type straight into the output, like in an ordinary terminal: the
   page keeps the line being typed and sends it when you press Enter. The same terminal is shown in the
   Terminal tab and in the Workspace's bottom panel. An agent panel lets a chosen agent see the newest output. */
const ANSI_RE = /\x1b\[[0-?]*[ -\/]*[@-~]|\x1b\][^\x07\x1b]*(?:\x07|\x1b\\)|\x1b[@-Z\\-_]/g;
const TERM_KEEP = 300000;    // characters of output kept in the page per terminal
function termClean(text) {
  let out = text.replace(ANSI_RE, "").replace(/\r\n/g, "\n").replace(/\x07/g, "");
  out = out.split("\n").map((line) => line.includes("\r") ? (line.split("\r").filter(Boolean).pop() || "") : line).join("\n");
  while (/[^\n\x08]\x08/.test(out)) out = out.replace(/[^\n\x08]\x08/g, "");
  return out.replace(/\x08/g, "");
}
async function loadTerminals() {
  try { S.term.sessions = await api("/api/terminal"); S.term.loaded = true; }
  catch { return; }
  if (!S.term.sessions.some((t) => t.id === S.term.active)) S.term.active = (S.term.sessions[S.term.sessions.length - 1] || {}).id || "";
}
// Opens a terminal in a folder: in the Workspace's bottom panel when called from there, otherwise in the Terminal tab.
async function openTerminal(placeName, dir) {
  const inDock = S.view.kind === "workspace";
  if (!inDock && !leaveEdit()) return;
  let t;
  try { t = await api("/api/terminal", { method: "POST", body: { place: placeName || SHARED, path: dir || "" } }); }
  catch (e) { toast(e.message); return; }
  S.term.sessions = S.term.sessions.filter((x) => x.id !== t.id).concat([t]);
  S.term.active = t.id;
  if (inDock) {

    renderNav(); syncIdeButtons(); drawDock(); updateIdeHint(); focusTerm();
  } else if (S.view.kind === "terminal") renderTerminal(); else go({ kind: "terminal" });
}
async function closeTerminal(id) {

  try { await api("/api/terminal/" + encodeURIComponent(id), { method: "DELETE" }); }
  catch (e) { if (!/does not exist/.test(e.message)) { toast(e.message); return; } }
  S.term.sessions = S.term.sessions.filter((x) => x.id !== id);

  if (S.term.active === id) S.term.active = (S.term.sessions[S.term.sessions.length - 1] || {}).id || "";
  renderNav(); redrawTerm();
}
// Draws the terminals again wherever they are on screen.
function redrawTerm() {

}
const activeTerm = () => S.term.sessions.find((t) => t.id === S.term.active) || null;
// What the page knows about one terminal: the output so far, and the line being typed (with the place of the cursor in it).
// `pending` holds lines that were sent and are shown until the shell's own copy of them arrives.
function termBuf(id) { return S.term.buf[id] || (S.term.buf[id] = { raw: "", next: 0, line: "", pos: 0, pending: [] }); }
const focusTerm = () => { const c = $("term-cap"); if (c) c.focus({ preventScroll: true }); };

function renderTerminal() {
  const T = S.term;
  if (!T.loaded) {
    fill($("main"), h("div", { class: "bar" }, menuButton(), h("h2", {}, "Terminal")), h("div", { class: "editor" }, h("p", { class: "hint" }, "Loading\u2026")));

    t ? h("button", { class: "btn small", title: "Clear the output shown here (Ctrl+L)", onclick: termClear }, "Clear") : null,

      h("button", { class: "label", role: "tab", "aria-selected": x.id === T.active ? "true" : "false", title: x.cwd,

/* The text area of a terminal. The output is one piece of text; the line being typed follows it directly, with a
   cursor. A hidden text box has the keyboard focus, so typing, pasting and input methods work as in any page. */
function terminalSurface(t) {
  const out = h("pre", { class: "term-out", id: "term-out", role: "log", "aria-label": `Output of the terminal in ${t.title}` });
  const surface = h("div", { class: "term-surface" }, out);
  if (t.alive) surface.append(h("textarea", { class: "term-cap", id: "term-cap", rows: 1, autocomplete: "off", autocapitalize: "off", spellcheck: "false",
    "aria-label": `Type commands for the terminal in ${t.title}. Enter runs the line.`, onkeydown: termKeydown, oninput: termInput, oncompositionend: termInput }));
  surface.addEventListener("mouseup", () => { if (!String(window.getSelection() || "")) focusTerm(); });   // selecting text must not be interrupted
  return surface;
}

let termTimer = null, termBusy = false;
function termPoll() {
  clearInterval(termTimer);
  termTimer = setInterval(async () => {
    if (!$("term-out")) { clearInterval(termTimer); return; }       // no terminal on screen
    if (termBusy || !S.term.active || document.hidden) return;
    termBusy = true;
    try { await termFetch(S.term.active); } finally { termBusy = false; }
  }, 350);
}
// One request at a time per terminal, so output is never added twice.
function termFetch(id) {
  const b = termBuf(id);
  if (b.fetching) { b.again = true; return b.fetching; }
  b.fetching = (async () => {
    try { do { b.again = false; await termFetchOnce(id); } while (b.again); }
    finally { b.fetching = null; }
  })();
  return b.fetching;
}
async function termFetchOnce(id) {
  const b = termBuf(id);
  let d;
  try { d = await api(`/api/terminal/${encodeURIComponent(id)}?since=${b.next}`); }
  catch (e) {
    if (/does not exist/.test(e.message)) {   // Axis was restarted: its terminals are gone
      S.term.sessions = S.term.sessions.filter((x) => x.id !== id); delete S.term.buf[id];
      if (S.term.active === id) S.term.active = (S.term.sessions[S.term.sessions.length - 1] || {}).id || "";
      redrawTerm();
    }
    return;
  }
  if (d.text) b.raw = (b.raw + d.text).slice(-TERM_KEEP);
  b.next = d.next;
  const t = S.term.sessions.find((x) => x.id === id);
  const ended = t && t.alive && !d.alive;
  if (t) { t.alive = d.alive; t.exit = d.exit; }
  if (!$("term-out") || S.term.active !== id) return;
  if (ended) redrawTerm();
  else if (d.text) drawTermOut(false);
}

// What follows the output: lines already sent but not yet echoed back, then the line being typed with its cursor.
function typedNodes(b) {
  const nodes = [];
  if (b.pending.length) nodes.push(h("span", { class: "term-typed" }, b.pending.join("\n") + "\n"));
  nodes.push(h("span", { class: "term-typed" }, b.line.slice(0, b.pos), h("span", { class: "term-caret" }, b.line.charAt(b.pos) || " "), b.line.slice(b.pos + 1)));
  return nodes;
}
function drawTermOut(force) {
  const out = $("term-out"), t = activeTerm();
  if (!out) return;
  const b = t ? termBuf(t.id) : null;
  const stick = force || out.scrollHeight - out.scrollTop - out.clientHeight < 40;
  const raw = b ? b.raw : "";
  if (out._raw !== raw || !out.firstChild) { out.replaceChildren(document.createTextNode(termClean(raw))); out._raw = raw; }   // the output changed
  while (out.childNodes.length > 1) out.lastChild.remove();                                                                       // the typed part is always redrawn
  if (b && t.alive) out.append(...typedNodes(b));
  if (stick) out.scrollTop = out.scrollHeight;
}

// Sends text to a terminal, one request after another, then reads what came back.
function termSend(text, id = S.term.active) {
  if (!id) return Promise.resolve(false);
  const b = termBuf(id);
  const run = async () => {
    try { await api(`/api/terminal/${encodeURIComponent(id)}/input`, { method: "POST", body: { text } }); }
    catch (e) { toast(e.message); return false; }
    await termFetch(id);
    return true;
  };
  b.chain = (b.chain || Promise.resolve()).then(run, run);
  return b.chain;
}
async function termSubmit() {
  const T = S.term, id = T.active;
  if (!id) return;
  const b = termBuf(id), text = b.line;
  if (text.trim() && T.history[T.history.length - 1] !== text) { T.history.push(text); if (T.history.length > 200) T.history.shift(); }
  T.hpos = -1; T.draft = "";
  b.line = ""; b.pos = 0; b.pending.push(text);
  drawTermOut(true);
  const ok = await termSend(text + "\n", id);
  b.pending.shift();
  if (!ok) { b.line = text + b.line; b.pos = b.line.length; }      // not sent: give the line back
  if (S.term.active === id) drawTermOut(true);
}
async function termInterrupt() {
  const id = S.term.active;
  if (!id) return;
  try { await api(`/api/terminal/${encodeURIComponent(id)}/interrupt`, { method: "POST" }); }
  catch (e) { toast(e.message); }
  setTimeout(() => termFetch(id), 100);
}
function termClear() {
  const b = S.term.buf[S.term.active];
  if (b) b.raw = "";
  drawTermOut(true);
  focusTerm();
}

const wordStart = (s, i) => { while (i > 0 && /\s/.test(s[i - 1])) i--; while (i > 0 && !/\s/.test(s[i - 1])) i--; return i; };
const wordEnd = (s, i) => { while (i < s.length && /\s/.test(s[i])) i++; while (i < s.length && !/\s/.test(s[i])) i++; return i; };
function termHistory(b, dir) {
  const T = S.term;
  if (dir < 0) {
    if (!T.history.length) return;
    if (T.hpos < 0) { T.draft = b.line; T.hpos = T.history.length - 1; } else T.hpos = Math.max(0, T.hpos - 1);
    b.line = T.history[T.hpos];
  } else {
    if (T.hpos < 0) return;
    T.hpos++;
    if (T.hpos >= T.history.length) { T.hpos = -1; b.line = T.draft || ""; } else b.line = T.history[T.hpos];

}
// Keys that edit the line or act on the terminal. Anything else is typed into the hidden text box and arrives in termInput.
function termKeydown(e) {

  const ctrl = e.ctrlKey && !e.altKey && !e.metaKey, lower = key.length === 1 ? key.toLowerCase() : "";
  const edit = (fn) => { e.preventDefault(); fn(); drawTermOut(true); };
  const cut = (from) => { b.line = b.line.slice(0, from) + b.line.slice(b.pos); b.pos = from; };
  if (key === "Enter") { e.preventDefault(); termSubmit(); return; }

  if (key === "Delete") return edit(() => { if (b.pos < b.line.length) b.line = b.line.slice(0, b.pos) + b.line.slice(b.pos + 1); });
  if (key === "ArrowLeft") return edit(() => { b.pos = ctrl ? wordStart(b.line, b.pos) : Math.max(0, b.pos - 1); });
  if (key === "ArrowRight") return edit(() => { b.pos = ctrl ? wordEnd(b.line, b.pos) : Math.min(b.line.length, b.pos + 1); });
  if (key === "Home" || (ctrl && lower === "a")) return edit(() => { b.pos = 0; });
  if (key === "End" || (ctrl && lower === "e")) return edit(() => { b.pos = b.line.length; });
  if (key === "ArrowUp" || key === "ArrowDown") return edit(() => termHistory(b, key === "ArrowUp" ? -1 : 1));
  if (key === "PageUp" || key === "PageDown") {
    e.preventDefault();
    const out = $("term-out"); if (out) out.scrollTop += (key === "PageUp" ? -1 : 1) * out.clientHeight * 0.9;
    return;

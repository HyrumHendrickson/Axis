<style>
:root {
  /* from the Axis logo: tan #D4A574, ink #151515, off-white #EBEAE7 */
  --bg: #ebeae7; --surface: #f7f6f3; --ink: #151515; --muted: #5c5249; --line: #d3cfc8; --code: #efede9;
  --panel: #d4a574; --panel-ink: #151515; --panel-muted: #3e2f20; --panel-hover: rgba(255,255,255,.28);
  --panel-active: rgba(255,255,255,.55); --panel-line: rgba(21,21,21,.16);
  --accent: #151515; --accent-ink: #ebeae7; --accent-soft: #f0dfc9; --link: #875420; --tan: #d4a574;
  --ok: #1c5e34; --bad: #8e1b12; --warn: #6b3300;
  --serif: "Palatino Linotype", "Book Antiqua", Palatino, "URW Palladio L", Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151515; --surface: #221e1b; --ink: #ebeae7; --muted: #a89d90; --line: #3a332c; --code: #1a1714;
    --panel: #1c1814; --panel-ink: #ebeae7; --panel-muted: #a89d90; --panel-hover: rgba(212,165,116,.10);
    --panel-active: rgba(212,165,116,.20); --panel-line: #2e2822;
    --accent: #d4a574; --accent-ink: #151515; --accent-soft: #3a2c1e; --link: #d4a574;
    --ok: #5bc48a; --bad: #f07a68; --warn: #e8a34a;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { display: grid; grid-template-columns: 272px 1fr; height: 100%; }

/* ---------- sidebar ---------- */
.side { background: var(--panel); color: var(--panel-ink); border-right: 1px solid var(--panel-line); display: flex; flex-direction: column; min-height: 0; }
.brand { padding: 20px 20px 0; }
.brand-row { display: flex; align-items: center; gap: 12px; }
.brand img { width: 44px; height: 44px; border-radius: 10px; box-shadow: 0 0 0 1px var(--panel-line); }
.brand h1 { font: 400 32px/1 var(--serif); letter-spacing: .02em; margin: 0; }
.axisline { height: 3px; margin: 16px 0 0; border-radius: 2px; background: var(--panel-muted); transition: background .4s; }
.axisline.ok { background: var(--ok); } .axisline.bad { background: var(--bad); } .axisline.warn { background: var(--warn); }
/* update badge (top of the sidebar) */
.brand { position: relative; }
.upd { margin-left: auto; border: 0; border-radius: 10px; padding: 4px 9px; font: 600 11px/1.2 var(--sans); white-space: nowrap; background: var(--panel-line); color: var(--panel-ink); }
.upd.ok { background: var(--ok); color: var(--accent-ink); }
.upd.warn { background: var(--warn); color: var(--accent-ink); cursor: pointer; }
.upd.bad { background: var(--bad); color: var(--accent-ink); cursor: pointer; }
.upd.busy { cursor: pointer; }
button.upd:hover { filter: brightness(1.12); }
.upd-pop { position: absolute; top: 70px; left: 12px; right: 12px; z-index: 50; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.18); font-size: 13px; }
.upd-pop h3 { margin: 0 0 6px; font-size: 14px; }
.upd-pop p { margin: 0 0 10px; }
.upd-pop .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.upd-pop code { font: 12px var(--mono); overflow-wrap: anywhere; }
.upd-pop pre { max-height: 140px; overflow: auto; background: var(--code); padding: 8px; border-radius: 6px; font: 11px/1.4 var(--mono); white-space: pre-wrap; margin: 0 0 10px; }
.status { padding: 14px 20px 18px; border-bottom: 1px solid var(--panel-line); }
.status-title { font-weight: 600; display: flex; align-items: center; gap: 8px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--panel-muted); flex: none; }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); }
.status-detail { color: var(--panel-muted); font-size: 13px; margin-top: 4px; overflow-wrap: anywhere; }
.status-models { list-style: none; padding: 0; margin: 6px 0 0; font: 13px/1.6 var(--mono); }
.nav { flex: 1; overflow-y: auto; padding: 12px 10px 20px; }
.side :focus-visible { outline-color: var(--panel-ink); }
.nav h2 { font: 600 13px/1 var(--sans); color: var(--panel-muted); margin: 18px 10px 8px; display: flex; justify-content: space-between; align-items: center; }
.nav-item { display: block; width: 100%; text-align: left; border: 0; background: none; color: var(--panel-ink); padding: 8px 10px; border-radius: 6px; cursor: pointer; }
.nav-item:hover { background: var(--panel-hover); }
.nav-item[aria-current="true"] { background: var(--panel-active); box-shadow: inset 3px 0 0 var(--panel-ink); }
.nav-item small { display: block; color: var(--panel-muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-empty { color: var(--panel-muted); font-size: 13px; padding: 4px 10px; }

/* ---------- buttons ---------- */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 14px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
a.btn { display: inline-block; text-decoration: none; color: var(--ink); line-height: 1.5; }
.side .link { color: var(--panel-ink); text-decoration: underline; text-underline-offset: 3px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.danger { color: var(--bad); }
.btn.small { padding: 3px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.link { border: 0; background: none; color: var(--link); cursor: pointer; padding: 0; font-size: 13px; font-weight: 600; }

/* ---------- main ---------- */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.bar { display: flex; align-items: center; gap: 12px; padding: 12px 24px; border-bottom: 1px solid var(--line); background: var(--surface); flex-wrap: wrap; }
.bar h2 { font: 400 22px/1.2 var(--serif); margin: 0; flex: 1; min-width: 120px; overflow-wrap: anywhere; }
.bar label { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; }
select { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 8px; max-width: 240px; }
.menu-btn { display: none; }
.note { padding: 8px 24px; font-size: 13px; color: var(--warn); background: var(--surface); border-bottom: 1px solid var(--line); }

.thread { flex: 1; overflow-y: auto; padding: 24px; }
.thread-inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.msg { max-width: 100%; }
.msg.user { align-self: flex-end; background: var(--accent-soft); padding: 10px 14px; border-radius: 12px 12px 2px 12px; white-space: pre-wrap; overflow-wrap: anywhere; max-width: 85%; }
.msg.ai { overflow-wrap: anywhere; }
.msg.ai > :first-child { margin-top: 0; } .msg.ai > :last-child { margin-bottom: 0; }
.msg.ai pre { background: var(--code); border: 1px solid var(--line); border-radius: 6px; padding: 12px; overflow-x: auto; font: 13px/1.5 var(--mono); }
.msg.ai code { font-family: var(--mono); font-size: .9em; background: var(--code); padding: 1px 4px; border-radius: 4px; }
.msg.ai pre code { background: none; padding: 0; font-size: inherit; }
.msg.ai h3, .msg.ai h4 { font-family: var(--serif); font-weight: 600; margin: 1em 0 .4em; }
.msg-tools { margin-top: 6px; display: flex; gap: 12px; }
.msg.error { color: var(--bad); border-left: 3px solid var(--bad); padding: 4px 12px; white-space: pre-wrap; }
.typing { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; padding: 4px 0; }
.typing-label { animation: pulse 1.6s ease-in-out infinite; }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--tan); animation: bounce 1.2s infinite ease-in-out; }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
.elapsed { font: 12px/1 var(--mono); color: var(--muted); }
@keyframes pulse { 50% { opacity: .45; } }
@keyframes bounce { 0%, 80%, 100% { transform: scale(.55); opacity: .5; } 40% { transform: scale(1); opacity: 1; } }
@keyframes spin { to { transform: rotate(360deg); } }
.msg.ai pre { position: relative; }
.code-copy { position: absolute; top: 6px; right: 6px; font: 600 11px/1 var(--sans); padding: 4px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--muted); cursor: pointer; opacity: 0; transition: opacity .15s; }
.msg.ai pre:hover .code-copy, .code-copy:focus-visible { opacity: 1; }
.msg-tools { align-items: baseline; flex-wrap: wrap; }
.msg-stats { color: var(--muted); font-size: 12px; }
.msg-note { color: var(--muted); font-size: 12px; font-style: italic; }
.nav-item.busy small { color: var(--panel-ink); }
.busy-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--panel-ink); margin-right: 6px; animation: pulse 1.2s infinite; vertical-align: middle; }
.meter { display: inline-block; width: 70px; height: 6px; border-radius: 3px; background: var(--line); vertical-align: middle; margin: 0 6px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ok); }
.meter.warn i { background: var(--warn); } .meter.bad i { background: var(--bad); }
.empty { color: var(--muted); text-align: center; margin: 12vh auto 0; max-width: 460px; }
.empty h3 { font: 400 24px/1.3 var(--serif); color: var(--ink); margin: 0 0 8px; }

.composer { border-top: 1px solid var(--line); background: var(--surface); padding: 14px 24px 18px; }
.composer-inner { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
.composer textarea { flex: 1; resize: none; min-height: 44px; max-height: 220px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--surface); }
.composer-hint { max-width: 760px; margin: 6px auto 0; font-size: 12px; color: var(--muted); }

/* ---------- gate ---------- */
.gate { max-width: 620px; margin: 8vh auto 0; }
.gate h3 { font: 400 26px/1.3 var(--serif); margin: 0 0 6px; }
.gate p { color: var(--muted); margin: 0 0 18px; }
.gate h4 { margin: 20px 0 6px; font-size: 15px; }
.gate ol { margin: 0; padding-left: 20px; }
.gate li { margin: 4px 0; }
.cmd { display: flex; align-items: center; gap: 8px; background: var(--code); border: 1px solid var(--line); border-radius: 6px; padding: 6px 6px 6px 12px; margin: 6px 0; }
.cmd code { flex: 1; font: 13px/1.5 var(--mono); overflow-x: auto; white-space: nowrap; }

/* ---------- editor ---------- */
.editor { flex: 1; overflow-y: auto; padding: 24px; }
.form { max-width: 720px; margin: 0 auto; }
.field { margin-bottom: 22px; }
.field > label, .section-head h3 { display: block; font-weight: 600; margin-bottom: 4px; }
.hint { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
.form input[type=text], .form textarea { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--surface); }
.form textarea { resize: vertical; min-height: 90px; }
.section { border-top: 1px solid var(--line); padding-top: 18px; margin-top: 8px; margin-bottom: 22px; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.section-head h3 { font: 400 20px/1.3 var(--serif); margin: 0; }
.row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
.row input { flex: 1; }
.skill { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 10px; background: var(--surface); }
.skill.off { opacity: .65; }
.skill .row { margin-bottom: 8px; }
.switch { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; cursor: pointer; }
.switch input { width: 16px; height: 16px; accent-color: var(--accent); }
.form-actions { display: flex; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 18px; }
.form-actions .spacer { flex: 1; }
.form-error { color: var(--bad); margin: 0 0 12px; }

/* ---------- tool steps ---------- */
.step { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); margin: 10px 0; font-size: 14px; }
.step > summary { cursor: pointer; padding: 7px 12px; display: flex; gap: 8px; align-items: center; list-style: none; }
.step > summary::-webkit-details-marker { display: none; }
.step > summary::before { content: "\25B8"; color: var(--muted); font-size: 11px; transition: transform .15s; }
.step[open] > summary::before { transform: rotate(90deg); }
.step.running > summary { color: var(--muted); }
.step.running > summary::after { content: ""; width: 11px; height: 11px; border: 2px solid var(--muted); border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
.step.failed > summary { color: var(--bad); }
.step-body { padding: 0 12px 10px; }
.step-body pre { margin: 6px 0 0; background: var(--code); border: 1px solid var(--line); border-radius: 6px; padding: 10px; overflow-x: auto; font: 12.5px/1.45 var(--mono); max-height: 320px; overflow-y: auto; white-space: pre-wrap; }
.step-label { color: var(--muted); font-size: 12px; margin-top: 8px; }

/* ---------- skills ---------- */
.skill-group { margin-bottom: 28px; }
.skill-group > h3 { font: 400 20px/1.3 var(--serif); margin: 0 0 4px; }
.skill-card { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-top: 10px; background: var(--surface); }
.skill-card h4 { margin: 0; font-size: 15px; display: flex; gap: 10px; align-items: baseline; justify-content: space-between; }
.skill-card p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.skill-card .instr { white-space: pre-wrap; color: var(--ink); font-size: 13px; margin-top: 8px; border-left: 3px solid var(--line); padding-left: 10px; }
.tag { font: 600 12px/1 var(--sans); color: var(--link); }
.pick { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; background: var(--surface); cursor: pointer; }
.pick input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--accent); flex: none; }
.pick span { display: block; color: var(--muted); font-size: 13px; }
.subhead { font-weight: 600; font-size: 14px; margin: 14px 0 8px; }
.files { list-style: none; padding: 0; margin: 8px 0 0; font: 13px/1.7 var(--mono); max-height: 260px; overflow-y: auto; }
.files li { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); }
.files small { color: var(--muted); font-family: var(--sans); }
.path { font: 13px/1.5 var(--mono); overflow-wrap: anywhere; color: var(--muted); }

/* ---------- files ---------- */
.fb { display: grid; grid-template-columns: minmax(240px, 360px) 1fr; flex: 1; min-height: 0; }
.fb-list { overflow-y: auto; border-right: 1px solid var(--line); background: var(--surface); }
.fb-row { display: grid; grid-template-columns: 20px 1fr auto; gap: 10px; align-items: center; width: 100%; text-align: left;
  border: 0; border-bottom: 1px solid var(--line); background: none; padding: 9px 16px; cursor: pointer; }
.fb-row:hover { background: var(--accent-soft); }
.fb-row[aria-current="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--ink); }
.fb-row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fb-row small { color: var(--muted); font-size: 12px; white-space: nowrap; }
.fb-ico { width: 18px; height: 18px; color: var(--muted); }
.fb-ico.dir { color: var(--link); }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 8px 24px; border-bottom: 1px solid var(--line); background: var(--surface); font-size: 14px; }
.crumbs button { border: 0; background: none; color: var(--link); cursor: pointer; padding: 2px 4px; border-radius: 4px; font-weight: 600; }
.crumbs button:hover { background: var(--accent-soft); }
.crumbs span { color: var(--muted); }
.fb-view { overflow: auto; padding: 20px 24px; min-width: 0; }
.fb-view h3 { font: 400 22px/1.3 var(--serif); margin: 0; overflow-wrap: anywhere; }
.fb-meta { color: var(--muted); font-size: 13px; margin: 2px 0 12px; }
.fb-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.fb-view pre { background: var(--code); border: 1px solid var(--line); border-radius: 6px; padding: 12px; overflow: auto; font: 13px/1.5 var(--mono); margin: 0; white-space: pre; tab-size: 4; }
.fb-view img { max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 6px; background: repeating-conic-gradient(var(--code) 0 25%, var(--surface) 0 50%) 0 0 / 16px 16px; }
.fb-view iframe { width: 100%; height: 70vh; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
.fb-md { max-width: 760px; } .fb-md pre { white-space: pre-wrap; }
.fb-md code { font-family: var(--mono); background: var(--code); padding: 1px 4px; border-radius: 4px; }
.fb-table { overflow-x: auto; } .fb-table table { border-collapse: collapse; font-size: 13px; }
.fb-table th, .fb-table td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; white-space: nowrap; }
.fb-table th { background: var(--code); }
.fb-empty { color: var(--muted); padding: 24px 16px; }
@media (max-width: 760px) { .fb { grid-template-columns: 1fr; grid-template-rows: minmax(160px, 40%) 1fr; } .fb-list { border-right: 0; border-bottom: 1px solid var(--line); } .crumbs, .fb-view { padding-left: 14px; padding-right: 14px; } }

/* ---------- past chats ---------- */
.chat-sub { display: block; font: 13px/1.3 var(--sans); color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60ch; }
.chat-search { border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; background: var(--surface); min-width: 160px; }
.chat-group { font: 400 18px/1.3 var(--serif); margin: 22px 0 4px; }
.chat-row { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); margin-top: 8px; }
.chat-row:hover { border-color: var(--accent); }
.chat-open { flex: 1; min-width: 0; text-align: left; border: 0; background: none; padding: 10px 14px; cursor: pointer; }
.chat-open:disabled { cursor: not-allowed; opacity: .6; }
.chat-title { display: flex; gap: 8px; align-items: center; font-weight: 600; overflow-wrap: anywhere; }
.chat-open small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.chat-actions { display: flex; gap: 14px; padding-right: 14px; flex: none; }

/* ---------- models ---------- */
.model-card { border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-top: 12px; background: var(--surface); }
.model-card h4 { margin: 0; font: 600 16px/1.3 var(--mono); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; overflow-wrap: anywhere; }
.kv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px 20px; margin: 12px 0 0; }
.kv dt { font-size: 12px; color: var(--muted); }
.kv dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.kv dd small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font: 600 11px/1 var(--sans); padding: 4px 8px; border-radius: 10px; background: var(--accent-soft); color: var(--ink); }
.chip.on { background: var(--ok); color: var(--surface); }
.model-note { font-size: 13px; color: var(--warn); margin: 10px 0 0; }
.model-card details { margin-top: 10px; font-size: 13px; }
.model-card details pre { background: var(--code); border: 1px solid var(--line); border-radius: 6px; padding: 8px; font: 12px/1.45 var(--mono); white-space: pre-wrap; margin: 6px 0 0; }
.model-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.model-actions .cmd { flex: 1; min-width: 240px; margin: 0; }
.summary-line { color: var(--muted); font-size: 14px; margin: 0 0 6px; }
.fb-list.drop { outline: 2px dashed var(--accent); outline-offset: -6px; }
.install { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 16px 16px 14px; margin-bottom: 28px; }
.install .section-head { margin-bottom: 10px; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin-bottom: 10px; }
.seg button { border: 0; border-left: 1px solid var(--line); background: none; padding: 6px 12px; cursor: pointer; font-size: 13px; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.install-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.form .install-row input[type=text] { flex: 1; width: auto; min-width: 200px; font: 14px/1.6 var(--mono); padding: 8px 10px 9px; height: auto; overflow: visible; }
.install select, .model-card select { border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; background: var(--surface); max-width: 100%; }
.model-card input[type=number] { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--surface); width: 12em; }
.catalog { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; }
.catalog button { border: 1px solid var(--line); border-radius: 999px; background: var(--surface); padding: 3px 10px; cursor: pointer; font: 13px/1.5 var(--mono); }
.catalog button:hover, .catalog button[aria-pressed="true"] { border-color: var(--accent); }
.catalog small { color: var(--muted); font-family: var(--sans, inherit); margin-left: 6px; }
.choose-list { list-style: none; padding: 0; margin: 8px 0 0; max-height: 300px; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; }
.choose-list li { display: flex; gap: 12px; align-items: center; padding: 6px 8px 6px 12px; border-top: 1px solid var(--line); }
.choose-list li:first-child { border-top: 0; }
.choose-name { flex: 1; font: 13px/1.4 var(--mono); overflow-wrap: anywhere; }
.choose-size { color: var(--muted); font-size: 13px; white-space: nowrap; }
.job { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-top: 8px; background: var(--surface); }
.job-head { display: flex; gap: 10px; align-items: center; }
.job-head strong, .job-head .job-meta { flex: 1; overflow-wrap: anywhere; }
.job .ig-progress, .job-inline .ig-progress { margin: 8px 0 6px; }
.job-inline { flex: 1; min-width: 240px; }
.job-meta { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.job.failed { border-color: var(--bad); }
.job.failed .job-meta { color: var(--bad); white-space: pre-wrap; }
.engine-line { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 14px; margin: 6px 0; }
.engine-line .dot { background: var(--line); }
.engine-line > span:not(.dot) { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.engine-line .dot.ok { background: var(--ok); } .engine-line .dot.warn { background: var(--warn); }
.confirm { flex: 1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 12px; border: 1px solid var(--bad); border-radius: 6px; }
.confirm p { flex-basis: 100%; margin: 0 0 4px; font-size: 14px; }
.model-card pre.log { background: var(--code); border: 1px solid var(--line); border-radius: 6px; padding: 8px; font: 12px/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 220px; overflow-y: auto; margin: 6px 0 0; }

/* ---------- images ---------- */
.ig { display: grid; grid-template-columns: minmax(280px, 360px) 1fr; flex: 1; min-height: 0; }
.ig-form { overflow-y: auto; border-right: 1px solid var(--line); background: var(--surface); padding: 18px 18px 24px; }
.ig-form .field { margin-bottom: 14px; }
.ig-form label.lbl { display: block; font-weight: 600; font-size: 13px; margin-bottom: 4px; }
.ig-form textarea, .ig-form input[type=text], .ig-form input[type=number], .ig-form select { width: 100%; max-width: none; border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; background: var(--surface); }
.ig-form textarea { resize: vertical; min-height: 96px; }
.ig-pair { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; align-items: center; }
.ig-pair span { color: var(--muted); font-size: 13px; }
.ig-two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ig-seed { display: flex; gap: 6px; } .ig-seed input { flex: 1; }
.ig-go { display: flex; gap: 8px; margin-top: 6px; } .ig-go .btn { flex: 1; }
.ig-main { overflow-y: auto; padding: 20px 24px; min-width: 0; }
.ig-stage { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 14px; margin-bottom: 22px; }
.ig-stage img { display: block; max-width: 100%; max-height: 62vh; margin: 0 auto; border-radius: 6px; background: repeating-conic-gradient(var(--code) 0 25%, var(--surface) 0 50%) 0 0 / 16px 16px; }
.ig-meta { color: var(--muted); font-size: 13px; margin: 10px 0 0; overflow-wrap: anywhere; }
.ig-prompt { margin: 8px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.ig-progress { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin: 10px 0 6px; }
.ig-progress i { display: block; height: 100%; width: 0; background: var(--tan); transition: width .3s; }
.ig-progress.indef i { width: 30%; animation: slide 1.4s ease-in-out infinite; }
@keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(340%); } }
.ig-log { font: 12px/1.4 var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ig-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 0 8px; }
.ig-head h3 { font: 400 20px/1.3 var(--serif); margin: 0; flex: 1; }
.ig-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.ig-thumb { border: 1px solid var(--line); border-radius: 8px; padding: 0; background: var(--surface); cursor: pointer; overflow: hidden; aspect-ratio: 1; }
.ig-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ig-thumb[aria-current="true"] { outline: 3px solid var(--accent); outline-offset: -3px; }
.chat-image { margin: 6px 0 10px; }
.chat-image img { display: block; max-width: min(100%, 512px); border: 1px solid var(--line); border-radius: 8px; cursor: zoom-in; }
.chat-image small { display: block; color: var(--muted); font-size: 12px; margin-top: 4px; }
.img-form .ig-two { margin-bottom: 0; }
@media (max-width: 760px) { .ig { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } .ig-form { border-right: 0; border-bottom: 1px solid var(--line); max-height: 55vh; } .ig-main { padding-left: 14px; padding-right: 14px; } }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 6px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }

@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  .side { position: fixed; inset: 0 25% 0 0; z-index: 10; transform: translateX(-100%); transition: transform .2s; }
  .app.menu-open .side { transform: none; box-shadow: 0 0 0 100vmax rgba(0,0,0,.35); }
  .menu-btn { display: inline-block; }
  .bar, .thread, .composer, .editor { padding-left: 14px; padding-right: 14px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

<script>
"use strict";
const DIRECT = "";              // chat target id for the plain model chat
const S = {
  update: null,                 // last /api/update result: installed and newest version, update progress
  status: null,                 // last /api/status result
  agents: [],
  skills: [],                   // the skill library
  files: { agent: "", dir: "", file: "" },  // Files tab position
  view: { kind: "chat", agent: DIRECT },
  modelChoice: {},              // target -> model picked in the dropdown
  streams: {},                  // target -> the reply being written (kept here so it survives switching pages)
  drafts: {},                   // target -> unsent text in the message box
  errors: {},                   // target -> the last error, shown until the next message
  models: null,                 // last /api/models result
  chats: {},                    // chat id -> { id, agent, title, messages } for chats opened in this page
  current: {},                  // target -> id of the chat open for it (none means a new, empty chat)
  deletedChats: new Set(),      // ids deleted here, so a reply finishing later does not bring them back
  chatList: null,               // last /api/chats result, for Past chats
  history: { agent: "*", sort: "new", query: "" },   // Past chats filter and order
  unseen: false,                // a reply finished while the browser tab was hidden
  images: null,                 // last /api/images result: sd-cli, settings and image models
  imageForm: { model: "", prompt: "", negative_prompt: "", width: 512, height: 512, steps: 20, cfg_scale: 7, sampler: "", seed: -1 },
  imageJob: null,               // the picture being made (kept here so it survives switching pages)
  imageSelected: null,          // the picture shown large in the Images tab
  imageError: null,
  galleryPlace: "_shared",      // whose images/ folder the gallery shows
  manage: null,                 // last /api/manage result: engines, installed models, running servers, jobs
  manageError: "",              // the last error from a Models page action
  install: { engine: "", name: "", role: "checkpoint", target: "", advanced: false, choose: null, message: "", error: "", sending: false },
};

/* ---------------------------------------------------------------- helpers */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = !!v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid !== null && kid !== undefined && kid !== false)
    el.append(kid instanceof Node ? kid : String(kid));
  return el;
}
const $ = (id) => document.getElementById(id);
function fill(el, ...kids) { el.replaceChildren(...kids.flat(Infinity).filter((k) => k !== null && k !== undefined && k !== false)); }
function esc(s) { return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

async function api(path, options = {}) {
  const opts = { headers: { "Content-Type": "application/json" }, ...options };
  if (opts.body && typeof opts.body !== "string") opts.body = JSON.stringify(opts.body);
  let res;
  try { res = await fetch(path, opts); }
  catch { throw new Error("Axis is not responding. Open the Axis app or run axis again."); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status}).`);
  return data;
}

let toastTimer;
function toast(text) {
  const t = $("toast"); t.textContent = text; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

function store(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch { return false; } }
function recall(key, fallback) {
  try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); } catch { return fallback; }
}
/* Chats are saved by Axis in ~/Axis/chats. S.chats caches the ones opened here;
   S.current maps each agent ("" for Direct chat) to the chat open for it. */
function newChatId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 12);
}
function saveCurrent() { store("axis.current", S.current); }
const chatMessages = (id) => (id && S.chats[id] ? S.chats[id].messages.slice() : []);
const getHistory = (target) => chatMessages(S.current[target]);
const savingChats = {};    // id -> promise chain, so saves of one chat reach Axis in order
function saveChat(id, agent, msgs) {
  if (S.deletedChats.has(id)) return;
  const c = S.chats[id] || (S.chats[id] = { id, agent, title: "", messages: [] });
  c.messages = msgs.slice(); c.agent = agent;
  savingChats[id] = (savingChats[id] || Promise.resolve()).then(async () => {
    if (S.deletedChats.has(id)) return;
    if (c.messages.length) {
      await api("/api/chats/" + encodeURIComponent(id), { method: "PUT", body: { agent: c.agent, title: c.title || "", messages: c.messages } });
      c.saved = true;
    } else if (c.saved) {   // the only message was taken back: nothing left to keep
      await api("/api/chats/" + encodeURIComponent(id), { method: "DELETE" }).catch(() => {});
      c.saved = false;
    }
  }).catch((e) => toast("Could not save the chat: " + e.message));
}
function setHistory(target, msgs) {
  let id = S.current[target];
  if (!id) {
    if (!msgs.length) return;
    id = S.current[target] = newChatId(); saveCurrent();
  }
  saveChat(id, target, msgs);
}
const loadingChats = {};
function loadChat(id) {   // resolves "ok", "missing" or an error message
  if (!loadingChats[id]) {
    loadingChats[id] = api("/api/chats/" + encodeURIComponent(id))
      .then((c) => { S.chats[id] = { ...c, messages: Array.isArray(c.messages) ? c.messages : [], saved: true }; return "ok"; })
      .catch((e) => /does not exist/.test(e.message) ? "missing" : e.message)
      .finally(() => { delete loadingChats[id]; });
  }
  return loadingChats[id];
}
function openChat(agent, id) {
  if (S.current[agent] !== id) delete S.errors[agent];
  if (id) S.current[agent] = id; else delete S.current[agent];
  saveCurrent();
  go({ kind: "chat", agent });
}
// Axis 3.2 and earlier kept one chat per agent in the browser. Move them to Axis once.
async function migrateOldChats() {
  const keys = [];
  for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith("axis.chat:")) keys.push(k); }
  for (const k of keys) {
    const target = k.slice("axis.chat:".length), msgs = recall(k, []);
    if (Array.isArray(msgs) && msgs.length && (!target || agentByName(target))) {
      const id = newChatId();
      try {
        await api("/api/chats/" + id, { method: "PUT", body: { agent: target, messages: msgs } });
        if (!S.current[target]) S.current[target] = id;
      } catch (e) {
        if (/not responding/.test(e.message)) continue;   // try again next time
      }
    }
    try { localStorage.removeItem(k); } catch {}
  }
  saveCurrent();
}
function saveDrafts() { store("axis.drafts", S.drafts); }
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type: type || "text/plain;charset=utf-8" }));
  const a = h("a", { href: url, download: name }); document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
const fmt = (n) => (typeof n === "number" && isFinite(n)) ? n.toLocaleString() : "";
function bigNum(n) {
  if (typeof n !== "number" || !isFinite(n)) return "";
  if (n >= 1e9) return (n / 1e9).toFixed(n >= 1e10 ? 0 : 1) + "B";
  if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + "M";
  return fmt(n);
}
const tokens = (n) => (typeof n === "number" && n > 0) ? fmt(n) + " tokens" : "";

function copyText(text, label) {
  const done = () => toast(label || "Copied");
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  const t = h("textarea", { value: text }); document.body.append(t); t.select();
  try { document.execCommand("copy"); done(); } catch {} t.remove();
}

/* --------------------------------------------------------------- markdown */
function inline(text) {
  return text.split(/(`[^`\n]+`)/).map((part, i) => {
    if (i % 2) return "<code>" + esc(part.slice(1, -1)) + "</code>";
    return esc(part)
      .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, "$1<em>$2</em>")
      .replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  }).join("");
}
function blocks(text) {
  const out = []; let para = []; let list = null;
  const flushPara = () => { if (para.length) out.push("<p>" + para.map(inline).join("<br>") + "</p>"); para = []; };
  const flushList = () => { if (list) out.push(`<${list.tag}>` + list.items.map((i) => "<li>" + inline(i) + "</li>").join("") + `</${list.tag}>`); list = null; };
  for (const line of text.split("\n")) {
    let m;
    if (!line.trim()) { flushPara(); flushList(); }
    else if ((m = line.match(/^(#{1,6})\s+(.*)$/))) { flushPara(); flushList(); out.push((m[1].length <= 2 ? "<h3>" : "<h4>") + inline(m[2]) + (m[1].length <= 2 ? "</h3>" : "</h4>")); }
    else if ((m = line.match(/^\s*[-*+]\s+(.*)$/)) || (m = line.match(/^\s*\d+[.)]\s+(.*)$/))) {
      const tag = /^\s*\d/.test(line) ? "ol" : "ul";
      flushPara(); if (list && list.tag !== tag) flushList();
      list = list || { tag, items: [] }; list.items.push(m[1]);
    }
    else if (list && /^\s{2,}\S/.test(line)) list.items[list.items.length - 1] += " " + line.trim();
    else { flushList(); para.push(line); }
  }
  flushPara(); flushList();
  return out.join("");
}
function markdown(src) {
  return src.split("```").map((part, i) => {
    if (i % 2 === 0) return blocks(part);
    const nl = part.indexOf("\n");
    const code = nl >= 0 ? part.slice(nl + 1) : part;
    return "<pre><code>" + esc(code.replace(/\n$/, "")) + "</code></pre>";
  }).join("");
}

/* ----------------------------------------------------------------- status */
const ready = () => !!(S.status && S.status.ready);

async function refreshStatus() {
  let st;
  try { st = await api("/api/status"); }
  catch (e) { st = { ready: false, axisDown: true, message: e.message, models: [] }; }
  const changed = JSON.stringify(st) !== JSON.stringify(S.status);
  const modelsChanged = JSON.stringify(st.models || []) !== JSON.stringify((S.status && S.status.models) || []);
  S.status = st;
  if (changed) {
    renderStatus();
    if (modelsChanged) loadModels();
    if (S.view.kind === "chat") renderMain();     // safe while replies stream: they are kept in S.streams
  }
}

let modelsLoading = null;
function loadModels() {
  if (modelsLoading) return modelsLoading;
  modelsLoading = api("/api/models")
    .then((d) => { S.models = d; })
    .catch((e) => { S.models = { ready: false, message: e.message, models: [] }; })
    .finally(() => { modelsLoading = null; autoRenderModels(); });
  return modelsLoading;
}
const modelInfo = (name) => (S.models && Array.isArray(S.models.models) && S.models.models.find((m) => m.name === name)) || null;
function contextLimit(name) { const m = modelInfo(name); return m ? (m.context || m.axis_context || null) : null; }

function renderStatus() {

const viewing = (target) => S.view.kind === "chat" && S.view.agent === target;

const streamHere = (target) => { const s = S.streams[target]; return s && s.chatId === S.current[target] ? s : null; };

function renderChat() {
  const target = S.view.agent;
  const agent = target ? agentByName(target) : null;
  if (target && !agent) return go({ kind: "chat", agent: DIRECT });
  const models = (S.status && S.status.models) || [];
  const model = currentModel(target);
  const stream = S.streams[target];
  const chatId = S.current[target];
  if (chatId && !S.chats[chatId]) {          // a saved chat that is not loaded yet
    fill($("main"), h("div", { class: "bar" }, menuButton(), h("h2", {}, agent ? agent.name : "Direct chat")),
      h("div", { class: "thread" }, h("p", { class: "hint", style: "text-align:center" }, "Opening chat\u2026")));
    loadChat(chatId).then((r) => {
      if (r === "missing") { if (S.current[target] === chatId) { delete S.current[target]; saveCurrent(); } }
      else if (r !== "ok") { toast("Could not open the chat: " + r); return; }
      if (viewing(target)) renderChat();
    });
    return;
  }
  const chat = chatId ? S.chats[chatId] : null;

  // Keep the reader's place and focus when this chat is drawn again (status changes, replies finishing).
  const oldThread = $("thread"), oldInput = $("input");
  const sameChat = !!oldThread && oldThread.dataset.target === target;
  const keepScroll = sameChat && !nearBottom(oldThread) ? oldThread.scrollTop : null;
  const active = document.activeElement;
  const takeFocus = !oldInput || active === oldInput || !active || active === document.body;

  const select = h("select", { "aria-label": "Model", disabled: !ready() || !!stream,
    onchange: (e) => { S.modelChoice[target] = e.target.value; renderChat(); } },
    models.map((m) => { const o = h("option", { value: m }, m); o.selected = m === model; return o; }));
  const hasHistory = getHistory(target).length > 0;

  const bar = h("div", { class: "bar" },
    menuButton(),
    h("h2", {}, agent ? agent.name : "Direct chat",
      chat && hasHistory ? h("small", { class: "chat-sub" }, chatTitle(chat)) : null),
    ready() ? h("label", {}, "Model", select) : null,
    agent ? h("button", { class: "btn small", onclick: () => go({ kind: "edit", agent: agent.name }) }, "Edit agent") : null,
    hasHistory ? h("button", { class: "btn small", title: "Download this conversation as a Markdown file", onclick: () => exportChat(target) }, "Export") : null,
    h("button", { class: "btn small", title: "Earlier conversations" + (agent ? " with " + agent.name : ""),
      onclick: () => { S.history.agent = target; go({ kind: "history" }); } }, "Past chats"),
    !ready() || !hasHistory ? null : h("button", { class: "btn small", title: "Start a fresh conversation. This one stays in Past chats.",
      onclick: () => openChat(target, null) }, "New chat"),

  const notes = [];

    notes.push(h("div", { class: "note" }, `This agent prefers ${agent.model}, which is not on. Using ${model}. `,
      h("button", { class: "link", onclick: () => go({ kind: "models" }) }, "Start it on the Models page")));

  const parts = [bar, ...notes];

    parts.push(h("div", { class: "thread" }, gateView()));

    parts.push(h("div", { class: "thread", id: "thread", "data-target": target }, h("div", { class: "thread-inner", id: "thread-inner" })));
    parts.push(composer(target, agent, model));

  renderThread(target, agent, model);
  const t = $("thread");
  if (keepScroll !== null) t.scrollTop = keepScroll; else scrollDown(true);
  const i = $("input");
  i.value = S.drafts[target] || ""; autosize(i);
  if (takeFocus) i.focus({ preventScroll: true });
}

function composer(target, agent, model) {
  const stream = streamHere(target), busyElsewhere = !stream && !!S.streams[target];
  const input = h("textarea", { id: "input", rows: 1, placeholder: agent ? `Message ${agent.name}` : "Message the model",
    "aria-label": "Message",
    oninput: (e) => { autosize(e.target); S.drafts[target] = e.target.value; saveDrafts(); },
    onkeydown: (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(target); } } });
  const btn = stream
    ? h("button", { class: "btn", id: "send", onclick: () => stream.controller.abort() }, "Stop")
    : h("button", { class: "btn primary", id: "send", disabled: busyElsewhere,
        title: busyElsewhere ? "Another chat with this agent is still replying" : null, onclick: () => send(target) }, "Send");
  return h("div", { class: "composer" }, h("div", { class: "composer-inner" }, input, btn),
    h("div", { class: "composer-hint", id: "composer-hint" }, composerHint(target, agent, model)));

function composerHint(target, agent, model) {
  const out = [];
  let text = streamHere(target) ? "Esc or Stop ends the reply."
    : S.streams[target] ? "Another chat with this agent is still replying; you can send once it finishes."
    : "Enter to send, Shift+Enter for a new line.";
  if (agent) {
    const on = agent.skills.filter(skillById).length;
    text += ` ${agent.config.length} config instruction${agent.config.length === 1 ? "" : "s"} and ${on} skill${on === 1 ? "" : "s"} active.`;
    if (agent.skills.some((id) => (skillById(id) || {}).builtin)) {
      const info = modelInfo(model), caps = (info && info.capabilities) || [];
      if (caps.length && !caps.includes("tools"))
        text += ` ${model} has no built-in tool support, so actions use a text format that is less reliable; llama3.1 or qwen3 handle them better.`;
      else if (!caps.length) text += " Actions work best with models that support tools, such as llama3.1, llama3.2, qwen2.5 or qwen3.";
    }
  }
  out.push(text);
  // How full the model's context is, from the token counts of the last reply.
  const msgs = getHistory(target);
  const last = [...msgs].reverse().find((m) => m.role === "assistant" && m.stats && m.stats.context_tokens);
  const limit = contextLimit(model);
  if (last && limit) {
    const used = last.stats.context_tokens, pct = Math.min(100, Math.round(100 * used / limit));
    const tone = pct >= 90 ? "bad" : pct >= 70 ? "warn" : "";
    out.push(" Context", h("span", { class: "meter " + tone, title: `${fmt(used)} of ${fmt(limit)} tokens` }, h("i", { style: `width:${pct}%` })),
      `${fmt(used)} / ${fmt(limit)} tokens.`, pct >= 70 ? " Older messages are dropped as it fills; New chat starts fresh." : "");
  }
  return out;
}

const STEP_TEXT = {

  list_files: ["Listing files", "Listed files"],
  read_file: ["Reading", "Read"],
  write_file: ["Writing", "Wrote"],

  delete_file: ["Deleting", "Deleted"],
  web_search: ["Searching the web for", "Searched the web for"],
  fetch_page: ["Reading", "Read"],
  wikipedia_search: ["Searching Wikipedia for", "Searched Wikipedia for"],
  wikipedia_article: ["Reading Wikipedia:", "Read Wikipedia:"],
  generate_image: ["Making a picture of", "Made a picture of"],
};
const SHARED = "_shared";   // the Files tab's name for the folder agents share
function hasShared(agent) {
  const a = S.agents.find((x) => x.name === agent);
  return !!(a && a.skills.includes("shared-folder"));
}
function openInFiles(agent, path, isFile) {
  if (agent !== SHARED && hasShared(agent) && (path === "shared" || path.startsWith("shared/"))) {
    agent = SHARED; path = path.replace(/^shared\/?/, "");
  }
  const dir = isFile ? path.split("/").slice(0, -1).join("/") : path;
  S.files = { agent, dir, file: isFile ? path : "" };
  go({ kind: "files" });
}
function stepState(p) { return p.output === undefined ? "running" : (p.ok ? "done" : "failed"); }
function stepLabel(p) {
  const words = STEP_TEXT[p.name] || ["Using " + p.name, "Used " + p.name];
  const arg = p.args && ["path", "query", "title", "url", "prompt"].map((k) => p.args[k]).find((v) => typeof v === "string" && v);
  const target = arg ? " " + (arg.length > 80 ? arg.slice(0, 80) + "\u2026" : arg) : "";
  const state = stepState(p);
  return (state === "running" ? words[0] : words[1]) + target + (state === "failed" ? " (failed)" : state === "running" ? "\u2026" : "");
}
function stepView(p, agent, wasOpen) {
  const state = stepState(p);
  const body = h("div", { class: "step-body" });
  if (p.args && typeof p.args.code === "string") body.append(h("div", { class: "step-label" }, "Code"), h("pre", {}, p.args.code));
  if (p.args && typeof p.args.content === "string")
    body.append(h("div", { class: "step-label" }, "Content"), h("pre", {}, p.args.content.length > 4000 ? p.args.content.slice(0, 4000) + "\n\u2026" : p.args.content));
  if (p.args && typeof p.args.raw === "string") body.append(h("div", { class: "step-label" }, "Arguments"), h("pre", {}, p.args.raw));
  if (p.output !== undefined) body.append(h("div", { class: "step-label" }, "Result"), h("pre", {}, p.output));
  if (agent && p.ok) {
    const path = p.args && typeof p.args.path === "string" ? p.args.path.replace(/\\/g, "/").replace(/^\.\//, "") : "";
    const link = (label, to, isFile) => h("button", { class: "link", style: "margin-top:8px", onclick: () => openInFiles(agent, to, isFile) }, label);
    if ((p.name === "write_file" || p.name === "read_file") && path) body.append(link("Open in Files", path, true));
    else if (p.name === "make_folder" && path) body.append(link("Open folder in Files", path, false));
    else if (p.name === "run_python" || p.name === "list_files") body.append(link("Browse this agent\u2019s files", "", false));
    else if (p.name === "generate_image" && imagePath(p)) body.append(link("Open in Files", imagePath(p), true));
  }
  const d = h("details", { class: "step " + state, "data-step": p.id || "" }, h("summary", {}, stepLabel(p)), body);
  if (wasOpen) d.open = true;
  return d;
}
// The picture a generate_image step saved, from its result ("Saved images/x.png (...)").
function imagePath(p) {

  return m ? m[1] : "";
}
function chatImage(p, agent) {

    h("small", {}, path));
}
function partsView(parts, agent, openSteps) {

function statsText(st) {
  if (!st) return "";
  const bits = [];
  if (st.output_tokens) bits.push(`${fmt(st.output_tokens)} tokens`);
  if (st.output_tokens && st.seconds) bits.push(`${(st.output_tokens / st.seconds).toFixed(1)} tokens/s`);
  if (st.elapsed) bits.push(`${st.elapsed < 10 ? st.elapsed.toFixed(1) : Math.round(st.elapsed)} s`);
  return bits.join(" \u00b7 ");
}
function messageView(m, target, isLast) {
  if (m.role === "user") return h("div", { class: "msg user" }, String(m.content || ""));
  const content = String(m.content || "");
  const parts = Array.isArray(m.parts) && m.parts.length ? m.parts : [{ type: "text", text: content }];
  const tools = [];
  if (content.trim()) tools.push(h("button", { class: "link", onclick: () => copyText(content) }, "Copy"));
  if (isLast && ready()) tools.push(h("button", { class: "link", title: "Ask for a new answer to your last message", onclick: () => send(target, { resend: true }) }, "Retry"));

function renderThread(target, agent, model) {
  const inner = $("thread-inner"); if (!inner) return;
  const msgs = getHistory(target);
  const stream = streamHere(target);
  const kids = [];
  if (!msgs.length && !stream) {
    kids.push(h("div", { class: "empty" },
      h("h3", {}, agent ? `Chat with ${agent.name}` : "Start a conversation"),
      h("p", {}, agent ? `${agent.name} will answer using ${model}.` : `You are talking directly to ${model}.`)));
  } else msgs.forEach((m, i) => kids.push(messageView(m, target, i === msgs.length - 1 && !stream)));
  if (stream) {
    const live = h("div", { id: "live", "data-target": target, "data-chat": stream.chatId });
    fillLive(live, stream, target);
    kids.push(live);
  }
  if (S.errors[target] && !stream) {
    kids.push(h("div", { class: "msg error", role: "alert" }, S.errors[target], " ",
      h("button", { class: "link", onclick: () => retry(target) }, "Try again")));
  }
  fill(inner, kids);
}

// The reply being written. Drawn from S.streams, so it reappears whenever this chat is shown again.
function fillLive(live, stream, target) {
  const open = new Set([...live.querySelectorAll("details.step[open]")].map((d) => d.dataset.step));
  const kids = partsView(stream.parts, target, open);
  const last = stream.parts[stream.parts.length - 1];
  const waiting = !last || (last.type === "tool" && last.output !== undefined);
  if (waiting) {
    const label = !stream.parts.length ? (stream.model ? `Thinking with ${stream.model}` : "Thinking") : "Thinking about the result";
    kids.push(h("div", { class: "typing", role: "status" },
      h("span", { class: "dots", "aria-hidden": "true" }, h("i"), h("i"), h("i")),
      h("span", { class: "typing-label" }, label),
      h("span", { class: "elapsed", "data-since": String(stream.started) }, elapsedText(stream.started))));
  }
  fill(live, kids);
}
function elapsedText(since) {
  const s = Math.max(0, Math.floor((Date.now() - Number(since)) / 1000));
  return s < 60 ? s + "s" : Math.floor(s / 60) + "m " + String(s % 60).padStart(2, "0") + "s";
}
function tick() { for (const el of document.querySelectorAll("[data-since]")) el.textContent = elapsedText(el.dataset.since); }

function nearBottom(el) { return el.scrollHeight - el.scrollTop - el.clientHeight < 80; }
function scrollDown(force) { const t = $("thread"); if (t && (force || nearBottom(t))) t.scrollTop = t.scrollHeight; }

// What the model sees for an earlier message: its text plus a short note of any actions,
// so it can refer back to files it made.
function forModel(m) {
  if (m.role !== "assistant" || !Array.isArray(m.parts)) return { role: m.role, content: String(m.content || "") };
  const steps = m.parts.filter((p) => p.type === "tool" && p.ok).map((p) => {
    const target = p.args && p.args.path ? " " + p.args.path : "";
    const out = String(p.output || "").replace(/\s+/g, " ").slice(0, 160);
    return `${p.name}${target} (${out})`;
  });
  const content = String(m.content || "") + (steps.length ? `\n\n[Actions I took in this reply: ${steps.join("; ")}]` : "");
  return { role: "assistant", content: content.trim() || "(no reply)" };
}

const CLIP = 20000;   // keep saved chats small enough for the browser's storage
function clipParts(parts) {

    ...p, output: cut(p.output),
    args: p.args && typeof p.args === "object" ? Object.fromEntries(Object.entries(p.args).map(([k, v]) => [k, cut(v)])) : p.args,

  const last = st[st.length - 1];
  out.output_tokens = st.reduce((a, s) => a + (s.output_tokens || 0), 0) || undefined;
  out.seconds = st.reduce((a, s) => a + (s.seconds || 0), 0) || undefined;
  out.context_tokens = ((last.prompt_tokens || 0) + (last.output_tokens || 0)) || undefined;
  return out;
}

function retry(target) {
  const msgs = getHistory(target);
  if (msgs.length && msgs[msgs.length - 1].role === "user") send(target, { resend: true });
  else send(target);
}

function streamsChanged() {
  renderNav();
  const busy = Object.keys(S.streams).length + (S.imageJob ? 1 : 0);
  document.title = busy ? "Working\u2026 \u00b7 Axis" : S.unseen ? "Reply ready \u00b7 Axis" : "Axis";
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.unseen) { S.unseen = false; streamsChanged(); } });
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape" || S.view.kind !== "chat") return;
  const s = streamHere(S.view.agent);
  if (s) { e.preventDefault(); s.controller.abort(); }
});

function exportChat(target) {
  const msgs = getHistory(target);
  if (!msgs.length) return;
  const chat = S.chats[S.current[target]];
  const lines = [`# ${chat ? chatTitle(chat) : targetName(target)}`, "", `${targetName(target)}, exported from Axis on ${new Date().toLocaleString()}.`, ""];
  for (const m of msgs) {
    if (m.role === "user") { lines.push("## You", "", String(m.content || ""), ""); continue; }
    lines.push(`## ${target || "Model"}${m.model ? ` (${m.model})` : ""}`, "");
    const parts = Array.isArray(m.parts) && m.parts.length ? m.parts : [{ type: "text", text: String(m.content || "") }];
    for (const p of parts) {
      if (p.type !== "tool") { lines.push(p.text, ""); continue; }
      lines.push(`> **${stepLabel(p)}**`);
      if (p.args && typeof p.args.code === "string") lines.push("", "```python", p.args.code, "```");
      if (p.output !== undefined) lines.push("", "```", String(p.output), "```");
      lines.push("");
    }
  }
  const stamp = new Date().toISOString().slice(0, 10);
  download(`${target || "direct-chat"}-${stamp}.md`, lines.join("\n"), "text/markdown;charset=utf-8");
}

async function send(target, { resend = false } = {}) {
  if (S.streams[target] || !ready()) return;
  const msgs = getHistory(target);
  let text;
  if (resend) {
    while (msgs.length && msgs[msgs.length - 1].role === "assistant") msgs.pop();
    if (!msgs.length) return;
    text = String(msgs[msgs.length - 1].content || "");
  } else {
    const input = viewing(target) ? $("input") : null;
    text = (input ? input.value : S.drafts[target] || "").trim();
    if (!text) return;
    msgs.push({ role: "user", content: text });
    S.drafts[target] = ""; saveDrafts();
  }
  setHistory(target, msgs);
  delete S.errors[target];

  const model = currentModel(target);
  const stream = { controller: new AbortController(), parts: [], stats: [], started: Date.now(), model, roundStart: 0, frame: 0, error: null,
    chatId: S.current[target] };   // the reply is saved into this chat even if another one is opened meanwhile
  S.streams[target] = stream;
  streamsChanged();
  if (viewing(target)) renderChat();          // shows the new message, the thinking indicator and the Stop button

  const paint = () => {
    stream.frame = 0;
    const live = $("live");
    if (!live || live.dataset.target !== target || live.dataset.chat !== stream.chatId) return;   // not on screen; drawn when it comes back
    const stick = nearBottom($("thread"));
    fillLive(live, stream, target);
    if (stick) scrollDown(true);
  };
  const schedule = () => {
    if (stream.frame) return;
    // Animation frames pause in background tabs; a timer keeps the state current there.
    stream.timer = document.hidden;
    stream.frame = stream.timer ? setTimeout(paint, 250) : requestAnimationFrame(paint);
  };
  const parts = stream.parts;
  const onEvent = (ev) => {
    if (ev.model) stream.model = ev.model;
    if (ev.t) {
      const last = parts[parts.length - 1];
      if (last && last.type === "text") last.text += ev.t; else parts.push({ type: "text", text: ev.t });
    }
    if (ev.round !== undefined) stream.roundStart = parts.length;
    if (ev.rewrite !== undefined) {
      parts.splice(stream.roundStart);
      if (ev.rewrite.trim()) parts.push({ type: "text", text: ev.rewrite });
    }
    if (ev.tool) parts.push({ type: "tool", id: ev.tool.id, name: ev.tool.name, args: ev.tool.args });
    if (ev.tool_result) {
      const step = parts.find((p) => p.type === "tool" && p.id === ev.tool_result.id && p.output === undefined);
      if (step) { step.ok = ev.tool_result.ok; step.output = ev.tool_result.output; }
    }
    if (ev.stats) stream.stats.push(ev.stats);
    if (ev.error) stream.error = ev.error;
    schedule();
  };

  let aborted = false;
  try {
    const history = msgs.map(forModel);
    const res = await fetch("/api/chat", { method: "POST", signal: stream.controller.signal,
      headers: { "Content-Type": "application/json" }, body: JSON.stringify({ agent: target || null, model, messages: history }) });
    if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(d.error || `Request failed (${res.status}).`); }
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
        if (!line) continue;
        let ev;
        try { ev = JSON.parse(line); } catch { continue; }
        onEvent(ev);
      }
    }
  } catch (e) {
    if (e.name === "AbortError") aborted = true;
    else stream.error = e.name === "TypeError" ? "Axis is not responding. Check that the axis window is still open." : e.message;
  }
  if (stream.frame) { if (stream.timer) clearTimeout(stream.frame); else cancelAnimationFrame(stream.frame); stream.frame = 0; }
  delete S.streams[target];
  for (const p of parts) if (p.type === "tool" && p.output === undefined) { p.ok = false; p.output = "Stopped before this finished."; }

  if ((target && !agentByName(target)) || S.deletedChats.has(stream.chatId)) { streamsChanged(); return; }   // deleted meanwhile
  const reply = parts.filter((p) => p.type === "text").map((p) => p.text).join("");
  const got = !!reply.trim() || parts.some((p) => p.type === "tool");
  const saved = chatMessages(stream.chatId);
  if (got) {
    saved.push({ role: "assistant", content: reply, parts: clipParts(parts), model: stream.model,
      stats: summarize(stream), stopped: aborted || undefined });
  } else if (!resend && saved.length && saved[saved.length - 1].role === "user") {
    saved.pop();                                    // nothing came back: undo the message and give the text back
    if (!(S.drafts[target] || "").trim()) { S.drafts[target] = text; saveDrafts(); }
  }
  saveChat(stream.chatId, target, saved);
  if (S.chatList) S.chatList = null;               // Past chats re-reads the list next time
  if (stream.error && S.current[target] === stream.chatId) S.errors[target] = stream.error;
  if (document.hidden) S.unseen = true;
  streamsChanged();
  if (stream.stats.length) loadModels();           // the context size may have changed (Ollama reloads at Axis's size)

  if (viewing(target)) renderChat();
  else if (got || stream.error) toast(`${targetName(target)}: ${stream.error ? "the reply failed" : "reply ready"}`);
  if (S.view.kind === "history") loadChatList().then(drawChatList);
  if (stream.error) refreshStatus();
}

function size(n) {
  if (n === null || n === undefined) return "";
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
  if (n < 1073741824) return (n / 1048576).toFixed(1) + " MB";
  return (n / 1073741824).toFixed(1) + " GB";
}
function when(iso) {
  const d = new Date(iso); if (isNaN(d)) return "";
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + " " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}

function parseCsv(text, limit) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length && rows.length < limit; i++) {
    const c = text[i];
    if (q) { if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (c === '"') q = false; else cell += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n") { row.push(cell.replace(/\r$/, "")); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if ((cell || row.length) && rows.length < limit) { row.push(cell); rows.push(row); }
  return rows;
}

const MAX_UPLOAD = 512 * 1024 * 1024;
async function uploadFiles(fileList) {
  const { agent, dir } = S.files;
  const files = [...(fileList || [])];
  if (!files.length || !agent) return;
  let done = 0;
  for (const file of files) {
    if (file.size > MAX_UPLOAD) { toast(`${file.name} is larger than 512 MB.`); continue; }
    toast(`Uploading ${file.name}\u2026`);
    try {
      const res = await fetch(filesUrl(agent, "upload", dir, "&name=" + encodeURIComponent(file.name)),
        { method: "POST", headers: { "Content-Type": "application/octet-stream" }, body: file });
      const d = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(d.error || `Upload failed (${res.status}).`);
      done++;
    } catch (e) { toast(e.name === "TypeError" ? `Could not upload ${file.name} (folders cannot be uploaded).` : e.message); }
  }
  if (done) toast(`Uploaded ${done} file${done === 1 ? "" : "s"} to ${agent}`);
  if (S.view.kind === "files" && S.files.agent === agent) loadListing(true);
}
async function newFolder() {
  const name = (prompt("Name of the new folder:") || "").trim();
  if (!name) return;
  if (/[\\/:*?"<>|]/.test(name) || name === "." || name === "..") return toast("Folder names cannot contain \\ / : * ? \" < > |");
  const path = S.files.dir ? S.files.dir + "/" + name : name;
  try { await api(filesUrl(S.files.agent, "mkdir", path), { method: "POST" }); openDir(path); }
  catch (e) { toast(e.message); }
}
async function deletePath(path, isDir) {
  const what = isDir ? `the folder ${path} and everything in it` : path;
  if (!confirm(`Delete ${what}? This cannot be undone.`)) return;
  try {
    await api(filesUrl(S.files.agent, "", path), { method: "DELETE" });
    toast("Deleted");
    if (isDir) openDir(path.split("/").slice(0, -1).join("/"));
    else { S.files.file = ""; showFile(); loadListing(true); }
  } catch (e) { toast(e.message); }
}

let lastListing = "";
async function loadListing(force) {

function markCurrent() {

async function showFile() {
  const f = S.files, view = $("fb-view");
  if (!view) return;
  if (!f.file) {
    return fill(view, h("div", { class: "empty", style: "margin-top:8vh" },
      h("h3", {}, "Choose a file"), h("p", {}, "Click a file to open it here, or a folder to look inside it.")));
  }
  fill(view, h("p", { class: "fb-meta" }, "Opening\u2026"));
  let d;
  try { d = await api(filesUrl(f.agent, "view", f.file)); }
  catch (e) { return fill(view, h("p", { class: "form-error" }, e.message)); }
  if (S.files.file !== d.path || S.files.agent !== d.agent) return;   // the user clicked something else meanwhile
  const raw = filesUrl(d.agent, "raw", d.path);
  const ext = (d.name.match(/\.([^.]+)$/) || ["", ""])[1].toLowerCase();
  const body = h("div", {});
  const actions = h("div", { class: "fb-actions" },
    h("a", { class: "btn small", href: raw + "&download=1", download: d.name }, "Download"),
    h("button", { class: "btn small", onclick: () => api(filesUrl(d.agent, "reveal", d.path), { method: "POST" }).catch((e) => toast(e.message)) }, "Show in folder"),
    d.kind === "text" ? h("button", { class: "btn small", onclick: () => copyText(d.text, "Text copied") }, "Copy text") : null,
    h("button", { class: "btn small danger", onclick: () => deletePath(d.path, false) }, "Delete"));

  const showText = () => fill(body, h("pre", {}, d.text));
  if (d.kind === "image") body.append(h("img", { src: raw, alt: d.name }));
  else if (d.kind === "pdf") { body.append(h("iframe", { src: raw, title: d.name })); actions.append(h("a", { class: "btn small", href: raw, target: "_blank", rel: "noopener" }, "Open in new tab")); }
  else if (d.kind === "binary") body.append(h("p", { class: "hint" }, "This file is not text or an image, so it cannot be shown here. Use Download or Show in folder."));
  else if (ext === "md" || ext === "markdown") {
    const rendered = () => { const div = h("div", { class: "fb-md msg ai" }); div.innerHTML = markdown(d.text); fill(body, div); };
    let source = false;
    actions.append(h("button", { class: "btn small", onclick: (e) => { source = !source; e.target.textContent = source ? "Show formatted" : "Show source"; source ? showText() : rendered(); } }, "Show source"));
    rendered();
  } else if (ext === "csv") {
    const rows = parseCsv(d.text, 501);
    const [head, ...rest] = rows;
    const table = h("table", {}, head ? h("thead", {}, h("tr", {}, head.map((c) => h("th", {}, c)))) : null,
      h("tbody", {}, rest.slice(0, 500).map((r) => h("tr", {}, r.map((c) => h("td", {}, c))))));
    let source = false;
    const asTable = () => fill(body, h("div", { class: "fb-table" }, table), rows.length > 500 ? h("p", { class: "hint" }, "Showing the first 500 rows.") : null);
    actions.append(h("button", { class: "btn small", onclick: (e) => { source = !source; e.target.textContent = source ? "Show table" : "Show source"; source ? showText() : asTable(); } }, "Show source"));
    asTable();
  } else if (ext === "html" || ext === "htm") {
    let preview = false;
    const page = () => fill(body, h("iframe", { sandbox: "allow-scripts", srcdoc: d.text, title: d.name }));
    actions.append(h("button", { class: "btn small", onclick: (e) => { preview = !preview; e.target.textContent = preview ? "Show source" : "Preview page"; preview ? page() : showText(); } }, "Preview page"));
    showText();
  } else showText();

  fill(view, h("h3", {}, d.name), h("p", { class: "fb-meta" }, `${d.path}, ${size(d.size)}, changed ${when(d.modified)}`),
    actions, body, d.truncated ? h("p", { class: "hint", style: "margin-top:8px" }, "Only the first 512 KB is shown. Download the file to see all of it.") : null);
}

  catch (e) { toast(e.message); S.chatList = S.chatList || []; }
}

function renderHistory() {

  if (hv.agent !== "*" && hv.agent !== DIRECT && !agentByName(hv.agent)) hv.agent = "*";

function drawChatList() {
  const box = $("chat-list"); if (!box || !S.chatList) return;
  const hv = S.history, q = hv.query.trim().toLowerCase();
  let list = S.chatList.filter((c) => (hv.agent === "*" || c.agent === hv.agent) && (!q || c.title.toLowerCase().includes(q)));
  const byNew = (a, b) => (b.updated || "").localeCompare(a.updated || "");
  if (hv.sort === "old") list.sort((a, b) => byNew(b, a));
  else if (hv.sort === "title") list.sort((a, b) => a.title.localeCompare(b.title, undefined, { sensitivity: "base" }) || byNew(a, b));
  else if (hv.sort === "agent") list.sort((a, b) => (a.agent ? 1 : 0) - (b.agent ? 1 : 0) || a.agent.localeCompare(b.agent, undefined, { sensitivity: "base" }) || byNew(a, b));
  else list.sort(byNew);

  if (!list.length) {
    const none = !S.chatList.length;
    return fill(box, h("div", { class: "empty" }, h("h3", {}, none ? "No saved chats yet" : "No chats match"),
      h("p", {}, none ? "Every conversation, with an agent or in Direct chat, is saved here automatically." : "Try another agent or search.")));
  }
  const rows = [];
  let group = null;
  for (const c of list) {
    if (hv.sort === "agent" && c.agent !== group) { group = c.agent; rows.push(h("h3", { class: "chat-group" }, targetName(c.agent))); }
    rows.push(chatRow(c));
  }
  const shown = list.length === S.chatList.length ? `${list.length} chat${list.length === 1 ? "" : "s"}` : `${list.length} of ${S.chatList.length} chats`;
  fill(box, h("p", { class: "summary-line" }, shown), rows);
}

function chatRow(c) {
  const exists = !c.agent || !!agentByName(c.agent);
  const stream = S.streams[c.agent];
  const working = !!(stream && stream.chatId === c.id);
  const isOpen = S.current[c.agent] === c.id;
  const meta = [targetName(c.agent) + (exists ? "" : " (deleted agent)"), `${c.messages} message${c.messages === 1 ? "" : "s"}`, when(c.updated)].filter(Boolean).join(" \u00b7 ");
  return h("div", { class: "chat-row" },
    h("button", { class: "chat-open", disabled: !exists, title: exists ? "Open this chat" : "This chat\u2019s agent no longer exists", onclick: () => openChat(c.agent, c.id) },
      h("span", { class: "chat-title" }, c.title,
        working ? h("span", { class: "chip on" }, "Working") : isOpen ? h("span", { class: "chip" }, "Open") : null),
      h("small", {}, meta)),
    h("div", { class: "chat-actions" },
      h("button", { class: "link", onclick: () => renameChat(c) }, "Rename"),
      h("button", { class: "link", style: "color:var(--bad)", onclick: () => deleteChat(c) }, "Delete")));
}

async function renameChat(c) {
  const title = prompt("Chat title (leave empty to use the first message):", c.custom_title ? c.title : "");
  if (title === null) return;
  try {
    await api("/api/chats/" + encodeURIComponent(c.id), { method: "PATCH", body: { title } });
    if (S.chats[c.id]) S.chats[c.id].title = title.trim();
    await loadChatList(); drawChatList();
  } catch (e) { toast(e.message); }
}

async function deleteChat(c) {
  if (!confirm(`Delete the chat \u201c${c.title}\u201d? This cannot be undone.`)) return;
  const stream = S.streams[c.agent];
  if (stream && stream.chatId === c.id) stream.controller.abort();
  S.deletedChats.add(c.id);
  try {
    await (savingChats[c.id] || Promise.resolve());          // let a save in progress finish first
    await api("/api/chats/" + encodeURIComponent(c.id), { method: "DELETE" });
  } catch (e) { if (!/does not exist/.test(e.message)) { S.deletedChats.delete(c.id); return toast(e.message); } }
  delete S.chats[c.id];
  if (S.current[c.agent] === c.id) { delete S.current[c.agent]; delete S.errors[c.agent]; saveCurrent(); }
  S.chatList = (S.chatList || []).filter((x) => x.id !== c.id);
  toast("Chat deleted");
  drawChatList();
}

/* ---------------------------------------------------------------- models */
// The Models page installs, starts, stops and deletes models. Long operations run as jobs in Axis;
// this page polls /api/manage to show their progress, so they survive switching pages or reloading.
const CAP_TEXT = { completion: "Chat", tools: "Tools", vision: "Vision", thinking: "Thinking", embedding: "Embeddings", insert: "Fill-in", audio: "Audio" };
function gpuText(m) {
  if (typeof m.gpu_percent !== "number") return "";
  if (m.gpu_percent >= 100) return "all on the GPU";
  if (m.gpu_percent <= 0) return "all in system RAM (CPU)";
  return `${m.gpu_percent}% GPU, ${100 - m.gpu_percent}% CPU`;
}
function expiresText(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return "";
  if (d.getFullYear() > 2100) return "until you stop it";
  return "until " + when(iso);
}
function durationText(sec) {
  if (!isFinite(sec) || sec <= 0) return "";
  if (sec < 90) return Math.round(sec) + " s";
  if (sec < 5400) return Math.round(sec / 60) + " min";
  return (sec / 3600).toFixed(1) + " h";
}
const extLink = (href, text) => h("a", { href, target: "_blank", rel: "noopener" }, text);

/* --- manage state and polling */
let manageTimer = null, manageLoading = null;
function loadManage() {
  if (manageLoading) return manageLoading;
  manageLoading = api("/api/manage")
    .then((d) => { const before = S.manage; S.manage = d; onManage(before, d); })
    .catch((e) => { if (!S.manage || !S.manage.llamacpp) S.manage = { error: e.message, jobs: [] }; })
    .finally(() => { manageLoading = null; scheduleManage(); });
  return manageLoading;
}
const runningJobs = (d) => ((d && d.jobs) || []).filter((j) => j.state === "running");
function scheduleManage() {
  clearTimeout(manageTimer);
  const busy = runningJobs(S.manage).length > 0;
  if (busy || S.view.kind === "models") manageTimer = setTimeout(loadManage, busy ? 1000 : 4000);
}
const jobSig = (d) => JSON.stringify(((d && d.jobs) || []).map((j) => [j.id, j.state, j.cancel_requested, j.cancellable]));
function runSig(d) {
  if (!d || !d.llamacpp) return "";
  return JSON.stringify([d.ollama, d.llamacpp.binary, d.llamacpp.models.map((m) => [m.id, m.running, m.ready, !!m.crashed]),
    d.image.running, Object.keys(d.image.crashed || {}), d.image.sd_server, d.engines]);
}
function doneText(j) {
  const named = j.label.replace(/^(Installing|Starting|Stopping|Deleting) /, "");
  const what = j.kind === "install" ? ((j.result && j.result.model) || named) : named;
  if (j.kind === "start") return (j.target ? what : "Ollama") + " is on";
  return { install: `Installed ${what}`, stop: `Stopped ${what}`, delete: `Deleted ${what}` }[j.kind] || "Done";
}
const jobsSeen = new Set();   // finished jobs already acted on (a fast job can finish between two polls)
function onManage(before, d) {
  const first = !before || !before.llamacpp;
  let finished = false, imageDone = false;
  for (const j of d.jobs || []) {
    if (j.state === "running" || jobsSeen.has(j.id)) continue;
    jobsSeen.add(j.id);
    if (first) continue;   // finished before this page opened: nothing to announce
    finished = true;
    if (j.engine === "image" || j.engine === "engine") imageDone = true;
    if (j.state === "done") toast(doneText(j));
    else if (j.state === "failed") toast(j.label + " failed. Details are on the Models page.");
  }
  if (finished) {
    loadModels();
    if (imageDone) loadImages().then(() => { autoRenderModels(); if (S.view.kind === "images") renderImages(); });
    refreshStatus();
  }
  if (jobSig(before) !== jobSig(d)) renderNav();
  if (S.view.kind !== "models") return;
  if (finished || jobSig(before) !== jobSig(d) || runSig(before) !== runSig(d)) autoRenderModels();
  else updateJobProgress(d);
}
const busyJob = (engine, target) => runningJobs(S.manage).find((j) => j.engine === engine && j.target === target) || null;

/* The page redraws itself as jobs progress. It never does so while the user is filling in a form,
   so nothing typed is lost; progress bars still update in place. */
function editingModels() {
  const main = $("main");
  if (!main || main.querySelector("[data-dirty], form.img-form")) return true;
  const a = document.activeElement;
  return !!(a && main.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.id !== "install-name" && !a.dataset.free);
}
function autoRenderModels() {
  if (S.view.kind !== "models") return updateHint();
  if (editingModels()) { updateJobProgress(S.manage); return; }
  renderModels();
}
function updateJobProgress(d) {
  for (const j of runningJobs(d)) {
    for (const el of document.querySelectorAll(`[data-job="${j.id}"]`)) {
      const ph = el.querySelector(".job-phase");
      if (ph) ph.textContent = jobMeta(j);
      const bar = el.querySelector(".ig-progress");
      if (bar) {
        bar.classList.toggle("indef", typeof j.percent !== "number");
        bar.firstChild.style.width = typeof j.percent === "number" ? j.percent.toFixed(1) + "%" : "";
      }
    }
  }
}
function jobMeta(j) {
  if (j.state === "failed") return j.error || "Failed.";
  if (j.state === "cancelled") return "Cancelled.";
  if (j.state === "done") return "Done.";
  const parts = [j.cancel_requested ? "Cancelling\u2026" : (j.phase || "Working\u2026")];
  if (j.total) parts.push(`${size(j.done || 0)} of ${size(j.total)}`);
  if (j.rate && j.total) {
    parts.push(size(j.rate) + "/s");
    const left = durationText((j.total - (j.done || 0)) / j.rate);
    if (left) parts.push(left + " left");
  }
  return parts.join(", ");
}
function progressBar(j) {
  const pct = typeof j.percent === "number" ? j.percent : null;
  return h("div", { class: "ig-progress" + (pct === null ? " indef" : "") }, h("i", { style: pct === null ? null : `width:${pct.toFixed(1)}%` }));
}
async function cancelJob(j) {
  try { await api(`/api/manage/jobs/${encodeURIComponent(j.id)}/cancel`, { method: "POST" }); } catch (e) { toast(e.message); }
  loadManage();
}
async function dismissJob(j) {
  try { await api(`/api/manage/jobs/${encodeURIComponent(j.id)}`, { method: "DELETE" }); } catch (e) { toast(e.message); }
  if (S.manage) S.manage.jobs = (S.manage.jobs || []).filter((x) => x.id !== j.id);
  renderModels();
}
function jobView(j) {
  return h("div", { class: "job " + j.state, "data-job": j.id },
    h("div", { class: "job-head" }, h("strong", {}, j.label),
      j.state === "running" && j.cancellable && !j.cancel_requested ? h("button", { class: "btn small", onclick: () => cancelJob(j) }, "Cancel") : null,
      j.state !== "running" ? h("button", { class: "btn small", onclick: () => dismissJob(j) }, "Dismiss") : null),
    j.state === "running" ? progressBar(j) : null,
    h("div", { class: "job-meta job-phase" }, jobMeta(j)));
}
function busyView(j) {
  return h("div", { class: "job-inline", "data-job": j.id }, progressBar(j),
    h("div", { class: "job-head" }, h("span", { class: "job-meta job-phase" }, jobMeta(j)),
      j.cancellable && !j.cancel_requested ? h("button", { class: "btn small", onclick: () => cancelJob(j) }, "Cancel") : null));
}
async function manageAction(action, body) {
  S.manageError = "";
  try { await api("/api/manage/" + action, { method: "POST", body }); }
  catch (e) { S.manageError = e.message; }
  await loadManage();

}
/* Delete asks for confirmation inside the card, so the reader sees exactly what goes. */
function confirmRow(row, text, yes, extra) {
  fill(row, h("div", { class: "confirm", role: "alertdialog", "data-dirty": "1" },

    h("button", { class: "btn small danger", onclick: yes }, "Delete"),

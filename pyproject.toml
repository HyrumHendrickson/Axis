[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axis-agent-manager"
version = "3.7.0"
description = "A local web app for chatting with agents, with chat and image models it installs, starts and stops through Ollama, llama.cpp and stable-diffusion.cpp, which it installs itself"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Hyrum Hendrickson" }]
dependencies = []  # standard library only

[project.scripts]
axis = "axis.cli:main"

[tool.setuptools]
packages = ["axis"]

[tool.setuptools.package-data]
axis = ["web/*.html"]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axis-agent-manager"
dynamic = ["version"]
description = "A local web app for chatting with agents, with chat, image and OCR models it installs, starts and stops through Ollama, llama.cpp, stable-diffusion.cpp, Tesseract and PyTorch, which it installs itself"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Hyrum Hendrickson" }]
keywords = ["llm", "local-ai", "agents", "ollama", "llama.cpp", "stable-diffusion", "ocr", "offline", "privacy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []  # standard library only: see docs/principles.md

[project.urls]
Homepage = "https://github.com/HyrumHendrickson/Axis"
Documentation = "https://github.com/HyrumHendrickson/Axis/tree/main/docs"
Issues = "https://github.com/HyrumHendrickson/Axis/issues"
Changelog = "https://github.com/HyrumHendrickson/Axis/blob/main/CHANGELOG.md"

[project.scripts]
axis = "axis.cli:main"

[tool.setuptools]
packages = ["axis"]

[tool.setuptools.package-data]
axis = ["VERSION", "web/*.html", "icons/*"]

[tool.setuptools.dynamic]
version = { file = "axis/VERSION" }
